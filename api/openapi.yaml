openapi: 3.1.0
info:
  title: Jewelcase API
  version: 1.0.0-draft
  summary: The public API of a Jewelcase server, used by first-party and third-party clients alike.
  description: |
    The contract between Jewelcase servers and every client. First-party clients use
    nothing outside it (`design/general.md` §6). Requirements cited as
    `requirements/file.md` §N.

    This spec describes what the server serves, plus the playlist operations not built yet,
    which are marked **Planned**. Each feature adds its operations here when it is built; git history
    keeps the earlier design.

    ## Conventions

    **Planned.** An operation whose description starts with **Planned:** is not served yet:
    the server answers `404` or `405` to it, and for most of them the web client's
    development mock answers in its place. A parameter, value, or property marked planned is
    not built yet either: the server answers `422` to a planned parameter or value in a
    request, and never sends a planned property or value.

    **Base path.** Paths are relative to `{basePath}/api/v1`. A server may sit under any
    prefix behind a reverse proxy; clients never assume the domain root.

    **Authentication.** Login registers a device and returns an opaque token. Send it as
    `Authorization: Bearer <token>`. The web client may instead rely on the
    `jewelcase_session` cookie set at setup or login; a cookie-authenticated request that
    changes state must carry an `X-Jewelcase-Client` header or it is refused with `403`. A
    login or setup that carries that header is signed in by the cookie alone and gets no
    token in its body. Any authenticated endpoint may answer `401` — see `Problem.reason` for
    whether a device keeps its downloads (`requirements/offline.md` §9).

    **Scope.** Paths under `/libraries/{libraryId}` are scoped to that library. Anything
    the caller cannot reach answers `404`, exactly as if it did not exist; every operation
    under `/admin` answers `403` to an account that is not an admin or the owner, whatever
    its path names (`requirements/users.md` §10). Identifiers in a request select within the
    caller's scope and never widen it.

    **Personal data.** `/me` is the caller's own account. Content schemas keep the caller's
    own listening in a `personal` object, which is planned.

    **Optimistic writes.** Writes clients apply locally before confirmation — player
    commands and plays — carry a client-generated ID in the body (`commandId`, `playId`).
    The server applies each ID once however often it arrives (for player commands, see
    `CommandResult`), so a device and the server agree without a round trip. Playlists need
    neither: the server assigns a playlist's ID, and edits name its tracks by position at a
    version; creating and editing one take an `Idempotency-Key`, so a retry is not applied
    twice.

    **Pagination.** The lists that can grow without bound — tracks, albums, artists,
    playlists, a playlist's items, and kept queues — are cursor-paged: pass the previous page's
    `nextCursor` as `cursor`, with the same `sort` and `order`; the last page's `nextCursor`
    is `null`. `limit` defaults to 100 and may be up to 1000 — a bound on one transfer,
    never on a collection. Each page reports the list's `total`. Every other list is one
    `items` array.

    **Absent and null.** In a response, a property whose type allows `null` is always sent,
    as `null` when it has no value; a property a response may leave out is never `null`.

    **Errors.** `application/problem+json` (RFC 9457) with a machine-readable `code`, and a
    `detail` that says what was wrong where there is more to say. Besides what each
    operation lists, any operation may answer:
    - `401` and `403` as **Authentication** and **Scope** say;
    - `404 not_found` for something its path names that does not exist or is out of the
      caller's reach, or a path parameter that is not an ID at all;
    - `422 validation_failed` for a request it cannot accept: a body or query parameter that
      is malformed or out of bounds, or a query parameter the operation does not take, a
      planned one included;
    - `405 method_not_allowed` for a method its path does not support;
    - `503 setup_required` until first-run setup is done (`completeSetup`);
    - `500 internal` for an unexpected failure, whose cause is logged on the server, never
      sent.

    **Units.** Track and collection durations are integer microseconds (`durationUs`) so
    totals never drift; positions and listen time are integer milliseconds. Timestamps
    are RFC 3339 UTC. Release dates are partial dates at tag precision: `YYYY`,
    `YYYY-MM`, or `YYYY-MM-DD`.

    **Unknown values.** An untagged album or artist is a real entity whose `title` or
    `name` is `null`; clients render it as unknown (`requirements/scanning.md` §2).

    **Draft shapes.** `x-status: draft` marks what is served but may still change shape:
    audio delivery, which waits on its design (`design/general.md` §11); the waveform, whose
    bin count is still open (`design/scanning.md`). The player's `itemId` is stable, like the
    queue contract it names.

    **Realtime.** `GET /realtime` upgrades to a WebSocket carrying
    `RealtimeClientMessage` and `RealtimeServerMessage`.
servers:
  - url: '{basePath}/api/v1'
    variables:
      basePath:
        default: ''
        description: Prefix the server is mounted under, if any.
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Server
    description: Health and server information, unauthenticated.
  - name: Auth
    description: Setup, login, invites, and password resets.
  - name: Account
    description: The caller's profile and settings.
  - name: Devices
    description: Logged-in devices and their settings (`requirements/users.md` §4, §6.1).
  - name: Libraries
    description: The libraries the caller can access.
  - name: Browse
    description: Tracks, albums, artists, and tags (`requirements/conventions.md` §4).
  - name: Media
    description: Artwork, lyrics, waveforms, and audio delivery.
  - name: Search
    description: Library search and recent searches (`requirements/search.md`).
  - name: Playlists
    description: Saved playlists (`requirements/playlists.md`).
  - name: Player
    description: Playback state, remote control, and Shift (`requirements/realtime.md`).
  - name: Queue
    description: The account's queue (`requirements/queue.md`, `design/queue.md`).
  - name: Listening
    description: Plays, history, statistics, and summaries (`requirements/analytics.md`).
  - name: Realtime
    description: The WebSocket connection for live updates and Shift (`requirements/realtime.md`).
  - name: Admin
    description: Server administration. Admin or owner role required unless stated.

paths:
  # ───────────────────────────── Server ─────────────────────────────
  /health:
    get:
      tags: [Server]
      summary: Health check
      description: Reports whether the server can actually serve, for container orchestration (`requirements/deployment.md` §7).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Able to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Running but unable to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /server:
    get:
      tags: [Server]
      summary: Server information
      description: Unauthenticated. Tells a client whether first-run setup is still required.
      operationId: getServerInfo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  # ───────────────────────────── Auth ─────────────────────────────
  /setup:
    post:
      tags: [Auth]
      summary: Create the owner account
      description: |
        First-run setup (`requirements/users.md` §2.1). Until it completes, every other
        endpoint except `/health` and `/server` answers `503 setup_required`. Once an owner
        exists this endpoint answers `404`.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Owner created and logged in on this device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422':
          description: '`weak_password` — the password is too easy to guess; `detail` says why.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and register a device
      description: |
        Failure is identical for an unknown account, a wrong password, and a suspended
        account (`requirements/users.md` §3). Repeated failures are delayed, then
        temporarily locked, per account and per origin (`requirements/users.md` §3.1).
        A device logged out with `credentials_changed` passes its `deviceId` to log back in
        as itself.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in. Also sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: '`invalid_credentials`, whatever the cause.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `validation_failed` — `username` is not a valid `Username`, or `device` is malformed,
            so no account was looked up.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out this device
      description: Removes the device. Its downloads are removed (`requirements/offline.md` §9).
      operationId: logout
      responses:
        '204': { description: Logged out. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Account ─────────────────────────────
  /me:
    get:
      tags: [Account]
      summary: Get the caller's account
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins:
    get:
      tags: [Account]
      summary: List the plugins the caller can connect
      description: |
        Plugins that act for each person, such as a scrobbler, connected with the person's own
        account on its service (`requirements/plugins.md` §4.1, §6): every installed plugin
        with personal settings that is enabled in a library the caller reaches.
      operationId: listMyPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalPlugin' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Account]
      summary: Get the caller's settings for a plugin
      description: |
        Per-user settings and credentials for personal sources (`requirements/plugins.md` §6),
        as the plugin's `personalSettings` declare them. They are the person's, the same in
        every library. Secrets are never returned. Any plugin not in `listMyPlugins` answers
        `404`.
      operationId: getMyPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Account]
      summary: Connect a plugin, or change what it is connected with
      description: |
        Every required setting must have a value. Validated by the plugin when entered, run with
        these and the server-wide settings. The plugin receives the caller's listening from then
        on, never what came before.
      operationId: setMyPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '422': { $ref: '#/components/responses/PluginSettingsInvalid' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Account]
      summary: Disconnect a plugin
      description: |
        Forgets the caller's settings for it; it stops acting for them. Sharing their searches
        with it stops too, as `setMySearchSharing` turning it off does.
      operationId: disconnectMyPlugin
      responses:
        '204': { description: 'Disconnected, or never connected.' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins/{pluginId}/search-sharing:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    put:
      tags: [Account]
      summary: Turn sharing the caller's searches with a plugin on or off
      description: |
        Off until the caller turns it on (`requirements/search.md` §6). On, the plugin is sent
        each search the caller settles on from then, never one before. Off, or disconnecting,
        asks it to forget every search it was sent; what it already sent on is not recalled
        (`requirements/users.md` §7). Turning it on needs the caller to have connected the
        plugin, and the plugin to ask for searches (`asksForSearches`).
      operationId: setMySearchSharing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchSharing' }
      responses:
        '204': { description: Set. }
        '422':
          description: '`validation_failed` — turned on before the caller connected the plugin, or for one that does not ask for searches.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Devices ─────────────────────────────
  /me/devices:
    get:
      tags: [Devices]
      summary: List the caller's devices
      description: The same list used for Shift targets (`requirements/realtime.md` §1).
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Libraries ─────────────────────────────
  /libraries:
    get:
      tags: [Libraries]
      summary: List libraries the caller can access
      description: Empty for an account with no access; clients explain why rather than erroring (`requirements/users.md` §5).
      operationId: listLibraries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Libraries]
      summary: Get a library
      operationId: getLibrary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Browse ─────────────────────────────
  /libraries/{libraryId}/tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse tracks
      description: |
        Any filtered list of the library's tracks. Filters compose (`requirements/tags.md` §7).
        An album's track listing is `albumId` with `sort=album`: disc then track order, missing
        tracks in position (`requirements/albums.md` §4). Whether a track is owned or featured
        for an artist follows from its `album.artists`. A playlist is an ordered item list, not
        a track filter, and has its own item endpoint (`listPlaylistItems`).

        A track the caller hid is left out, and out of `total` (`requirements/conventions.md`
        §8); `listHiddenTracks` lists those.

        `ids` looks up specific tracks, as a client does to fill the rows it shows. The answer is
        one page in the order the IDs were given, with no `nextCursor`, and `total` is the number
        returned. An ID that is unknown, in another library, or not an ID is left out, so the
        answer never says which; a repeated ID comes back each time. `ids` takes the place of
        every other parameter: sending any of them with it is `422`, as is naming more than 100
        IDs.
      operationId: listTracks
      parameters:
        - name: ids
          in: query
          description: Track IDs, at most 100.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string }
        - name: sort
          in: query
          description: |
            `album` orders by album, then disc, then track number. `top` is the caller's own
            ranking — listening weighted by completion, not play count alone — falling back to a
            sensible order for tracks never played, so it is never empty
            (`requirements/artists.md` §3.3, `requirements/analytics.md` §4). An artist's top
            tracks are `artistId` with `sort=top`. `playCount`, `lastPlayed`, and `top` are
            planned.
          schema:
            type: string
            enum: [name, artist, album, dateAdded, playCount, lastPlayed, releaseDate, duration, top]
            default: name
        - $ref: '#/components/parameters/Order'
        - name: albumId
          in: query
          description: Only tracks on this album.
          schema: { type: string }
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - $ref: '#/components/parameters/TagAll'
        - $ref: '#/components/parameters/TagAny'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Browse]
      summary: Get a track
      operationId: getTrack
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/like:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [Playlists]
      summary: Like a track
      description: |
        Puts the track at the top of the caller's Liked Songs in the library, unless it is there
        already (`requirements/playlists.md` §11). A caller who deleted their Liked Songs has it
        made again, pinned. Not checked against a version: a like says whether a track is liked,
        not where it sits, so it applies whatever else changed the playlist. It is announced as
        an edit of the playlist is (`playlist`). A hidden track is unhidden (`trackHidden`), since
        liking and hiding undo each other (`requirements/conventions.md` §8). A track the library
        does not have is `404`.
      operationId: likeTrack
      responses:
        '204': { description: Liked. }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Unlike a track
      description: |
        Takes the track out of the caller's Liked Songs. A track not liked is already unliked, so
        that is `204` too.
      operationId: unlikeTrack
      responses:
        '204': { description: Not liked. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/hidden:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [Browse]
      summary: Hide a track
      description: |
        Hides the track from the caller in this library: it is gone from their library, shown
        only in `listHiddenTracks` (`requirements/conventions.md` §8). A liked track is unliked,
        taken out of Liked Songs as `unlikeTrack` does. Announced to the caller's devices
        (`trackHidden`). A track the library does not have is `404`; one hidden already stays
        as it was.
      operationId: hideTrack
      responses:
        '204': { description: Hidden. }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Browse]
      summary: Unhide a track
      description: |
        Brings the track back into the caller's library. One not hidden is already so, which is
        `204` too.
      operationId: unhideTrack
      responses:
        '204': { description: Not hidden. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/hidden-tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: List hidden tracks
      description: |
        Hidden Songs: the tracks the caller hid in this library, by when they were hidden,
        newest first unless `order` is `asc` (`requirements/conventions.md` §8). The one place a
        hidden track is listed. Each is `hidden`, and none is `liked`, since hiding unlikes.
      operationId: listHiddenTracks
      parameters:
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse albums
      description: |
        Any filtered list of the library's albums, by name unless `sort` and `order` say
        otherwise. For an artist's discography a client asks for `artistId` with
        `artistCredit=owned`, `sort=releaseDate`, and `order=desc`, and groups the albums by
        their `type`, leaving out empty groups (`requirements/artists.md` §3.1). Their
        appearances are `artistCredit=featured`; the tracks on each come from `listTracks` with
        `artistId`, `artistCredit=featured`, and `sort=album` (`requirements/artists.md` §3.2).

        An album every track of which the caller hid is left out, and out of `total`
        (`requirements/conventions.md` §8).
      operationId: listAlbums
      parameters:
        - name: sort
          in: query
          description: '`playCount` and `lastPlayed` are planned.'
          schema:
            type: string
            enum: [name, artist, dateAdded, playCount, lastPlayed, releaseDate, duration]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - name: type
          in: query
          description: Filter by album type (`requirements/albums.md` §6). Planned.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AlbumType' }
        - $ref: '#/components/parameters/TagAll'
        - $ref: '#/components/parameters/TagAny'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums/{albumId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [Browse]
      summary: Get an album
      description: |
        The album with a summary of each disc present. Its tracks are listed with `listTracks`
        using `albumId` and `sort=album`, since an album's size is unbounded — the unknown album
        holds every file with no album tag.

        One every track of which the caller hid is `404` (`requirements/conventions.md` §8).
      operationId: getAlbum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Album' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse artists
      description: |
        Includes artists credited only as features (`requirements/artists.md` §5).

        An artist every track of whom the caller hid is left out, and out of `total`
        (`requirements/conventions.md` §8).
      operationId: listArtists
      parameters:
        - name: sort
          in: query
          description: '`playCount` and `lastPlayed` are planned.'
          schema:
            type: string
            enum: [name, dateAdded, playCount, lastPlayed]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/TagAll'
        - $ref: '#/components/parameters/TagAny'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists/{artistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/ArtistId'
    get:
      tags: [Browse]
      summary: Get an artist
      description: An artist every track of whom the caller hid is `404` (`requirements/conventions.md` §8).
      operationId: getArtist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tag-types:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: List tag types
      description: |
        The tag types the library's music carries, in key order: each type with at
        least one tag in the library, and its count of tags. A type no file in the library
        carries is left out, so a filter drawn from this list never shows an empty section
        (`requirements/tags.md` §2, §8).

        Tags every track carrying which the caller hid are not counted, and a type left with none
        is not listed (`requirements/conventions.md` §8).
      operationId: listTagTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagType' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tags:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse tags
      description: |
        The library's tags, of one type or every type. A tag sorts by its name, its
        leading article kept (`requirements/conventions.md` §4).

        A tag every track carrying which the caller hid is left out, and out of `total`
        (`requirements/conventions.md` §8).
      operationId: listTags
      parameters:
        - name: type
          in: query
          description: Only tags of this type (`listTagTypes`).
          schema: { type: string }
        - name: q
          in: query
          description: |
            Only tags whose names hold this text, whatever its case and accents, so a picker
            narrows a type of many tags without reading them all. Text that is only spaces
            filters nothing.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, trackCount]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [Browse]
      summary: Get a tag
      description: |
        A tag's tracks, albums, and artists are browsed with the `tagAll` filter on the browse
        endpoints (`requirements/tags.md` §7).

        One every track carrying which the caller hid is `404`
        (`requirements/conventions.md` §8).
      operationId: getTag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Media ─────────────────────────────
  /libraries/{libraryId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: imageId
        in: path
        required: true
        schema: { type: string }
        description: An `ImageRef` ID, opaque to clients. Content-addressed; replacing an image on disk yields a new ID.
    get:
      tags: [Media]
      summary: Get an image
      description: |
        Album and artist images as JPEG, resized to the requested size
        (`requirements/conventions.md` §5). Immutable and cacheable indefinitely, because its ID
        changes whenever the image does. A playlist's `image` ID may name the mosaic of its
        first four album images, a 2×2 square of them, composed on first request and then kept;
        a mosaic is served only to the owner of a playlist that holds it, and is `404` to anyone else.
      operationId: getImage
      parameters:
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '206': { $ref: '#/components/responses/Image' }
        '304': { description: Not modified (`If-None-Match` or `If-Modified-Since`). }
        '412': { description: Precondition failed (`If-Match` or `If-Unmodified-Since`). }
        '416': { description: Range not satisfiable. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/lyrics:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get lyrics
      description: A track without lyrics answers `200` with `kind` `none` (`requirements/tracks.md` §5).
      operationId: getLyrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lyrics' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/waveform:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get a waveform
      description: |
        Fetched on demand for the track playing and with downloads, never synced wholesale
        (`requirements/playback.md` §3).
      operationId: getWaveform
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Waveform' }
        '204':
          description: |
            Not yet analyzed. Clients show a plain progress bar, and fetch again once the track's
            `loudness` becomes non-null.
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/playback:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Negotiate audio delivery
      description: |
        Chooses direct or transcoded delivery from the requested quality and what the client
        can decode: the original whenever the client can play it at or below `quality`
        (`requirements/playback.md` §1). The client picks `quality` from its own settings for
        the connection it is on, or for downloads. Describes exactly what the listener will hear.
        A track marked missing answers `404`.
      operationId: getPlaybackInfo
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Codecs'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackInfo' }
        '422':
          description: |
            `validation_failed` — the original cannot be played as asked: a `quality` other than
            `original`, or `codecs` that leave out its codec or container, needs a transcode, and
            transcoding is not built yet.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/audio:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Stream or download audio
      description: |
        Serves a variant chosen by `getPlaybackInfo`, with byte ranges for seeking and
        resumable downloads. A track marked missing answers `404`.
      operationId: getAudio
      x-status: draft
      parameters:
        - name: variant
          in: query
          required: true
          description: As `getPlaybackInfo` gave it; any other answers `404`.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Audio' }
        '206': { $ref: '#/components/responses/Audio' }
        '304': { description: Not modified (`If-None-Match` or `If-Modified-Since`). }
        '412': { description: Precondition failed (`If-Match` or `If-Unmodified-Since`). }
        '416': { description: Range not satisfiable. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Search ─────────────────────────────
  /libraries/{libraryId}/search:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: Search a library
      description: |
        Names, with typo tolerance, diacritic and case folding, word-order independence, and
        exact-match precedence (`requirements/search.md` §3). Results are identical to on-device
        search over the same corpus (`requirements/search.md` §2.1). Playlists are not searched
        until they are built, so no playlists section comes back. A track the caller hid is not
        found, nor counted in its section's `total`, and nor is an album or artist every track of
        which they hid (`requirements/conventions.md` §8).
      operationId: search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/SearchTypes'
        - $ref: '#/components/parameters/Within'
        - $ref: '#/components/parameters/TagAll'
        - $ref: '#/components/parameters/TagAny'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - name: sectionLimit
          in: query
          description: Results shown per section before expanding.
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: List recent searches
      description: |
        The caller's own, newest first. Kept only for a recent window, the 20 newest and none
        older than 30 days, after which they are deleted; there is no permanent search history
        (`requirements/search.md` §6).
      operationId: listRecentSearches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecentSearch' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Search]
      summary: Record a recent search
      description: |
        Recorded once a search settles: the user acts on a result, submits it, or leaves it after
        it has stood a moment, never on every keystroke (`requirements/search.md` §6). The same
        words searched again, ignoring case and accents, replace the earlier entry under a new
        ID. `422` for a query with nothing to search for or over 500 bytes, or a `selected`
        that is not a track, album, or artist in this library.
      operationId: recordRecentSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecentSearchCreate' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentSearch' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Search]
      summary: Clear recent searches
      operationId: clearRecentSearches
      responses:
        '204': { description: Cleared. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches/{recentSearchId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: recentSearchId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Search]
      summary: Remove a recent search
      operationId: deleteRecentSearch
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Playlists ─────────────────────────────
  /libraries/{libraryId}/playlists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Playlists]
      summary: List the caller's playlists
      description: |
        Pinned playlists first, in either `order` (`requirements/playlists.md` §7). Every user has
        a Liked Songs in each library, pinned until they unpin it, unless they deleted it (§11).
      operationId: listPlaylists
      parameters:
        - name: sort
          in: query
          description: '`playCount` is planned.'
          schema:
            type: string
            enum: [name, created, modified, playCount]
            default: modified
        - $ref: '#/components/parameters/Order'
        - name: q
          in: query
          description: Keeps the playlists whose name contains this text, as a substring in order, ignoring case and accents. Text with no letters or digits keeps all.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Playlists]
      summary: Create a playlist
      description: |
        At version 1, optionally with initial items, or by saving a generated mix
        (`requirements/playlists.md` §8). A playlist created offline exists only on its device,
        which folds any edits into it and creates it here, final contents and all, once online.
        Send an `Idempotency-Key`, so a retry does not create a second playlist: a key the
        caller already used for a request that created one returns that `201` and body again.

        Planned: `fromMix` and `external` items answer `422`. Every other item must be in this
        library, or the caller's own playlist in it, or the answer is `422` and nothing is
        created.
      operationId: createPlaylist
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: Get a playlist
      description: The caller's own playlist. Anyone else's, an admin's included, is `404`.
      operationId: getPlaylist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Playlists]
      summary: Edit a playlist
      description: |
        Changes details and contents — adds, removes, and moves, including non-contiguous
        selections — as one atomic edit against `baseVersion`: every part applies, or none does
        (`requirements/playlists.md` §4–§5). Each applied edit adds 1 to `version` and sets
        `modifiedAt`, even if what it names is already so. An edit that changes the items (one
        with `ops`) recounts `trackCount` and `durationUs` from the tracks' durations as they
        are at the edit; one of details alone leaves them as they were. A rescan alone does not
        update them.

        An edit made on another version is `409 version_conflict`, whose `currentVersion` is the
        version the playlist is at. A position out of range, an add of something not the
        caller's to add (as for `createPlaylist`), or an edit that names nothing to change (only
        `baseVersion`, or an empty `ops` or op list) is `422`. A
        device chains its queued edits, each against the version the previous one produced. Undo
        is a further edit that reverses the last. Send an `Idempotency-Key`, so a retried edit is
        not refused because its first attempt applied: a key the caller already used for an edit
        that applied returns that `200` and body again, whatever `baseVersion` the retry names.

        A Liked Songs (`kind` `liked`) keeps its title and has no description, so an edit of
        either is `422`. Adding to it likes tracks (`requirements/playlists.md` §11): an add with
        no `at` goes to the top, and only tracks not in it are added, each once. Removing from it
        unlikes them. It is otherwise edited as any playlist.
      operationId: editPlaylist
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistEdit' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Delete a playlist
      description: |
        Deletes the playlist and its items, never the tracks. Anyone else's is `404`. Deleting a
        Liked Songs unlikes every track in it, and it is not made again until the caller next
        likes one (`likeTrack`).
      operationId: deletePlaylist
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: List playlist items
      description: |
        In the user's order, where an item's index is its position for `editPlaylist`. Missing
        tracks stay in position (`requirements/playlists.md` §3). A duplicate track is a separate
        item. Every page comes from one version: a `cursor` made at another version is `410`, and
        the client starts again from the first page. `total` counts every item, missing included.
        Anyone else's playlist is `404`.
      operationId: listPlaylistItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '410':
          description: '`cursor_expired` — the playlist changed since the first page; start again.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/duplicates:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    post:
      tags: [Playlists]
      summary: Check for duplicates before adding
      description: |
        Reports which of the given items are already present, so the user can back out
        (`requirements/playlists.md` §3). The items are expanded as when adding them, so an item
        the caller may not add is `422`. `trackIds` holds each track already in the playlist once,
        in the order the request first names it. Anyone else's playlist is `404`.
      operationId: checkPlaylistDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Playable' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trackIds]
                properties:
                  trackIds:
                    type: array
                    description: Tracks from the request already in the playlist.
                    items: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/image:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [Playlists]
      summary: Set a custom image
      description: |
        **Planned:** the server does not serve this yet.

        Stored in Jewelcase's data, never the library (`requirements/playlists.md` §6).
      operationId: setPlaylistImage
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Revert to the generated image
      description: "**Planned:** the server does not serve this yet."
      operationId: deletePlaylistImage
      responses:
        '204': { description: Reverted. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Player ─────────────────────────────
  /me/player:
    get:
      tags: [Player]
      summary: Get playback state
      description: The account's playback state — which device is playing, what, and where (`requirements/playback.md` §6).
      operationId: getPlayer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerState' }
        default: { $ref: '#/components/responses/Problem' }

  /me/player/commands:
    post:
      tags: [Player]
      summary: Control playback on any device
      description: |
        Sends a `PlayerCommand`, for clients without a realtime connection; clients with one
        send `playerCommand` there instead. Answers once the target has carried the command out
        or failed to: `applied` or `failed`, or `pending` to an earlier request for a command
        sent again (see `CommandResult`).
      operationId: sendPlayerCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCommand' }
      responses:
        '200':
          description: How the target carried it out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '429':
          description: '`rate_limited` — too many of the account''s commands are waiting for the target.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`device_unavailable` — the target device is not connected (`setVolume`, `transfer`); for `transfer`, also when nothing has played; for any other command, nothing is playing or the device named is not the one playing.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Queue ─────────────────────────────
  /me/queue:
    get:
      tags: [Queue]
      summary: Get the queue
      description: |
        The account's active queue, for a device to load into the shared core
        (`requirements/queue.md` §7). `404` until a queue has been started. The state carries each
        list's `list` hash and `length`, never its tracks (`QueueState`); a device downloads the
        lists it lacks by hash. The shape is a stable public contract.

        The `ETag` is `"<run>.<queueId>.<version>"`, where `<run>` is new each time the server
        starts, so no tag from before a restart matches: a crash can lose edits a device
        already heard, and the queue it comes back with can reach the same version with other
        contents. A request whose `If-None-Match` names the current tag is answered `304` with
        no body, so a device that reconnects downloads only what it lacks. Any other value, or
        none, gets the whole snapshot. The body is gzipped when the client sends
        `Accept-Encoding: gzip`.
      operationId: getQueue
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: The `ETag` of the snapshot the device already holds, or a list of them.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '`"<run>.<queueId>.<version>"`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSnapshot' }
        '304':
          description: The device's queue and version are current.
          headers:
            ETag:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Queue]
      summary: Start a queue
      description: |
        Makes a new queue the account's active one, playing the source's list from one track,
        with an empty Manual Queue (`requirements/queue.md` §6). The queue it replaces is kept if
        it was adjusted, and deleted otherwise. The device chooses the `queueId` and the source's
        `key` so it can apply the start at once. Every connection of the account, the sender's
        included, is sent `queueReplaced` and `queuesChanged`.

        The source is either `tracks`, which the device resolved and the server holds under the
        hash it answers with, so the device attaches the tracks it sent to that hash instead of
        downloading them back, or a `recipe`, which the server resolves in `libraryId` to the
        same list, in the same order, that a view of it pages through to its end, so without the
        tracks the caller hid; two users may resolve one recipe to different lists. A recipe start
        also sends `startTrackId`, the track that plays first: the server starts at `start` if
        its list holds that track there, and otherwise at the first place the list holds it. The
        device then fetches the snapshot (`getQueue`), since the server's list and start may
        differ from what the device showed if the library changed. A device never names a list by
        hash.

        A start naming any queue of the account, active or kept, changes nothing and sends
        nothing, so a retried start never revives or replaces one. It is answered `200` with the
        `list` and `length` of the source it sent, as the first start was (for a recipe, as it
        resolves again).

        Answers `422` unless every track is in `libraryId` and the caller reaches the library,
        whether or not one that is refused exists (`requirements/users.md` §10), and the same
        for a recipe's library; when `tracks` is empty or `start` is not one of its positions;
        when `startTrackId` is missing from a recipe start, sent with `tracks`, or not in the
        recipe's list; when a recipe is one the server cannot resolve, as its schema says, or is
        larger than 4 KiB; when a key or `queueId` is not a UUID; when `context` is not an object
        with a string `type` of at most 4 KiB; or when the body is larger than the server
        accepts, which holds hundreds of thousands of tracks (a longer list starts from a
        recipe). A playlist recipe naming a playlist the caller does not own in `libraryId`,
        another account's or one that does not exist, is `404`, as `getPlaylist` answers it.
      operationId: startQueue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartQueue' }
      responses:
        '200':
          description: Started, or already started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartedQueue' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queue/edits:
    post:
      tags: [Queue]
      summary: Edit the queue
      description: |
        Applies one edit to the account's active queue, in the order edits arrive, and answers
        the `version` it made: one more than before. Edits name items, never positions, so edits
        from different devices mean the same whatever order they meet in, and there is no version
        to be refused for (`requirements/realtime.md` §7). Items an edit names that are gone are
        ignored. Every applied edit is sent to all the account's realtime connections as
        `queueEdit`, the sender's included, so a device that applied it at once can tell it
        confirmed. Edits and player reports name only the active queue.

        `editId` is chosen by the device. An edit sent again, by a device unsure the first
        arrived, is applied once and answered the same; the latest 32 are remembered.

        An `add` takes its source as `tracks`, checked as a start's are, or as a `recipe` the
        server resolves in `libraryId` as a start's is (`startQueue`), so a device need not hold
        what it adds, such as an album. The server hashes the list itself and holds it for the
        account from the moment the edit applies. The answer and `queueEdit` carry the source as
        registered, with the server's `list` and `length`, so the device attaches the tracks it
        sent to that hash instead of downloading them back. Any `list` or `length` a client sends
        is ignored. An add whose list is empty registers no source. `previous`, `requeue` and
        `rewind` carry a device-minted key, used only when they make a copy.

        There is no size limit on a queue. Answers `404` before a queue has been started; `409`
        `queue_changed` unless `queueId` is the account's active queue, replaced or kept, so the
        device fetches the queue again; `409` `anchor_gone` when an anchor names an item no longer
        in Up Next, so the device reverts the edit; `409` `play_gone` when a `rewind` names a play
        that is no longer in History or played another item, so the device reverts it; and `422`
        for tracks out of reach or not in the library, as a start refuses them (whether or not they exist), a source of both
        `tracks` and a `recipe` or of neither, a recipe the server cannot resolve, a key that is
        not a UUID, an item of a `remove`, `move` or `removePlays` that is not `<key>.<position>`
        with a UUID key (an item whose key is in capitals names the same item in lowercase), an
        anchor or a recipe larger than 4 KiB, an edit other than `add`, `remove`, `move` and
        `removePlays` larger than 4 KiB, `duplicate_key` for a key that already names a source
        or copy of the queue, or a body larger than the server accepts, which holds hundreds of
        thousands of tracks. An `add` of a playlist recipe whose playlist the caller does not own
        in `libraryId` is `404` too.
      operationId: editQueue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditQueue' }
      responses:
        '200':
          description: Applied, or already applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppliedEdit' }
        '409':
          description: '`queue_changed` — `queueId` is not the account''s active queue; `anchor_gone` — an anchor is no longer in Up Next; `play_gone` — a rewind''s play is no longer in History, or played another item. Nothing was applied.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queue/lists/{hash}:
    get:
      tags: [Queue]
      summary: Get a list of the queue
      description: |
        One of the caller's own lists by the `hash` a source names: the track IDs a queue's source
        plays, in order, which a device downloads for a source it lacks. It serves any list one
        of the account's queues uses, a kept queue's included, so a device restoring one can
        download its lists. A hash that none of the caller's queues uses is `404`, the same
        whether it is unknown or another account's, so no one learns what another account holds.
        Reach is not checked again: every track was checked as it joined a queue, and IDs are
        random.

        A list never changes under its hash. The `ETag` is `"<hash>"`, the answer is cached for a
        year and marked immutable, and an `If-None-Match` naming it is answered `304` with no
        body. The body is gzipped when the client sends `Accept-Encoding: gzip`.
      operationId: getQueueList
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: The `ETag` of the list the device already holds, or a list of them.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '`"<hash>"`.'
              schema: { type: string }
            Cache-Control:
              description: '`private, max-age=31536000, immutable`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueList' }
        '304':
          description: The device already holds the list.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /me/queue/rows:
    get:
      tags: [Queue]
      summary: Get a page of the queue's rows
      description: |
        A page of up to 100 rows of the account's active queue, with the track each names, for a
        client that does not hold the lists, or does not yet hold one. `404` before a queue has
        been started. `upNext` is the Manual Queue and then the context past the cursor; `history`
        runs newest first and each row carries its play number, for `removePlays`, `requeue` and
        `rewind`. `total` counts the section's rows; in `upNext`, `manual` counts the Manual Queue's
        rows at its top, so a client can draw the divider, and it is `0` in `history`. `current` is
        the row playing, if any, whichever the section.

        A row names its `libraryId`, since the track lookup is per library. A row whose track
        cannot be read has a `null` `trackId`, and is unavailable. A page is for one `version`:
        a client drops a page older than the newest version it has heard, and fetches again when
        its pages differ in version. `shuffled` and `repeat` are the queue's.
      operationId: getQueueRows
      parameters:
        - name: section
          in: query
          required: true
          schema: { type: string, enum: [upNext, history] }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueRows' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues:
    get:
      tags: [Queue]
      summary: List the kept queues
      description: |
        The account's kept queues, most recently active first, keyset-paged on when each was
        parked and then its `queueId`, since queues parked together share a time. A queue is kept
        when a start or restore replaces it and it had been adjusted (`requirements/queue.md`
        §6), and is deleted after 30 days. The active queue is not listed.

        Each entry is computed from the stored queue when listed: what was `current`, and how
        many rows `upNext` and `history` hold. A queue kept a moment ago, before the server has
        saved it, is listed too, with the time of the request as its `lastActive`. A queue that
        cannot be read is left out, though `total` counts it. `current.trackId` is `null` where
        its track cannot be read.

        Devices showing the list fetch it again on `queuesChanged`. An expiry sends nothing.
      operationId: listKeptQueues
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeptQueuePage' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues/{queueId}/restore:
    post:
      tags: [Queue]
      summary: Restore a kept queue
      description: |
        Makes a kept queue the account's active one, and parks the queue it replaces as a start
        does (kept if it was adjusted). Answers as `getQueue` does, with `position`: the item
        and point in its track that playback was at when the queue was parked, which only this
        answer carries. The restoring device resumes there and reports it as a start
        (`start: true`), since another device may be playing; the server leaves the player state
        alone. A device downloads the queue's lists by hash (`getQueueList`).

        Every connection of the account, the sender's included, is sent `queueReplaced` and
        `queuesChanged`. `404` for a queue that is not kept: unknown, expired, deleted, another
        account's, or one that was never adjusted. `409` `queue_active` for the active queue.
      operationId: restoreQueue
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Restored.
          headers:
            ETag:
              description: As `getQueue`'s.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoredQueue' }
        '409':
          description: '`queue_active` — the queue is the active one.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues/{queueId}:
    delete:
      tags: [Queue]
      summary: Delete a kept queue
      description: |
        Deletes a kept queue. Every connection of the account is sent `queuesChanged`. `404` for a
        queue that is not kept (as `restoreQueue`); `409` `queue_active` for the active queue,
        which is replaced by a start instead.
      operationId: deleteKeptQueue
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '409':
          description: '`queue_active` — the queue is the active one.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Listening ─────────────────────────────
  /me/plays:
    post:
      tags: [Listening]
      summary: Record plays
      description: |
        Upserts by `playId`. A device reports a play when it starts and again as listen
        time accumulates and when it ends; offline plays arrive later with their original
        times. Never counted twice (`requirements/analytics.md` §1, §6). At most 500 reports
        a request; a device with more sends them in turn.
      operationId: recordPlays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/PlayReport' }
      responses:
        '204': { description: Recorded. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Realtime ─────────────────────────────
  /realtime:
    get:
      tags: [Realtime]
      summary: Open the realtime connection
      description: |
        Upgrades to a WebSocket, authenticated like any other request. A request from a web page,
        one with an `Origin`, is refused `403` unless that origin's host and port are the ones
        the request was sent to, as `Host` or a trusted proxy's `X-Forwarded-Host` gives them
        (`requirements/deployment.md` §6). Messages are JSON objects matching
        `RealtimeClientMessage` and `RealtimeServerMessage`, each at most 64 KiB; a message
        whose `type` the server does not know is ignored. The server pings every 15 seconds and
        closes a connection it has heard nothing from, pongs included, for 40 seconds. A
        reconnecting client receives current playback state (`requirements/realtime.md` §6).
      operationId: openRealtime
      x-messages:
        client: { $ref: '#/components/schemas/RealtimeClientMessage' }
        server: { $ref: '#/components/schemas/RealtimeServerMessage' }
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
      responses:
        '101': { description: Switching to WebSocket. }
        '403':
          description: '`forbidden` — the request comes from a page whose origin is not this server.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: plugins ─────────────────────────────
  /admin/plugins:
    get:
      tags: [Admin]
      summary: List installed plugins
      operationId: adminListPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Install a plugin
      description: |
        From an uploaded file or a URL; no restart (`requirements/plugins.md` §5). Installed
        disabled for every library. Settings from a previous install are restored, and grants
        only for requests made again unchanged.
      operationId: adminInstallPlugin
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: One WebAssembly component carrying its manifest (`design/plugins.md` §6), up to 50 MB.
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '201':
          description: Installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '409':
          description: '`plugin_exists` — a plugin with its `id` is installed; uninstall it first.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`plugin_invalid` — not a plugin that can run here; `detail` says why.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Admin]
      summary: Get a plugin
      operationId: adminGetPlugin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: Uninstall a plugin
      description: |
        Files it wrote stay; content it sourced disappears. Its settings, and grants for requests
        a reinstall makes again unchanged, are kept; users' connections to it are not, so they
        connect again.
      operationId: adminUninstallPlugin
      responses:
        '204': { description: Uninstalled. }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - $ref: '#/components/parameters/LibraryId'
    put:
      tags: [Admin]
      summary: Enable or disable a plugin for a library
      description: |
        Disabling is immediate and complete. Re-enabling clears an automatic disable. A plugin
        cannot be enabled in a library until its required permissions are granted there
        (`requirements/plugins.md` §4.2).
      operationId: adminSetPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '409':
          description: '`permissions_required` — `detail` names what it still needs.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/permissions:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    put:
      tags: [Admin]
      summary: Set what a plugin is granted
      description: |
        Replaces the plugin-wide grants and, for each library listed, that library's grants
        (`requirements/plugins.md` §4.2). A permission the plugin never asked for, or in the
        wrong scope, is ignored. A library that loses a required permission is disabled at
        once, with `disabledReason` saying why.
      operationId: adminSetPluginPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionGrants' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/exemptions/{host}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: host
        in: path
        required: true
        description: One host name, such as `musicbrainz.org`. Kept lowercase. Anything else, such as `*` or a pattern, answers `422`.
        schema: { type: string }
    put:
      tags: [Admin]
      summary: Exempt a plugin from a limit for every plugin
      description: |
        Exempts this plugin's requests from the rate limit for every plugin (`hostLimits`) on
        one host, such as for a plugin whose users each bring credentials with a budget of
        their own (`requirements/plugins.md` §7). The host need not have a limit in force now.
        Exempting it again changes nothing. Its runs keep to the change from their next start.
      operationId: adminExemptPlugin
      responses:
        '204': { description: Exempt. }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: End a plugin's exemption from a limit for every plugin
      description: |
        Its requests to the host keep to the limit again from its runs' next start. Ending an
        exemption it does not have changes nothing.
      operationId: adminUnexemptPlugin
      responses:
        '204': { description: Not exempt. }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/run:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      tags: [Admin]
      summary: Run a plugin now
      description: |
        Runs the plugin once in each library it is enabled in, with exactly what is granted
        there, and answers when it is done: up to five minutes. Folders it saved files into are
        scanned, as the scanner is the only way into the library (`requirements/general.md`
        §3.2).
      operationId: adminRunPlugin
      responses:
        '200':
          description: The run finished, whether or not the plugin succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRunResult' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: libraryId
        in: query
        description: Settings for one library. Omit for the plugin's server-wide defaults.
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Get plugin settings
      description: Secrets are never returned (`requirements/plugins.md` §6).
      operationId: adminGetPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Admin]
      summary: Set plugin settings
      description: Validated by the plugin when entered; invalid values answer `422 plugin_settings_invalid`.
      operationId: adminSetPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '422': { $ref: '#/components/responses/PluginSettingsInvalid' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque per-device token from login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: jewelcase_session
      description: |
        Set at setup or login for browser clients, and sent again from time to time as the
        session is used, so one in use never expires; a response that sends it again is
        `Cache-Control: private`. State-changing requests must also send `X-Jewelcase-Client`.

  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: string }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string }
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    ArtistFilter:
      name: artistId
      in: query
      description: Only items this artist is credited on. See `artistCredit`.
      schema: { type: string }
    ArtistCredit:
      name: artistCredit
      in: query
      description: |
        With `artistId`: `owned` — the artist is among the album's artists; `featured` — credited
        on a track but not an album artist; `any` — either (`requirements/artists.md` §2).
      schema:
        type: string
        enum: [any, owned, featured]
        default: any
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    TagAll:
      name: tagAll
      in: query
      description: |
        Tag IDs, of any types, every one of which an item must carry. With `tagAny`, genre Rock
        in `tagAll` and Jazz and Blues in `tagAny` is Rock and (Jazz or Blues). A filter naming
        a tag the library does not have matches nothing, as `artistId` does. `tagAll` and
        `tagAny` name at most 100 tags together.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    TagAny:
      name: tagAny
      in: query
      description: |
        Tag IDs, of any types, of which an item must carry one of each type named, since types
        are independent (`requirements/tags.md` §2): genre Rock and Jazz with mood Calm is
        (Rock or Jazz) and Calm. A filter naming a tag the library does not have matches
        nothing, as `artistId` does.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string }
    YearFrom:
      name: yearFrom
      in: query
      description: Planned.
      schema: { type: integer }
    YearTo:
      name: yearTo
      in: query
      description: Planned.
      schema: { type: integer }
    Availability:
      name: availability
      in: query
      description: Server availability (`requirements/conventions.md` §6). Playability on a device is the client's to filter. Planned.
      schema: { $ref: '#/components/schemas/Availability' }
    Played:
      name: played
      in: query
      description: Filter by whether the caller has ever played the item. Planned.
      schema:
        type: string
        enum: [never, ever]
    LastPlayedBefore:
      name: lastPlayedBefore
      in: query
      description: Last played before this time — "not played since". Planned.
      schema: { type: string, format: date-time }
    LastPlayedAfter:
      name: lastPlayedAfter
      in: query
      description: Planned.
      schema: { type: string, format: date-time }
    MinPlayCount:
      name: minPlayCount
      in: query
      description: Planned.
      schema: { type: integer, minimum: 0 }
    Query:
      name: q
      in: query
      required: true
      description: Search text, from the first character typed.
      schema: { type: string, minLength: 1 }
    SearchTypes:
      name: types
      in: query
      description: Sections to include. Defaults to all but `lyrics`, which is planned.
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/SearchSectionType' }
    Within:
      name: within
      in: query
      description: 'Narrow to a container, as `artist:ID`, `album:ID`, or `playlist:ID` (`requirements/search.md` §5). Planned.'
      schema: { type: string, pattern: '^(artist|album|playlist):.+$' }
    ImageSize:
      name: size
      in: query
      description: Longest edge in pixels. The server rounds up to one of a fixed set of sizes, and never enlarges an image.
      schema: { type: integer, minimum: 16, maximum: 4096, default: 512 }
    Purpose:
      name: purpose
      in: query
      description: '`download` asks for a complete file of known size; `stream` may use segmented transport.'
      schema:
        type: string
        enum: [stream, download]
        default: stream
    Quality:
      name: quality
      in: query
      required: true
      description: The quality the client wants, chosen from its own settings (`requirements/users.md` §6.1).
      schema: { $ref: '#/components/schemas/Quality' }
    Codecs:
      name: codecs
      in: query
      description: |
        Codecs and containers the client can play, most preferred first, in ffmpeg's names such
        as `flac`, `aac`, and `mp4`. The original plays directly only when both its codec and its
        container are listed, since a codec such as `pcm` plays in some containers and not
        others. Omitted, the client can play anything.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Client-generated, at most 128 characters; longer, empty or not plain text is `422`. A
        repeated key returns the original result without applying twice: the same status and
        body, whatever else the request says. Keys are the caller's own, so another user's
        identical key is another key. Only a request that applied is remembered, so one that was
        refused (`409`, `422`) can be sent again with the same key. Kept for 24 hours.
      schema: { type: string, minLength: 1, maxLength: 128 }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PluginSettingsInvalid:
      description: '`plugin_settings_invalid` — a value does not fit the plugin''s settings, a required one is missing, or the plugin refused them; `detail` says why.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: '`version_conflict` — changed elsewhere since `baseVersion`; `currentVersion` says to what. Nothing was applied.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`rate_limited` — try again after `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMedia:
      description: '`unsupported_media` — not an accepted image type.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Image:
      description: The image as JPEG, whole or a range.
      headers:
        Cache-Control:
          schema: { type: string, const: 'private, max-age=31536000, immutable' }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
    Audio:
      description: Audio bytes, whole or a range.
      headers:
        Cache-Control:
          schema: { type: string, const: private }
        Accept-Ranges:
          schema: { type: string, const: bytes }
        Content-Range:
          schema: { type: string }
      content:
        audio/*:
          schema: { type: string, format: binary }

  schemas:
    # ───────────────────────────── Common ─────────────────────────────
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable, safe to show. Never contains credentials or plugin internals.
        code:
          type: string
          description: '`unsupported_media` comes only from planned operations.'
          enum:
            - unauthenticated
            - session_revoked
            - invalid_credentials
            - rate_limited
            - forbidden
            - not_found
            - method_not_allowed
            - validation_failed
            - weak_password
            - plugin_invalid
            - plugin_exists
            - permissions_required
            - queue_changed
            - queue_active
            - anchor_gone
            - play_gone
            - duplicate_key
            - version_conflict
            - cursor_expired
            - setup_required
            - unsupported_media
            - device_unavailable
            - plugin_settings_invalid
            - internal
        reason:
          type: string
          enum: [credentials_changed, logged_out]
          description: |
            With `session_revoked`. `credentials_changed` — the device keeps its downloads and
            logs in again with its `deviceId`; `logged_out` — the device removes them
            (`requirements/offline.md` §9).
        currentVersion:
          type: integer
          description: With `version_conflict`.

    PageInfo:
      type: object
      required: [nextCursor, total]
      properties:
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    Id:
      type: string
      description: Opaque, stable identifier.

    Source:
      type: string
      description: |
        The external source content comes from, absent for library content. External content is
        always shown labelled with its source (`requirements/plugins.md` §10.1). IDs inside it,
        such as its artists' and album's, are the same source's.

    CommandId:
      type: string
      format: uuid
      description: Client-generated. Identifies the command, so it is carried out once.

    PartialDate:
      type: string
      pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
      description: A date at tag precision.

    DurationUs:
      type: integer
      format: int64
      minimum: 0
      description: Microseconds.

    Availability:
      type: string
      enum: [available, missing]
      description: External content its source cannot provide now is `missing`, and behaves exactly like a missing track (`requirements/plugins.md` §10.2).

    EntityType:
      type: string
      enum: [track, album, artist, playlist, tag, mix, library]

    EntityRef:
      type: object
      required: [type, id]
      properties:
        type: { $ref: '#/components/schemas/EntityType' }
        id: { $ref: '#/components/schemas/Id' }

    Playable:
      description: >-
        Something that can be queued or added to a playlist — library content or an external
        track. An album, artist or playlist stands for the tracks its page shows, so without those
        the caller hid (`requirements/conventions.md` §8); a track named on its own is added
        whether hidden or not.
      oneOf:
        - $ref: '#/components/schemas/EntityRef'
        - $ref: '#/components/schemas/ExternalTrackRef'

    ExternalTrackRef:
      type: object
      required: [type, sourceId, externalId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        externalId: { type: string }

    ImageRef:
      type: object
      required: [id, placeholder]
      properties:
        id:
          type: string
          description: Fetch from `getImage`. Changes whenever the image does.
        placeholder:
          type: [string, 'null']
          description: |
            The image's ThumbHash in base64, a few bytes that decode to a recognizable
            correctly-coloured stand-in (`requirements/offline.md` §1.1). `null` until the server
            has made one, and for an image it could not decode.

    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: [string, 'null']
          description: '`null` for the unknown artist.'

    Personal:
      type: object
      description: |
        The caller's own listening on an entity (`requirements/conventions.md` §1), never shared
        between accounts. Planned.
      required: [playCount, lastPlayedAt]
      properties:
        playCount: { type: integer }
        lastPlayedAt: { type: [string, 'null'], format: date-time }

    Reason:
      type: object
      description: Why a recommendation or automatic track is there (`requirements/recommendations.md` §8).
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [becauseYouListened, similarTo, notHeardSince, neverPlayed, anniversary, collaborator, radioSeed, endlessPlay, timeOfDay, decade, mood]
        text:
          type: string
          maxLength: 500
          description: Localized to the account's language, ready to show.
        refs:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        since: { type: string, format: date-time }

    # ───────────────────────────── Server & auth ─────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    ServerInfo:
      type: object
      required: [version, apiVersion, setupRequired]
      properties:
        version: { type: string }
        apiVersion: { type: string }
        setupRequired: { type: boolean }

    DeviceType:
      type: string
      enum: [phone, tablet, desktop, tv]

    DeviceRegistration:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: A recognizable default, such as "Firefox on Linux", which the user can change. Not blank.
        type: { $ref: '#/components/schemas/DeviceType' }
        platform:
          type: string
          minLength: 1
          maxLength: 100
          description: For example `web`, `android`. Not blank.

    Username:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,32}$'
      description: ASCII letters, digits, `_` and `-`. Unique regardless of case; shown as chosen.

    SetupRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, format: password }
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Not blank. Defaults to the username.
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, format: password }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
        deviceId: { $ref: '#/components/schemas/ReclaimedDeviceId' }

    ReclaimedDeviceId:
      type: string
      description: |
        The device's ID from before it was logged out with `credentials_changed`. The device
        returns under that ID, keeping its name, downloads, and history; `device` only updates
        its type and platform. Any other ID — unknown, active, logged out otherwise, or on
        another account — is ignored and a new device is registered. `Session.device.id` says
        which happened.

    Session:
      type: object
      required: [user, device]
      properties:
        token:
          type: string
          description: |
            Shown once. Long-lived; idleness never expires it (`requirements/users.md` §4).
            Absent when the request carried `X-Jewelcase-Client`: the session cookie signs
            that client in, so no script on its page ever sees the token.
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }

    # ───────────────────────────── Account ─────────────────────────────
    Role:
      type: string
      enum: [owner, admin, user]

    User:
      type: object
      required: [id, username, displayName, role, hasAvatar]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        hasAvatar:
          type: boolean
          description: Whether the account has an avatar image; clients show initials when it has none. Always `false` until avatars are built.

    # ───────────────────────────── Devices ─────────────────────────────
    Device:
      type: object
      description: What the account's active device is playing is in `PlayerState`.
      required: [id, name, type, firstSeenAt, lastSeenAt, connected]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { $ref: '#/components/schemas/DeviceType' }
        platform: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        connected:
          type: boolean
          description: Disconnected devices are shown but cannot be selected (`requirements/realtime.md` §1).
        current:
          type: boolean
          description: Whether this is the calling device. Present only in `/me` responses.

    # ───────────────────────────── Libraries ─────────────────────────────
    Library:
      type: object
      description: |
        Its counts and duration are of what the caller sees: tracks they hid, and albums and
        artists every track of which they hid, are left out (`requirements/conventions.md` §8).
      required: [id, name, trackCount, albumCount, artistCount, durationUs, scanning]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        trackCount: { type: integer }
        albumCount: { type: integer }
        artistCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        scanning:
          type: boolean
          description: Content is still appearing. The library is fully usable either way.

    # ───────────────────────────── Tracks ─────────────────────────────
    AlbumRef:
      type: object
      required: [id, title, artists, image]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: [string, 'null']
          description: '`null` for the unknown album.'
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistRef' }
        image:
          description: The album's one cover, shown for every track on it (`requirements/albums.md` §5).
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    TagRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    TagsByType:
      type: object
      description: |
        An entity's tags by type key, each type's in name order. A type it carries none of is
        left out (`requirements/tags.md` §2).
      additionalProperties:
        type: array
        items: { $ref: '#/components/schemas/TagRef' }

    TagType:
      type: object
      required: [key, tagCount]
      properties:
        key:
          type: string
          description: >-
            The type's name in `Tag.type` and in `TagsByType`, such as `genre` or `mood`. A type a
            plugin added is keyed under the plugin, such as `acousticbrainz.energy`.
        name:
          type: string
          description: >-
            The name a plugin gave the type it added, which serves for one tag or more. A built-in
            type has none, and clients name it in their own words.
        tagCount:
          type: integer
          description: Its tags in the library, never 0 (`listTagTypes`).

    Tag:
      type: object
      description: |
        Its counts are of what the caller sees: tracks they hid are left out, and so are albums
        and artists only those brought it (`requirements/conventions.md` §8). A list sorted by
        `trackCount` is sorted by the library's counts.
      required: [id, type, name, trackCount, albumCount, artistCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type:
          type: string
          description: Its type's key (`TagType.key`).
        name:
          type: string
          description: The spelling the library uses most (`requirements/tags.md` §4).
        trackCount: { type: integer }
        albumCount: { type: integer }
        artistCount: { type: integer }

    TagPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Tag' }

    TrackBase:
      type: object
      required: [id, title, artists, album, discNumber, trackNumber, durationUs, releaseDate, availability]
      description: What any source can say about a track. `TrackSummary` adds what only the library knows.
      properties:
        source: { $ref: '#/components/schemas/Source' }
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          description: Falls back to the filename for untagged files.
        artists:
          type: array
          description: Ordered; the first is primary (`requirements/conventions.md` §7).
          items: { $ref: '#/components/schemas/ArtistRef' }
        album:
          description: '`null` only for an external track that is on no album.'
          oneOf:
            - $ref: '#/components/schemas/AlbumRef'
            - type: 'null'
        discNumber: { type: [integer, 'null'] }
        trackNumber: { type: [integer, 'null'] }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        releaseDate:
          oneOf:
            - $ref: '#/components/schemas/PartialDate'
            - type: 'null'
        explicit: { type: boolean }
        availability: { $ref: '#/components/schemas/Availability' }

    TrackSummary:
      allOf:
        - $ref: '#/components/schemas/TrackBase'
        - type: object
          required: [audio, explicit, sortKeys, tags, liked]
          properties:
            album: { $ref: '#/components/schemas/AlbumRef' }
            explicit: { type: boolean }
            tags: { $ref: '#/components/schemas/TagsByType' }
            audio:
              $ref: '#/components/schemas/AudioSummary'
              description: Enough to tell a FLAC from an MP3 at a glance (`requirements/tracks.md` §4). The full `Track` extends it.
            addedAt: { type: string, format: date-time }
            sortKeys: { $ref: '#/components/schemas/TrackSortKeys' }
            liked:
              type: boolean
              description: Whether it is in the caller's Liked Songs (`requirements/playlists.md` §11).
            hidden:
              const: true
              description: >-
                Present only on a track the caller hid (`requirements/conventions.md` §8), which
                only a lookup by ID (`listTracks` with `ids`, `getTrack`) and Hidden Songs
                (`listHiddenTracks`) return: every list leaves them out, and a playlist's item says
                so itself. A device holding a track it queued learns from this to skip it.
            personal: { $ref: '#/components/schemas/Personal' }

    TrackSortKeys:
      type: object
      description: |
        What the server orders tracks by for `name`, `artist`, and `album` (`requirements/conventions.md`
        §4): a tagged sort value where there is one, otherwise the display name with a leading article
        stripped; either way it is then folded: lowercased, with compatibility forms and accents
        folded away (`ＡＢＢＡ` is `abba`, `Édith` is `edith`, `Øystein` is `oystein`) and runs of
        whitespace collapsed to one space. A client sorting a list it holds compares these by Unicode
        code point, never by locale, and so orders it as the server would. An empty key is no value,
        which sorts last.
      required: [title, artist, album]
      properties:
        title: { type: string }
        artist:
          type: string
          description: The primary artist's own key, the same for every track that artist leads.
        album:
          type: string
          description: The album's own key, the same for every track on it.

    AudioSummary:
      type: object
      required: [codec, lossless]
      properties:
        codec: { type: string }
        lossless: { type: boolean }

    AudioProperties:
      allOf:
        - $ref: '#/components/schemas/AudioSummary'
        - type: object
          required: [container, bitrateKbps, sampleRateHz, bitDepth, channels, fileSizeBytes]
          properties:
            container: { type: string }
            bitrateKbps: { type: [integer, 'null'] }
            sampleRateHz: { type: integer }
            bitDepth: { type: [integer, 'null'] }
            channels: { type: integer }
            fileSizeBytes: { type: integer, format: int64 }

    Track:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          required: [audio, lyrics, loudness]
          properties:
            audio: { $ref: '#/components/schemas/AudioProperties' }
            lyrics:
              type: string
              enum: [none, plain, synced]
            loudness:
              description: |
                Measured by Jewelcase, never read from tags. `null` until analyzed; the track plays
                unnormalized (`requirements/playback.md` §5). Analysis produces loudness and the
                waveform together, so this changing from `null` is also the signal that a waveform
                can now be fetched.
              oneOf:
                - $ref: '#/components/schemas/Loudness'
                - type: 'null'

    TrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TrackSummary' }

    Lyrics:
      type: object
      required: [kind, lines, plain]
      properties:
        kind:
          type: string
          enum: [none, plain, synced]
          description: Synced lyrics are the primary view where they exist (`requirements/tracks.md` §5).
        lines:
          type: [array, 'null']
          description: With `synced`.
          items:
            type: object
            required: [startMs, text]
            properties:
              startMs: { type: integer }
              text: { type: string }
        plain:
          type: [string, 'null']
          description: With `plain`.

    Waveform:
      type: object
      x-status: draft
      required: [pointCount, data]
      description: Derived from the original file (`requirements/playback.md` §3).
      properties:
        pointCount: { type: integer }
        data:
          type: string
          description: Base64 of one unsigned byte per point, already shaped for legibility.

    Loudness:
      type: object
      description: The client applies gain from these for the user's normalization mode, without clipping.
      required: [trackLufs, trackPeakDbtp, albumLufs, albumPeakDbtp]
      properties:
        trackLufs: { type: number, description: Integrated loudness. }
        trackPeakDbtp: { type: number, description: True peak. }
        albumLufs: { type: [number, 'null'] }
        albumPeakDbtp: { type: [number, 'null'] }

    Quality:
      type: string
      enum: [original, high, medium, low]
      description: '`original` never transcodes. Bitrates for the others are defined by the audio design.'

    PlaybackInfo:
      type: object
      x-status: draft
      required: [variant, delivery, codec, container, bitrateKbps, sampleRateHz, bitDepth, channels, sizeBytes, transport, loudness, gapless]
      description: Exactly what the listener will hear (`requirements/playback.md` §1).
      properties:
        variant:
          type: string
          description: Pass to the audio endpoint.
        delivery:
          type: string
          enum: [direct, transcoded]
          description: '`transcoded` is planned.'
        codec: { type: string }
        container: { type: string }
        bitrateKbps: { type: [integer, 'null'] }
        sampleRateHz: { type: integer }
        bitDepth: { type: [integer, 'null'] }
        channels: { type: integer }
        sizeBytes:
          type: [integer, 'null']
          format: int64
          description: Known for direct delivery and for downloads.
        transport:
          type: string
          enum: [progressive, segmented]
          description: Set by the audio-delivery design. `segmented` is planned.
        loudness:
          description: Measured on the original, so it applies to every variant.
          oneOf:
            - $ref: '#/components/schemas/Loudness'
            - type: 'null'
        gapless:
          type: [object, 'null']
          description: Samples to trim so consecutive tracks join exactly (`requirements/playback.md` §4). Always `null` until it is measured.
          properties:
            leadingSamples: { type: integer }
            trailingSamples: { type: integer }

    # ───────────────────────────── Albums ─────────────────────────────
    AlbumType:
      type: string
      enum: [album, ep, single, compilation]
      description: '`requirements/albums.md` §3.'

    AlbumBase:
      description: What any source can say about an album. `AlbumSummary` adds what only the library knows.
      allOf:
        - $ref: '#/components/schemas/AlbumRef'
        - type: object
          required: [releaseDate]
          properties:
            source: { $ref: '#/components/schemas/Source' }
            releaseDate:
              oneOf:
                - $ref: '#/components/schemas/PartialDate'
                - type: 'null'
            type: { $ref: '#/components/schemas/AlbumType' }

    AlbumSummary:
      description: |
        Completeness has two parts (`requirements/albums.md` §4): tracks missing from discs you
        have (`trackCount` below `trackTotal`), and discs you do not have (`discCount` below
        `discTotal`). Incomplete is information, never an error.

        Its counts and duration are of what the caller sees: tracks they hid are left out, and
        so is a disc of only those, and its `tags` are those the tracks left bring it
        (`requirements/conventions.md` §8).
      allOf:
        - $ref: '#/components/schemas/AlbumBase'
        - type: object
          required: [type, tags, trackCount, trackTotal, discCount, discTotal, durationUs, availability]
          properties:
            type: { $ref: '#/components/schemas/AlbumType' }
            tags: { $ref: '#/components/schemas/TagsByType' }
            trackCount:
              type: integer
              description: |
                Tracks from this album in the library, including any marked missing — those stay in
                position with their own `availability`, so "incomplete" means never had, not lost.
            trackTotal:
              type: [integer, 'null']
              description: |
                Sum of the tagged per-disc totals for the discs present. Track totals are tagged per
                disc, so an absent disc contributes nothing; see `discCount`. `null` when no disc
                present has a tagged total. A track with no disc number counts as disc 1, here and in
                `discCount`, while `discs` lists the two apart.
            discCount:
              type: integer
              description: Discs with at least one track in the library, a track with no disc number counting as disc 1.
            discTotal:
              type: [integer, 'null']
              description: Tagged total number of discs.
            durationUs: { $ref: '#/components/schemas/DurationUs' }
            availability: { $ref: '#/components/schemas/Availability' }
            addedAt: { type: string, format: date-time }
            personal: { $ref: '#/components/schemas/Personal' }

    Album:
      allOf:
        - $ref: '#/components/schemas/AlbumSummary'
        - type: object
          required: [labels, discs]
          properties:
            labels:
              type: array
              description: Record labels, in tagged order. Empty when untagged.
              items: { type: string }
            discs:
              type: array
              description: |
                Present discs in number order, so disc headings and completeness render before
                tracks arrive; each track's `discNumber` places it (`requirements/albums.md` §4).
              items:
                type: object
                required: [number, trackCount, trackTotal]
                properties:
                  number:
                    type: [integer, 'null']
                    description: '`null` for tracks with no disc tag, grouped as one disc.'
                  trackCount:
                    type: integer
                    description: Tracks from this disc in the library, including any marked missing.
                  trackTotal:
                    type: [integer, 'null']
                    description: Tagged track total for this disc; the scanner resolves tracks that disagree.

    AlbumPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AlbumSummary' }

    # ───────────────────────────── Artists ─────────────────────────────
    ArtistBase:
      description: What any source can say about an artist. `ArtistSummary` adds what only the library knows.
      allOf:
        - $ref: '#/components/schemas/ArtistRef'
        - type: object
          required: [image]
          properties:
            source: { $ref: '#/components/schemas/Source' }
            image:
              oneOf:
                - $ref: '#/components/schemas/ImageRef'
                - type: 'null'

    ArtistSummary:
      description: |
        Its counts are of what the caller sees: tracks they hid, and their albums every track of
        which they hid, are left out (`requirements/conventions.md` §8). A full `Artist`'s
        `appearanceCount` too, and its `tags` are those the tracks left bring it.
      allOf:
        - $ref: '#/components/schemas/ArtistBase'
        - type: object
          required: [albumCount, trackCount]
          properties:
            albumCount:
              type: integer
              description: Albums the artist owns.
            trackCount:
              type: integer
              description: Owned and featured tracks.
            addedAt: { type: string, format: date-time }
            personal: { $ref: '#/components/schemas/Personal' }

    Artist:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          required: [biography, tags, appearanceCount]
          properties:
            biography:
              type: [string, 'null']
              description: From `artist.txt` (`requirements/scanning.md` §3.3). Usually absent.
            tags: { $ref: '#/components/schemas/TagsByType' }
            appearanceCount: { type: integer }

    ArtistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtistSummary' }

    # ───────────────────────────── Search ─────────────────────────────
    SearchSectionType:
      type: string
      enum: [tracks, albums, artists, playlists, lyrics]

    LyricMatch:
      type: object
      required: [track, line, before, after]
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        line:
          type: object
          required: [text, startMs]
          properties:
            text: { type: string }
            startMs: { type: [integer, 'null'] }
        before:
          type: array
          description: Lines of context before the match.
          items: { type: string }
        after:
          type: array
          items: { type: string }

    SearchResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [track, album, artist, playlist, lyric]
        track: { $ref: '#/components/schemas/TrackSummary' }
        album: { $ref: '#/components/schemas/AlbumSummary' }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        lyric: { $ref: '#/components/schemas/LyricMatch' }

    SearchResponse:
      type: object
      required: [query, top, sections, nearMisses, libraryEmpty]
      properties:
        query:
          type: string
          description: Echo of `q`, so a client can discard responses for text no longer in the box (`requirements/search.md` §7).
        top:
          description: The single best match, also present in its section (`requirements/search.md` §4).
          oneOf:
            - $ref: '#/components/schemas/SearchResult'
            - type: 'null'
        sections:
          type: array
          description: Ordered by how well each matches; ties break tracks, then albums, then artists. A section with no match is left out.
          items:
            type: object
            required: [type, items, total]
            properties:
              type: { $ref: '#/components/schemas/SearchSectionType' }
              items:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }
              total: { type: integer }
        nearMisses:
          type: array
          description: Suggested queries when little or nothing matched (`requirements/search.md` §8). Always empty until suggestions are built.
          items: { type: string }
        libraryEmpty:
          type: boolean
          description: Distinguishes "no music yet" from "nothing matches".

    RecentSearch:
      type: object
      required: [id, query, selected, searchedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        query: { type: string }
        selected:
          description: The result acted on, if any.
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        searchedAt: { type: string, format: date-time }

    RecentSearchCreate:
      type: object
      required: [query]
      properties:
        query: { type: string, description: 'Trimmed. At most 500 bytes.' }
        selected:
          $ref: '#/components/schemas/EntityRef'
          description: The result acted on, if any. A track, album, or artist in this library.

    # ───────────────────────────── Playlists ─────────────────────────────
    PlaylistBase:
      type: object
      required: [id, title, description, image]
      description: What any source can say about a playlist. `Playlist` adds what only the user's own playlists have.
      properties:
        source: { $ref: '#/components/schemas/Source' }
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: [string, 'null'] }
        image:
          description: For the user's own playlist, a mosaic of the album images of its first tracks; `null` when none of its tracks has one. With fewer than four distinct album images it is the first of them alone. Its ID is opaque and changes whenever the mosaic would. A custom image is planned.
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    Playlist:
      allOf:
        - $ref: '#/components/schemas/PlaylistBase'
        - type: object
          required: [libraryId, kind, customImage, trackCount, durationUs, pinned, createdAt, modifiedAt, version]
          properties:
            libraryId: { $ref: '#/components/schemas/Id' }
            kind:
              type: string
              enum: [saved, liked]
              description: |
                `liked` for the caller's Liked Songs, whose tracks are their likes, with a fixed
                title and no image of its own, which clients draw as a heart; `saved` for the rest
                (`requirements/playlists.md` §11).
            customImage:
              type: boolean
              description: Whether `image` is a custom upload rather than the generated mosaic; `deletePlaylistImage` reverts it.
            trackCount:
              type: integer
              description: Every track in the playlist, missing ones included (`requirements/playlists.md` §3), and those the caller hid left out (`requirements/conventions.md` §8).
            durationUs:
              $ref: '#/components/schemas/DurationUs'
              description: Of every track in the playlist, missing ones included, and those the caller hid left out.
            pinned: { type: boolean }
            createdAt: { type: string, format: date-time }
            modifiedAt: { type: string, format: date-time }
            version:
              type: integer
              description: Advances with every change; edits apply only against the version they were made on.
            personal: { $ref: '#/components/schemas/Personal' }

    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Playlist' }

    PlaylistItem:
      type: object
      description: |
        Exactly one of `track`, from the library, or `external`, from a source, is set. Items are
        named by position, so a duplicate track is a separate item.
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        external: { $ref: '#/components/schemas/TrackBase' }
        addedAt: { type: string, format: date-time }
        hidden:
          type: boolean
          description: |
            A track the caller hid. It keeps its place, so positions stay the playlist's, but a
            client neither shows nor plays it (`requirements/playlists.md` §3). Left out, or
            `false`, for the rest.

    PlaylistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [version, items]
          properties:
            version:
              type: integer
              description: The playlist version these positions belong to, the `baseVersion` for edits made from them.
            items:
              type: array
              items: { $ref: '#/components/schemas/PlaylistItem' }

    PlaylistCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        items:
          type: array
          description: Albums, artists, and playlists expand to their tracks in order.
          items: { $ref: '#/components/schemas/Playable' }
        fromMix:
          type: string
          description: Save a generated mix as it is now (`requirements/playlists.md` §8). `title` defaults sensibly. Planned.

    PlaylistOp:
      description: |
        Positions are zero-based indexes into the playlist as this op finds it, after the ops
        before it in the same edit. A position out of range fails the whole edit.
      oneOf:
        - type: object
          required: [op, items]
          properties:
            op: { const: add }
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Playable' }
            at:
              type: integer
              minimum: 0
              description: Position the first added track takes. Omitted appends.
        - type: object
          required: [op, positions]
          properties:
            op: { const: remove }
            positions:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 0 }
        - type: object
          required: [op, positions, at]
          properties:
            op: { const: move }
            positions:
              type: array
              minItems: 1
              uniqueItems: true
              description: Any selection, contiguous or not; relative order is preserved.
              items: { type: integer, minimum: 0 }
            at:
              type: integer
              minimum: 0
              description: Position the first moved track takes once the move is done.

    PlaylistAppliedOp:
      description: |
        A `PlaylistOp` as the server applied it, sent in the `playlist` realtime message. Remove
        and move are as they were asked; an add names tracks rather than playables.
      oneOf:
        - type: object
          required: [op, trackIds, addedAt]
          properties:
            op: { const: add }
            trackIds:
              type: array
              description: The tracks to insert, in order, less any no longer in the library.
              items: { $ref: '#/components/schemas/Id' }
            at:
              type: integer
              minimum: 0
              description: Position the first track takes. Omitted appends.
            addedAt:
              type: string
              format: date-time
              description: The `addedAt` of each of the tracks.
        - type: object
          required: [op, positions]
          properties:
            op: { const: remove }
            positions:
              type: array
              items: { type: integer, minimum: 0 }
        - type: object
          required: [op, positions, at]
          properties:
            op: { const: move }
            positions:
              type: array
              items: { type: integer, minimum: 0 }
            at: { type: integer, minimum: 0 }

    PlaylistEdit:
      type: object
      required: [baseVersion]
      minProperties: 2
      description: Every part applies, or none does.
      properties:
        baseVersion:
          type: integer
          description: The version the edit was made against.
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        pinned: { type: boolean }
        ops:
          type: array
          minItems: 1
          description: Applied in order.
          items: { $ref: '#/components/schemas/PlaylistOp' }

    # ───────────────────────────── Contexts ─────────────────────────────
    Context:
      description: |
        Anything playable as a run of tracks (`requirements/queue.md` Overview). A context
        resolves to the same ordered tracks on the server and in the shared core.
      oneOf:
        - $ref: '#/components/schemas/EntityContext'
        - $ref: '#/components/schemas/ArtistContext'
        - $ref: '#/components/schemas/SearchContext'
        - $ref: '#/components/schemas/FilterContext'
        - $ref: '#/components/schemas/RadioContext'
        - $ref: '#/components/schemas/ExternalContext'
      discriminator:
        propertyName: type
        mapping:
          track: '#/components/schemas/EntityContext'
          album: '#/components/schemas/EntityContext'
          playlist: '#/components/schemas/EntityContext'
          tag: '#/components/schemas/EntityContext'
          mix: '#/components/schemas/EntityContext'
          artist: '#/components/schemas/ArtistContext'
          search: '#/components/schemas/SearchContext'
          filter: '#/components/schemas/FilterContext'
          library: '#/components/schemas/FilterContext'
          radio: '#/components/schemas/RadioContext'
          external: '#/components/schemas/ExternalContext'

    EntityContext:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [track, album, playlist, tag, mix]
        id: { $ref: '#/components/schemas/Id' }

    ArtistContext:
      type: object
      required: [type, id]
      properties:
        type: { const: artist }
        id: { $ref: '#/components/schemas/Id' }
        scope:
          type: string
          enum: [all, discography, appearances, topTracks]
          default: all

    SearchContext:
      type: object
      required: [type, query, section]
      properties:
        type: { const: search }
        query: { type: string }
        section:
          type: string
          enum: [tracks, lyrics]
        within:
          type: string
          pattern: '^(artist|album|playlist):.+$'
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    BrowseFilter:
      type: object
      description: The browse filters, as a value (`requirements/tags.md` §7).
      properties:
        tagAll:
          type: array
          items: { type: string }
        tagAny:
          type: array
          items: { type: string }
        yearFrom: { type: integer }
        yearTo: { type: integer }
        albumTypes:
          type: array
          items: { $ref: '#/components/schemas/AlbumType' }
        availability: { $ref: '#/components/schemas/Availability' }
        played:
          type: string
          enum: [never, ever]
        lastPlayedBefore: { type: string, format: date-time }
        lastPlayedAfter: { type: string, format: date-time }
        minPlayCount: { type: integer }

    FilterContext:
      type: object
      required: [type]
      description: '`filter` is a filtered view; `library` is the whole library. Neither leaves anything behind.'
      properties:
        type:
          type: string
          enum: [filter, library]
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    RadioContext:
      type: object
      required: [type, seed]
      properties:
        type: { const: radio }
        seed:
          $ref: '#/components/schemas/EntityRef'
          description: Track, album, artist, playlist, or tag (`requirements/recommendations.md` §4).

    ExternalContext:
      type: object
      required: [type, sourceId, itemId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        itemId: { type: string }

    # ───────────────────────────── Player ─────────────────────────────
    PlayerState:
      type: object
      required: [status, activeDeviceId, itemId, positionMs, positionAt, volume]
      properties:
        status:
          type: string
          enum: [playing, paused, stopped]
        activeDeviceId:
          type: [string, 'null']
          description: |
            The one device holding playback for the account, playing or paused
            (`requirements/realtime.md` §2); `null` when stopped or before anything has played.
            When the connection it plays over closes, playback stops where it got to, and any
            device can carry on from there (§6).
        itemId:
          type: [string, 'null']
          description: |
            The queue item playback is at, as the active device last reported it, `<key>.<position>`:
            an item of the account's active queue when it was reported. A device finds its track in
            the queue it holds. A new queue replaces the active one without touching the state,
            which keeps naming its item until the next report, so a client that finds the item
            absent from its queue has nothing to resume or hand over. `null` before anything has
            played.
        external:
          $ref: '#/components/schemas/ExternalTrackRef'
          description: The external track playing. Planned.
        positionMs: { type: integer }
        positionAt:
          type: string
          format: date-time
          description: Server time at which `positionMs` was true. While playing, clients extrapolate from it, so position never drifts.
        volume:
          type: [number, 'null']
          description: The active device's volume, as it last reported. Changed with `setVolume`.

    PlayerCommand:
      description: |
        Transport control, targeting any of the caller's devices (`requirements/realtime.md` §3).
        Last command wins. Sent over the realtime connection as `playerCommand`, and passed on
        to the target as `execute`. `setVolume` and `transfer` go to the device they name; every
        other command goes to the connection playing. Each command's own fields are in the
        schema its `type` maps to.
      type: object
      required: [type, commandId]
      properties:
        type: { type: string }
        commandId: { $ref: '#/components/schemas/CommandId' }
        deviceId:
          type: string
          description: |
            The target device. For a command that goes to the connection playing it may be left
            out, and the command fails if it names any other device.
      oneOf:
        - $ref: '#/components/schemas/TransportCommand'
        - $ref: '#/components/schemas/SeekCommand'
        - $ref: '#/components/schemas/VolumeCommand'
        - $ref: '#/components/schemas/TransferCommand'
      discriminator:
        propertyName: type
        mapping:
          play: '#/components/schemas/TransportCommand'
          pause: '#/components/schemas/TransportCommand'
          next: '#/components/schemas/TransportCommand'
          previous: '#/components/schemas/TransportCommand'
          seek: '#/components/schemas/SeekCommand'
          setVolume: '#/components/schemas/VolumeCommand'
          transfer: '#/components/schemas/TransferCommand'

    TransportCommand:
      type: object
      description: Fails when nothing is playing; `transfer` wakes an idle device (`requirements/realtime.md` §3).
      properties:
        type:
          type: string
          enum: [play, pause, next, previous]

    SeekCommand:
      type: object
      required: [positionMs]
      properties:
        type: { const: seek }
        positionMs: { type: integer, minimum: 0 }

    VolumeCommand:
      type: object
      required: [deviceId, volume]
      description: |
        Volume belongs to the device (`requirements/realtime.md` §3), so this goes to the device
        named, playing or not: to its connection playing, or else its newest. Playback starting
        elsewhere meanwhile does not fail it. `device_unavailable` when the device is not
        connected.
      properties:
        type: { const: setVolume }
        deviceId: { type: string }
        volume: { type: number, minimum: 0, maximum: 1 }

    TransferCommand:
      type: object
      required: [deviceId]
      x-status: draft
      description: |
        Shift: moves playback to the device named, which also wakes an idle one. Its newest
        connection takes the track and position from the latest `player` state it received and
        takes playback over with a `start` report, answering once it has, not once its audio
        plays. To the device already holding playback it is `applied` at once, or plays there if
        paused and `play` is true. The device's volume stays its own. `device_unavailable` when
        the device is not connected or nothing has played.
      properties:
        type: { const: transfer }
        deviceId: { type: string }
        play:
          type: boolean
          default: true
          description: Continue playing on arrival, or arrive paused.

    CommandResult:
      type: object
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/CommandId' }
        status:
          type: string
          enum: [pending, applied, failed]
          description: |
            `pending` until the target confirms. Every failure is reported
            (`requirements/realtime.md` §5): at once when the command is invalid or nothing is
            playing, which over HTTP is a `409`, `422`, or `429` problem instead; when the
            target's connection closes; and after 5 seconds without an answer. A command
            sent again with the same `commandId` is carried out once: while it waits, its result
            goes where it was sent from last, and once finished it is answered again for any of
            the account's latest 32 commands. At most 16 of an account's commands wait at a time.
        reason: { type: string }

    ProgressReport:
      type: object
      x-status: draft
      required: [itemId, status, positionMs]
      description: |
        Sent over the realtime connection by the playing device, or one taking playback over
        (`start`); a report is the device's whose connection sends it. A report that is refused
        — invalid, from any connection but the active one, or naming an item the account's
        active queue does not have — is answered with the current state; one that does not parse
        is ignored. `buffering` is recorded as `paused` at its position.

        A report names only the active queue's item, and no queue: item IDs never repeat across
        an account's queues. A device restoring a kept queue reports as a start (`start`), since
        another device may be playing.
      properties:
        itemId:
          type: string
          description: |
            An item of the account's active queue, in any of its sections, `<key>.<position>`.
            The track is the one the queue has under it.
        start:
          type: boolean
          default: false
          description: |
            Set when the user starts playback on this connection, taking over from the device
            playing (`requirements/realtime.md` §2). Without it, a report from any connection but
            the active one is refused, and a `stopped` report never takes over. A device stops
            playing only when the state names another device active; with several connections,
            such as browser tabs, it plays in one at a time.

            A new connection is never the active one: a device still playing when it connects
            waits for the state it is sent, stops if that names another device, and otherwise
            sets `start` on its next report. A playing device also sets `start` whenever a state
            it receives names no active device.
        status:
          type: string
          enum: [playing, paused, stopped, buffering]
        positionMs: { type: integer, minimum: 0 }
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: The device's current volume, so remote controls show it (`requirements/realtime.md` §3).

    # ───────────────────────────── Queue ─────────────────────────────
    StartQueue:
      type: object
      required: [queueId, context, source, start]
      properties:
        queueId:
          type: string
          format: uuid
          description: Client-generated. Names the queue among the account's own.
        context:
          $ref: '#/components/schemas/Context'
          description: What the queue started from, kept as sent.
        source:
          type: object
          required: [key, libraryId]
          description: |
            Exactly one of `tracks` and `recipe`.
          properties:
            key:
              type: string
              format: uuid
              description: Client-generated. Names the source's items, `<key>.<position>`.
            libraryId: { type: string }
            tracks:
              type: array
              description: |
                The tracks as the device resolved them, in play order. A track may appear more than
                once; each place is its own item.
              items: { type: string }
            recipe:
              description: What the server resolves into the list. Needs `startTrackId`.
              oneOf:
                - $ref: '#/components/schemas/QueueAlbumRecipe'
                - $ref: '#/components/schemas/QueueArtistRecipe'
                - $ref: '#/components/schemas/QueueLibraryRecipe'
                - $ref: '#/components/schemas/QueueSearchRecipe'
                - $ref: '#/components/schemas/QueuePlaylistRecipe'
              discriminator:
                propertyName: type
                mapping:
                  album: '#/components/schemas/QueueAlbumRecipe'
                  artist: '#/components/schemas/QueueArtistRecipe'
                  library: '#/components/schemas/QueueLibraryRecipe'
                  search: '#/components/schemas/QueueSearchRecipe'
                  playlist: '#/components/schemas/QueuePlaylistRecipe'
        start:
          type: integer
          minimum: 0
          description: |
            With `tracks`, the position of the track that plays first. With a recipe, the index of
            the clicked track in the view the device showed.
        startTrackId:
          type: string
          description: With a recipe, the track that plays first. The server uses `start` if its list holds this track there, and otherwise the first place it appears.

    StartedQueue:
      type: object
      required: [list, length]
      properties:
        list:
          type: string
          description: The hash the server holds the source's list under, which is the source's `list` in the snapshot.
        length: { type: integer, minimum: 1 }

    EditQueue:
      type: object
      required: [editId, queueId, edit]
      properties:
        editId:
          type: string
          format: uuid
          description: Client-generated. Names the edit, so one sent again is applied once.
        queueId:
          type: string
          format: uuid
          description: The active queue, which the edit is for.
        edit:
          description: |
            The same edits as `QueueEdit`, except that an `add`'s source names its tracks as
            `tracks` or a `recipe`, and carries no `list` or `length`.
          oneOf:
            - $ref: '#/components/schemas/QueueEditNoAdd'
            - type: object
              required: [type, source, before]
              properties:
                type: { const: add }
                source:
                  type: object
                  required: [key, libraryId]
                  description: Exactly one of `tracks` and `recipe`.
                  properties:
                    key:
                      type: string
                      format: uuid
                    libraryId: { type: string }
                    tracks:
                      type: array
                      items: { type: string }
                    recipe:
                      oneOf:
                        - $ref: '#/components/schemas/QueueAlbumRecipe'
                        - $ref: '#/components/schemas/QueueArtistRecipe'
                        - $ref: '#/components/schemas/QueueLibraryRecipe'
                        - $ref: '#/components/schemas/QueueSearchRecipe'
                        - $ref: '#/components/schemas/QueuePlaylistRecipe'
                      discriminator:
                        propertyName: type
                        mapping:
                          album: '#/components/schemas/QueueAlbumRecipe'
                          artist: '#/components/schemas/QueueArtistRecipe'
                          library: '#/components/schemas/QueueLibraryRecipe'
                          search: '#/components/schemas/QueueSearchRecipe'
                          playlist: '#/components/schemas/QueuePlaylistRecipe'
                before: { $ref: '#/components/schemas/QueueAnchor' }

    AppliedEdit:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The queue's version once the edit was applied.
        source:
          allOf:
            - $ref: '#/components/schemas/QueueSource'
          description: For an `add`, the source as registered, with the server's `list` and `length`. Not there for other edits.

    QueueEdit:
      description: |
        One change to the queue, as the shared core applies it and `queueEdit` carries it. Items
        are `<key>.<position>`. Items an edit names that are gone, or not in Up Next, are ignored.
      oneOf:
        - $ref: '#/components/schemas/QueueEditNoAdd'
        - type: object
          required: [type, source, before]
          description: Registers a new source and puts all its rows at the anchor, in order. Its `list` and `length` are the server's.
          properties:
            type: { const: add }
            source: { $ref: '#/components/schemas/QueueSource' }
            before: { $ref: '#/components/schemas/QueueAnchor' }

    QueueEditNoAdd:
      description: The edits that name items and carry no source.
      oneOf:
        - type: object
          required: [type, items]
          description: Drops items from Up Next.
          properties:
            type: { const: remove }
            items: { type: array, items: { type: string } }
        - type: object
          required: [type, items, before]
          description: Moves items of Up Next to the anchor, keeping their relative order.
          properties:
            type: { const: move }
            items: { type: array, items: { type: string } }
            before: { $ref: '#/components/schemas/QueueAnchor' }
        - type: object
          required: [type, item]
          description: Plays an item of Up Next now. Everything ahead of it leaves Up Next as plays.
          properties:
            type: { const: jump }
            item: { type: string }
        - type: object
          required: [type]
          description: Plays the next item.
          properties:
            type: { const: next }
        - type: object
          required: [type, key]
          description: |
            Steps back to the latest play. `key` is a new UUID, used only when the play's item is
            still queued, and then names the copy made.
          properties:
            type: { const: previous }
            key: { type: string, format: uuid }
        - type: object
          required: [type, plays]
          description: |
            Takes plays out of History. A play whose number or item does not match is ignored,
            and if none acts the edit changes nothing, `adjusted` included, though it is still
            applied and answered as any edit.
          properties:
            type: { const: removePlays }
            plays: { type: array, items: { $ref: '#/components/schemas/QueuePlayRef' } }
        - type: object
          required: [type, play, key]
          description: |
            Puts a copy of a played item at the front of Up Next and takes the play out of
            History. `key` is a new UUID, which names the copy. A play that does not match is
            ignored, as for `removePlays`.
          properties:
            type: { const: requeue }
            play: { $ref: '#/components/schemas/QueuePlayRef' }
            key: { type: string, format: uuid }
        - type: object
          required: [type, play, key]
          description: |
            Steps back until the play is current, as `previous` repeated would. `key` is a new
            UUID, used only when some of the plays are still queued, and then names the one copy
            made. `409 play_gone` if the play does not match, unlike `requeue`, so the device can
            revert.
          properties:
            type: { const: rewind }
            play: { $ref: '#/components/schemas/QueuePlayRef' }
            key: { type: string, format: uuid }
        - type: object
          required: [type, on, seed]
          description: Shuffles the unplayed context with `seed`, or puts it back in order. Turning shuffle on while on, or off while off, does nothing.
          properties:
            type: { const: shuffle }
            on: { type: boolean }
            seed: { type: integer, minimum: 0, maximum: 4294967295 }
        - type: object
          required: [type, mode]
          properties:
            type: { const: repeat }
            mode: { type: string, enum: [off, all, one] }

    QueuePlayRef:
      type: object
      required: [play, item]
      description: |
        A play of History as an edit names it. It is acted on only if the number and the item
        both match, since a device's play numbers are guesses until confirmed.
      properties:
        play: { type: integer, minimum: 0, description: "The play's number." }
        item: { type: string, description: The item it played. }

    QueueAnchor:
      description: Where an add or move lands.
      oneOf:
        - type: object
          required: [type]
          description: The front of the Manual Queue (Queue Next).
          properties:
            type: { const: manualStart }
        - type: object
          required: [type]
          description: The end of the Manual Queue (Queue Last).
          properties:
            type: { const: manualEnd }
        - type: object
          required: [type]
          description: The end of the context's Up Next.
          properties:
            type: { const: contextEnd }
        - type: object
          required: [type, item]
          description: Just ahead of an item in Up Next. `409 anchor_gone` if it is not there.
          properties:
            type: { const: before }
            item: { type: string }

    QueueList:
      type: object
      required: [libraryId, tracks]
      properties:
        libraryId: { type: string, description: The library every track of the list is in. }
        tracks:
          type: array
          items: { type: string }
          description: Track IDs, in the list's order.

    QueueRow:
      type: object
      required: [item, libraryId, trackId]
      properties:
        item:
          type: string
          description: '`<key>.<position>`: what edits name.'
        libraryId: { type: string }
        trackId:
          type: [string, 'null']
          description: The row's track, or `null` where it cannot be read, which makes the row unavailable.
        play:
          type: integer
          minimum: 0
          description: A History row's play number.

    QueueRows:
      type: object
      required: [queueId, version, total, manual, shuffled, repeat, rows]
      properties:
        queueId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        current:
          $ref: '#/components/schemas/QueueRow'
        total: { type: integer, minimum: 0, description: The rows in the section. }
        manual:
          type: integer
          minimum: 0
          description: In `upNext`, the Manual Queue's rows at its top; `0` in `history`.
        shuffled: { type: boolean }
        repeat: { type: string, enum: [off, all, one] }
        rows:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/QueueRow' }

    KeptQueue:
      type: object
      required: [queueId, context, lastActive, upNext, history]
      properties:
        queueId: { type: string, format: uuid }
        context: { $ref: '#/components/schemas/Context' }
        lastActive:
          type: string
          format: date-time
          description: When the queue was parked.
        current:
          type: object
          description: What was playing, if anything.
          required: [libraryId, trackId]
          properties:
            libraryId: { type: string }
            trackId:
              type: [string, 'null']
              description: The track, or `null` where it cannot be read.
        upNext: { type: integer, minimum: 0, description: The rows in Up Next. }
        history: { type: integer, minimum: 0, description: The rows in History. }

    KeptQueuePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/KeptQueue' }

    RestoredQueue:
      description: The queue as `getQueue` answers, with where its playback was left.
      allOf:
        - $ref: '#/components/schemas/QueueSnapshot'
        - type: object
          properties:
            position:
              type: object
              description: Absent if no position was known.
              required: [item, positionMs]
              properties:
                item: { type: string, description: 'The item, `<key>.<position>`.' }
                positionMs: { type: integer, minimum: 0 }

    QueueSnapshot:
      type: object
      required: [queueId, version, context, state]
      properties:
        queueId: { type: string, format: uuid }
        version:
          type: integer
          minimum: 0
          description: Zero as the queue starts. Each edit the server applies adds one.
        context: { $ref: '#/components/schemas/Context' }
        state: { $ref: '#/components/schemas/QueueState' }

    QueueState:
      type: object
      required: [sources, copies, manual, order, cursor, current, history, nextPlay, shuffle, repeat, adjusted]
      description: |
        The queue as the shared core holds it: a few spans over views of frozen lists, so it grows
        with edits and not with tracks. A client may read it without the core. The shape is
        stable: a change to it is a breaking change.

        A **source** is a frozen list of tracks, named by its `key`. An **item** is one place in a
        source or a copy: its ID is `<key>.<position>`, and it never changes while the item is
        queued. The same track twice is two items. A **view** is a source or copy, read as it is,
        or the context's one shuffle. A **span** is positions `start` to `start + len` of a view,
        and is never empty.

        The queue plays `current`, then **Up Next**: the `manual` spans in order (the Manual
        Queue), then the rows of `order` from `cursor` on (the context). `history` holds what has
        played. An item is in Up Next at most once.
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/QueueSource' }
        copies:
          type: array
          description: Copies of spans made by edits, each under its own key.
          items: { $ref: '#/components/schemas/QueueCopy' }
        manual:
          type: array
          description: The Manual Queue, in play order. It plays before the context's Up Next.
          items: { $ref: '#/components/schemas/QueueSpan' }
        order:
          type: array
          description: |
            The context in play order, the part already passed included, so Repeat All can play
            it again and unshuffling can put it back.
          items: { $ref: '#/components/schemas/QueueSpan' }
        cursor:
          type: integer
          minimum: 0
          description: |
            How many rows of `order` are passed. The context's Up Next is the rows from `cursor`
            on. It counts passed context rows and nothing more: `current` is the last of them
            only while a context item plays that was reached in order. While a Manual item plays,
            or after an unshuffle that leaves passed additions, it is not.
        current:
          type: [string, 'null']
          description: The item playing, or `null` when the queue has ended.
        history:
          type: array
          description: Runs of plays, oldest first. The newest 1,000 runs are kept.
          items: { $ref: '#/components/schemas/QueueRun' }
        nextPlay:
          type: integer
          minimum: 0
          description: The number of the next play. It only counts up, so a number is never reused.
        shuffle:
          type: [object, 'null']
          description: |
            Set while the context is shuffled, which `order` then reads through the `shuffle`
            view: position `p` of that view is the item at position π(`p`) of `base`, where π is
            the seeded permutation of the base's rows that the shared core defines. `null`
            otherwise.
          required: [seed, base]
          properties:
            seed:
              type: integer
              minimum: 0
              maximum: 4294967295
              description: Fixes the permutation.
            base:
              type: array
              description: The context's unplayed spans, frozen when the shuffle began.
              items: { $ref: '#/components/schemas/QueueSpan' }
        repeat:
          type: string
          enum: [off, all, one]
          description: |
            What happens when the context ends: `off` stops, `all` plays the context again in the
            order it was in, and `one` plays the current item again.
        adjusted:
          type: boolean
          description: |
            Whether anything was queued, removed or moved. It is never cleared, and decides
            whether a start keeps this queue or deletes it.

    QueueSource:
      type: object
      required: [key, libraryId, length]
      description: A frozen list of tracks. The snapshot carries its hash and length, never its tracks.
      properties:
        key:
          type: string
          format: uuid
          description: Chosen by the device that added it, and unique across sources and copies.
        libraryId:
          type: string
          description: The library every track of the list belongs to.
        list:
          type: string
          description: |
            The lowercase hex SHA-256 of the list's track IDs, each as 8 bytes little-endian,
            in order. It names the list. Left out until the server confirms the list.
        length:
          type: integer
          minimum: 0
          description: The number of tracks, and so of positions.
        recipe:
          $ref: '#/components/schemas/QueueRecipe'
          description: How the list was made, when it is known. It is not what plays; the list is.

    QueueRecipe:
      description: How a list was made. Every field that changes the order is part of it.
      oneOf:
        - $ref: '#/components/schemas/QueueAlbumRecipe'
        - $ref: '#/components/schemas/QueueArtistRecipe'
        - $ref: '#/components/schemas/QueueLibraryRecipe'
        - $ref: '#/components/schemas/QueueSearchRecipe'
        - $ref: '#/components/schemas/QueuePlaylistRecipe'
        - $ref: '#/components/schemas/QueueTracksRecipe'
      discriminator:
        propertyName: type
        mapping:
          album: '#/components/schemas/QueueAlbumRecipe'
          artist: '#/components/schemas/QueueArtistRecipe'
          library: '#/components/schemas/QueueLibraryRecipe'
          search: '#/components/schemas/QueueSearchRecipe'
          playlist: '#/components/schemas/QueuePlaylistRecipe'
          tracks: '#/components/schemas/QueueTracksRecipe'

    QueueAlbumRecipe:
      type: object
      required: [type, albumId, sort, order]
      description: An album's tracks in a sort.
      properties:
        type: { const: album }
        albumId: { type: string }
        filters:
          allOf:
            - $ref: '#/components/schemas/BrowseFilter'
          description: |
            The view's tag filter, `tagAll` and `tagAny` as of `listTracks`; the list is the
            view's tracks under it. Left out for none. Any other filter of `BrowseFilter` is
            `422` on a start, as are more than 100 tags together; a tag the library lacks matches
            no track.
        sort: { $ref: '#/components/schemas/QueueTrackSort' }
        order: { $ref: '#/components/schemas/QueueTrackOrder' }

    QueueArtistRecipe:
      type: object
      required: [type, artistId, scope, artistCredit, sort, order]
      description: An artist's tracks, by scope and credit, in a sort.
      properties:
        type: { const: artist }
        artistId: { type: string }
        scope:
          type: string
          description: |
            Which of the artist's tracks. Only `all` is supported so far; any other value, such
            as `topTracks`, is `422` on a start until it is built.
        artistCredit:
          type: string
          enum: [any, owned, featured]
          description: As `artistCredit` of `listTracks`.
        filters:
          allOf:
            - $ref: '#/components/schemas/BrowseFilter'
          description: |
            The view's tag filter, `tagAll` and `tagAny` as of `listTracks`; the list is the
            view's tracks under it. Left out for none. Any other filter of `BrowseFilter` is
            `422` on a start, as are more than 100 tags together; a tag the library lacks matches
            no track.
        sort: { $ref: '#/components/schemas/QueueTrackSort' }
        order: { $ref: '#/components/schemas/QueueTrackOrder' }

    QueueLibraryRecipe:
      type: object
      required: [type, filters, sort, order]
      description: A library's tracks under filters, in a sort.
      properties:
        type: { const: library }
        filters:
          allOf:
            - $ref: '#/components/schemas/BrowseFilter'
          description: |
            The view's tag filter, `tagAll` and `tagAny` as of `listTracks`; the list is the
            view's tracks under it. Any other filter of `BrowseFilter` is `422` on a start, as
            are more than 100 tags together; a tag the library lacks matches no track.
        sort: { $ref: '#/components/schemas/QueueTrackSort' }
        order: { $ref: '#/components/schemas/QueueTrackOrder' }

    QueueTrackSort:
      type: string
      enum: [name, artist, album, dateAdded, playCount, lastPlayed, releaseDate, duration, top]
      description: |
        A sort of `listTracks`, in the direction `order` gives. The list is that of a view paged
        to its end: ties end on the track ID, and a track with no value in the sort's field
        comes last in both directions. `playCount`, `lastPlayed` and `top` are planned: a start
        with one is `422` until they are built, as they are for `listTracks`.

    QueueTrackOrder:
      type: string
      enum: [asc, desc]
      description: The direction of the recipe's `sort`, as `order` of `listTracks`.

    QueueSearchRecipe:
      type: object
      required: [type, q]
      description: A search's tracks, all of them, in the search's ranking.
      properties:
        type: { const: search }
        q: { type: string, minLength: 1 }
        filters:
          allOf:
            - $ref: '#/components/schemas/BrowseFilter'
          description: |
            The search's tag filter, `tagAll` and `tagAny` as of `search`; the list is the
            tracks it finds under it. Left out for none. Any other filter of `BrowseFilter` is
            `422` on a start, as are more than 100 tags together; a tag the library lacks matches
            no track.

    QueuePlaylistRecipe:
      type: object
      required: [type, playlistId]
      description: |
        The caller's own playlist in the source's library, at its current version, under a tag
        filter and in a sort. Its items are in the playlist's own order unless `sort` is given,
        a track as often as the playlist holds it and a missing track in place. The list is the
        playlist's page as it shows it with that sort and filter, in the same order: sorted
        as the page sorts, by the sort keys of `Track`, ties ending on the track ID and then the
        item's place in the playlist, and a track with no value in the sort's field last in both
        directions. Only the caller's own playlist resolves; another account's, an admin's
        included, and one that does not exist are `404` alike.
      properties:
        type: { const: playlist }
        playlistId: { type: string }
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            The playlist's version the server resolved, for the interface to say what played.
            Set on the stored recipe, never sent; a request with it is `422`.
        filters:
          allOf:
            - $ref: '#/components/schemas/BrowseFilter'
          description: |
            The page's tag filter, `tagAll` and `tagAny` as of `listTracks`; the list is the
            playlist's items whose track carries them. Left out for none. Any other filter of
            `BrowseFilter` is `422` on a start, as are more than 100 tags together; a tag the
            library lacks matches no track.
        sort:
          type: string
          enum: [name, artist, album, releaseDate, addedToPlaylist, duration]
          description: |
            A sort of the playlist's page: `listTracks`' sort of the same name, or
            `addedToPlaylist`, when the item was added to the playlist. Left out, with `order`,
            for the playlist's own order.
        order:
          allOf:
            - $ref: '#/components/schemas/QueueTrackOrder'
          description: |
            The direction of `sort`. Sent with `sort` and only with it; either alone is `422`.
            Descending reverses the sort, ties and tracks with no value included in their rule,
            but items the sort cannot tell apart keep the playlist's order.

    QueueTracksRecipe:
      type: object
      required: [type]
      description: Track IDs the device sent.
      properties:
        type: { const: tracks }

    QueueCopy:
      type: object
      required: [key, of]
      description: |
        A copy of some spans under a new identity: its position `p` is the item `<key>.<p>`. The
        spans it covers name sources only.
      properties:
        key:
          type: string
          format: uuid
        of:
          type: array
          items: { $ref: '#/components/schemas/QueueSpan' }

    QueueSpan:
      type: object
      required: [view, start, len]
      description: Positions `start` to `start + len` of a view.
      properties:
        view:
          description: The key of a source or copy, or the context's shuffle.
          oneOf:
            - type: object
              required: [key]
              properties:
                key: { type: string }
            - type: string
              const: shuffle
        start:
          type: integer
          minimum: 0
        len:
          type: integer
          minimum: 1

    QueueRun:
      type: object
      required: [first, span]
      description: |
        Consecutive plays of consecutive positions of one view: an album played through is one run.
        Play `first + i` played the item at position `span.start + i`.
      properties:
        first:
          type: integer
          minimum: 0
          description: The number of the run's first play.
        span: { $ref: '#/components/schemas/QueueSpan' }

    # ───────────────────────────── Listening ─────────────────────────────
    QueueOrigin:
      type: string
      enum: [manual, context, automatic]
      description: '`automatic` marks radio and endless-play additions (`requirements/queue.md` §5).'

    PlayReport:
      type: object
      required: [playId, libraryId, startedAt, listenTimeMs, context, origin]
      description: |
        Every track that starts is a play; `listenTimeMs` is audio actually heard
        (`requirements/analytics.md` §1). Exactly one of `trackId` or `external` is set. A
        play of a track no longer in a library the caller reaches is left out. A play is
        recorded on the device whose token reports it. A play of an external track is accepted
        but not recorded. `context` and `reason` are kept as sent: the server checks that
        `context` is an object with a string `type` and that `reason` is an object, and that each
        serializes to at most 4 KiB.
      properties:
        playId:
          type: string
          format: uuid
          description: Client-generated on start. Later reports for the same play update it.
        libraryId: { type: string }
        trackId: { type: string }
        external: { $ref: '#/components/schemas/ExternalTrackRef' }
        startedAt:
          type: string
          format: date-time
          description: When it happened, never when it synced.
        listenTimeMs:
          type: integer
          minimum: 0
          description: Cumulative. May exceed the duration when parts were replayed.
        end:
          type: [string, 'null']
          enum: [finished, skipped, stopped, null]
          description: '`null` while still playing.'
        context: { $ref: '#/components/schemas/Context' }
        origin: { $ref: '#/components/schemas/QueueOrigin' }
        reason:
          description: With `automatic` — why radio or endless play chose it.
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'

    # ───────────────────────────── Plugins ─────────────────────────────
    PluginSettings:
      type: object
      required: [schema, values, secretsSet]
      properties:
        schema:
          type: object
          description: |
            JSON Schema the plugin declares for its settings, so every plugin is configured the
            same way: an object whose `properties` are each a `string`, `number`, `integer`, or
            `boolean`, with optional `title`, `description`, `enum`, and `default`, and
            `writeOnly` for a secret. `required` names the ones it needs.
        values:
          type: object
          description: |
            The values set here, secrets omitted: the caller's own, a library's, or the
            server-wide ones. A library's override the server-wide ones, which override the
            defaults.
        secretsSet:
          type: array
          description: Names of secret fields that have a value. Their values are never returned.
          items: { type: string }

    PluginSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Omitted secret fields keep their stored value; `null` clears one.

    PersonalPlugin:
      type: object
      required: [id, name, connected, asksForSearches, sharesSearches, hearsLikes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        connected:
          type: boolean
          description: Whether the caller has saved settings for it, and so it acts for them.
        asksForSearches:
          type: boolean
          description: |
            Whether the caller could share their searches with it: it asks for them, and an admin
            allowed it.
        sharesSearches:
          type: boolean
          description: Whether the caller has turned on sharing their searches with it.
        hearsLikes:
          type: boolean
          description: |
            Whether, once the caller connects it, it is sent their likes and hides: those they
            have, then each change. It asks for them, and an admin allowed it, so the caller is
            told before connecting (`requirements/users.md` §7).

    SearchSharing:
      type: object
      required: [sharing]
      properties:
        sharing: { type: boolean }

    Plugin:
      type: object
      required: [id, name, version, apiVersion, source, installedAt, permissions, granted, hasSettings, libraries, hostLimits]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string, const: '0.1' }
        description: { type: string }
        author: { type: string }
        homepage: { type: string, format: uri }
        source:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [file, url]
            url: { type: string, format: uri }
        installedAt: { type: string, format: date-time }
        permissions:
          type: array
          description: What it asks for, from its manifest.
          items: { $ref: '#/components/schemas/PermissionRequest' }
        granted:
          type: array
          description: Plugin-wide permissions granted. Library permissions are per library, below.
          items: { $ref: '#/components/schemas/PermissionName' }
        hasSettings:
          type: boolean
          description: Whether it declares settings, read and set with `adminGetPluginSettings`.
        libraries:
          type: array
          description: Every library on the server.
          items:
            type: object
            required: [libraryId, enabled, autoDisabled, disabledReason, granted, missingRequired, lastRun]
            properties:
              libraryId: { type: string }
              enabled: { type: boolean }
              autoDisabled:
                type: boolean
                description: |
                  Disabled by the server: after one of its hooks had been failing for 72 hours
                  (`requirements/plugins.md` §11), or when a required permission was revoked.
              disabledReason: { type: [string, 'null'] }
              granted:
                type: array
                description: Library permissions granted here.
                items: { $ref: '#/components/schemas/PermissionName' }
              missingRequired:
                type: array
                description: Required permissions not granted here. While any remain, it cannot be enabled.
                items: { $ref: '#/components/schemas/PermissionName' }
              lastRun:
                description: Its last run here, by Run now or a hook; `null` if it has not run here.
                oneOf:
                  - type: object
                    required: [at, ok, summary]
                    properties:
                      at: { type: string, format: date-time }
                      ok: { type: boolean }
                      summary:
                        type: string
                        description: |
                          The plugin's own summary, or why the run failed, followed in brackets by
                          what the run was refused and about how much compute it spent, such as
                          `Saved 3. (refused Network access, a.example; about 42 ms of compute)`.
                          A run the server could not complete says only
                          `the server could not complete the run`; its cause is logged on the
                          server.
                  - type: 'null'
        hostLimits:
          type: array
          description: |
            The rate limits every plugin's requests keep to (`"per": "host"`), at the hosts this
            plugin can reach: those its `network` request names, or every one for `*`. A limit
            is in force while the plugin that set it is installed, granted `network` and
            `hostRateLimits`, and enabled in a library. A run reads them as it starts.
          items:
            type: object
            required: [host, limit, setBy, exempt]
            properties:
              host: { type: string }
              limit: { type: string, description: 'The strictest any plugin set, such as `1/s`.' }
              setBy:
                type: array
                description: IDs of the plugins that set it that strict.
                items: { type: string }
              exempt:
                type: boolean
                description: Whether this plugin is exempt from it (`adminExemptPlugin`).

    PermissionName:
      type: string
      enum: [libraryRead, libraryAdd, libraryChange, network, listeningActivity, tracksChanged, scanFinished, schedule, played, playing, searchActivity, searched, albumsChanged, artistsChanged, hostRateLimits, tagTypes, likesAndHides, marked]
      description: |
        What a plugin can ask for (`requirements/plugins.md` §4.1, §8). Hooks decide when it
        runs, and each needs the permissions named with it.
        - Per library: `libraryRead`; `libraryAdd`, creating files that do not exist yet;
          `libraryChange`, replacing, renaming, and deleting files that do; and the hooks
          `tracksChanged`, `albumsChanged`, and `artistsChanged`, run as those change, and
          `scanFinished`, as a scan finishes, which each need `libraryRead`.
        - Per plugin: `network`; `listeningActivity`; `searchActivity`, the searches of users
          who share them with it (`setMySearchSharing`); `likesAndHides`, the likes and hides of
          users who connected it; and `hostRateLimits`, under which its
          `"per": "host"` rate limits bind every plugin's requests to that host, not only its own;
          and `tagTypes`, the scanner reading the fields its `types` name as types of tag, which
          once granted stay in the catalog however the grant changes (`requirements/tags.md` §2).
        - Per plugin, hooks: `schedule`, at its `everyMinutes`, in every library it is enabled
          in; `played` and `playing`, as each user who connected it finishes or starts playing
          something, needing `listeningActivity`, and `libraryRead` in the library played from;
          `searched`, as each user sharing searches with it settles on or removes one,
          needing `searchActivity` and `libraryRead`; and `marked`, as each user who connected
          it likes, unlikes, hides, or unhides a song, needing `likesAndHides` and
          `libraryRead`.

    PermissionRequest:
      type: object
      required: [permission, required, reason]
      properties:
        permission: { $ref: '#/components/schemas/PermissionName' }
        required:
          type: boolean
          description: Whether it cannot work without it (`requirements/plugins.md` §4.2).
        reason: { type: string, description: 'The author''s reason, shown to the admin beside the request.' }
        destinations:
          type: array
          description: With `network` only. Host names it reaches, or `["*"]` for any.
          items: { type: string }
        rateLimits:
          type: object
          description: |
            With `network` only, optional. The most often each destination may be asked, such
            as `"1/s"`, which counts only this plugin's requests, or as
            `{"limit": "1/s", "per": "user"}`. `per` is `plugin`; `user`, this plugin's runs for
            one connected user each; or `host`, every plugin's requests to that host, for a
            service that limits the whole server. A `host` limit needs `hostRateLimits`, and a
            destination named in `destinations` rather than reached through `*`. Where several
            plugins set one for a host, the strictest is kept to.
          additionalProperties:
            oneOf:
              - { type: string, pattern: '^[1-9][0-9]{0,8}/(s|min|h)$' }
              - type: object
                required: [limit, per]
                properties:
                  limit: { type: string, pattern: '^[1-9][0-9]{0,8}/(s|min|h)$' }
                  per: { type: string, enum: [plugin, user, host] }
        everyMinutes:
          type: integer
          minimum: 5
          description: With `schedule` only. How often it runs.
        types:
          type: array
          minItems: 1
          description: |
            With `tagTypes` only. Each type of tag it adds: its `key`, which the catalog keys
            under the plugin's id (`acousticbrainz.energy`), the `name` people see, and the `field`
            it is read from in each file (`design/plugins.md` §6).
          items:
            type: object
            required: [key, name, field]
            properties:
              key: { type: string, pattern: '^[a-z0-9-]{1,32}$' }
              name: { type: string, minLength: 1, maxLength: 40 }
              field: { type: string, pattern: '^[A-Za-z0-9_]{1,64}$' }

    PermissionGrants:
      type: object
      required: [granted, libraries]
      properties:
        granted:
          type: array
          description: Plugin-wide permissions.
          items: { $ref: '#/components/schemas/PermissionName' }
        libraries:
          type: array
          items:
            type: object
            required: [libraryId, granted]
            properties:
              libraryId: { type: string }
              granted:
                type: array
                items: { $ref: '#/components/schemas/PermissionName' }

    PluginRunResult:
      type: object
      required: [ok, summary, log, saved, scannerRunning]
      properties:
        ok: { type: boolean }
        summary: { type: string, description: 'The plugin''s own one-line summary, or why the run failed, for each library it ran in, in turn.' }
        log:
          type: array
          description: Progress lines the plugin logged, in order.
          items: { type: string }
        saved: { type: integer, description: Files it saved into the library. }
        scannerRunning: { type: boolean, description: Whether a scan was queued to pick those files up. }

    # ───────────────────────────── Realtime ─────────────────────────────
    RealtimeClientMessage:
      description: A message a client sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, command]
          properties:
            type: { const: playerCommand }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, report]
          description: From the playing device, or one taking playback over.
          properties:
            type: { const: progress }
            report: { $ref: '#/components/schemas/ProgressReport' }
        - type: object
          required: [type, result]
          description: From a target device, reporting whether it carried out a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type]
          properties:
            type: { const: ping }

    RealtimeServerMessage:
      description: A message the server sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, deviceId, serverTime]
          properties:
            type: { const: hello }
            deviceId: { type: string }
            serverTime:
              type: string
              format: date-time
              description: For extrapolating playback position.
        - type: object
          required: [type, state]
          properties:
            type: { const: player }
            state: { $ref: '#/components/schemas/PlayerState' }
        - type: object
          required: [type, devices]
          properties:
            type: { const: devices }
            devices:
              type: array
              items: { $ref: '#/components/schemas/Device' }
        - type: object
          required: [type, command]
          description: |
            Sent to the target device, which carries the command out and reports a
            `commandResult` with the same `commandId`. Only the connection it was sent to can
            answer it.
          properties:
            type: { const: execute }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, result]
          description: Sent to the device that issued a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type, libraryId, playlistId, version, playlist]
          description: |
            One of the user's playlists was created, edited, or deleted. Sent to every connection
            of the user, the one that made the change included, once the change is committed;
            never for a request that was refused, and not again for a retry answered from its
            `Idempotency-Key`. Nothing about another user's playlists is ever sent.

            A `playlist` of `null` removes the playlist from the device, whatever version it
            holds. Otherwise a message whose `version` is not newer than the one the device holds
            is ignored, as messages can arrive out of order. A device holding `version - 1`
            applies `ops` to its items to reach `version`, with no refetch; one holding an older
            version reloads the playlist. A device that holds the playlist's details replaces
            them with `playlist`. The item list is never sent.

            This message and the answer to the request that made the change travel separately,
            so either can arrive first. A device therefore holds every `playlist` message that
            arrives while one of its own playlist requests (a create, edit, or delete) is
            unanswered, or while it reloads a playlist, and applies them in order once none is.
            A request stays unanswered across attempts with the same `Idempotency-Key` until one
            is answered with its result or a refusal; a device that gives up on one reloads
            instead. Applied before the answer, the message for the device's own change would
            apply its edit a second time over the one shown, or list a playlist it created
            twice; after it, the message is not newer than the version answered, so it is
            ignored, or it removes a playlist already deleted. After a refusal, such as `409`,
            the held messages apply to the version the device last had confirmed, or to the one
            it reloaded.
          properties:
            type: { const: playlist }
            libraryId: { $ref: '#/components/schemas/Id' }
            playlistId: { $ref: '#/components/schemas/Id' }
            version:
              type: integer
              description: The playlist's version after the change; for a deletion, the last it had.
            playlist:
              description: The playlist as the change left it, or `null` when it was deleted.
              oneOf:
                - $ref: '#/components/schemas/Playlist'
                - type: 'null'
            ops:
              type: array
              description: |
                What an edit applied to the items, in order, as `PlaylistOp` positions mean. An add
                names the tracks its playables expanded to, in order, so the device does not expand
                them again. Left out for a creation, a deletion, and an edit of details alone.
              items: { $ref: '#/components/schemas/PlaylistAppliedOp' }
            refetch:
              type: boolean
              description: |
                `true` when the edit changed the items but its `ops` were too many for one message
                (they are left out): the device reads the items again. Left out otherwise.
        - type: object
          required: [type, libraryId, trackId, liked]
          description: |
            A track was liked by the account, or unliked, in one library, however it was: a like
            or an unlike, a hide (which unlikes), or an edit of Liked Songs that adds or removes
            it (`requirements/playlists.md` §11). Sent to every connection of the account, the
            sender's included, beside the `playlist` message for Liked Songs, whose removes name
            positions, so a device marks the track wherever it shows it.
          properties:
            type: { const: trackLiked }
            libraryId: { $ref: '#/components/schemas/Id' }
            trackId: { $ref: '#/components/schemas/Id' }
            liked: { type: boolean }
        - type: object
          required: [type, libraryId, trackId, hidden]
          description: |
            A track was hidden from the account, or unhidden, in one library (`hideTrack`,
            `unhideTrack`, or a like, which unhides). Sent to every connection of the account,
            the sender's included. A device leaves a hidden track out of what it shows, and
            shows an unhidden one again (`requirements/conventions.md` §8).
          properties:
            type: { const: trackHidden }
            libraryId: { $ref: '#/components/schemas/Id' }
            trackId: { $ref: '#/components/schemas/Id' }
            hidden: { type: boolean }
        - type: object
          required: [type, queueId]
          description: |
            A start replaced the account's queue, so a device fetches it again (`getQueue`). Not
            sent for a start of a queue the account already has.
          properties:
            type: { const: queueReplaced }
            queueId: { type: string, format: uuid }
        - type: object
          required: [type]
          description: |
            The account's kept queues changed by a start, a restore or a delete, so a device
            showing them fetches the list again (`listKeptQueues`). Not sent for an expiry, nor
            for a start of a queue the account already has.
          properties:
            type: { const: queuesChanged }
        - type: object
          required: [type, queueId, version, editId, edit]
          description: |
            An edit the server applied to the account's active queue, as applied: an `add`'s
            source carries the server's `list` and `length`, and never tracks, so the sender
            attaches its own tracks under that hash and others download the list by it. `version`
            is the queue's version once it was applied, one more than the last edit's. A device
            that finds a gap, or a `queueId` it does not hold, fetches the queue again. Sent to the
            sender too, with its own `editId`.
          properties:
            type: { const: queueEdit }
            queueId: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            editId: { type: string, format: uuid }
            edit: { $ref: '#/components/schemas/QueueEdit' }
        - type: object
          required: [type, reason]
          properties:
            type: { const: sessionRevoked }
            reason:
              type: string
              enum: [credentials_changed, logged_out]
        - type: object
          required: [type, serverTime]
          properties:
            type: { const: pong }
            serverTime: { type: string, format: date-time }
