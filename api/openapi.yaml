openapi: 3.1.0
info:
  title: Jewelcase API
  version: 1.0.0-draft
  summary: The public API of a Jewelcase server, used by first-party and third-party clients alike.
  description: |
    The contract between Jewelcase servers and every client. First-party clients use
    nothing outside it (`design/general.md` §6). Requirements cited as
    `requirements/file.md` §N.

    This spec describes what the server serves, plus the playlist operations, which are
    marked **Planned**. Each feature adds its operations here when it is built; git history
    keeps the earlier design.

    ## Conventions

    **Planned.** An operation whose description starts with **Planned:** is not served yet:
    the server answers `404` or `405` to it, and for most of them the web client's
    development mock answers in its place. A parameter, value, or property marked planned is
    not built yet either: the server answers `422` to a planned parameter or value in a
    request, and never sends a planned property or value.

    **Base path.** Paths are relative to `{basePath}/api/v1`. A server may sit under any
    prefix behind a reverse proxy; clients never assume the domain root.

    **Authentication.** Login registers a device and returns an opaque token. Send it as
    `Authorization: Bearer <token>`. The web client may instead rely on the
    `jewelcase_session` cookie set at setup or login; a cookie-authenticated request that
    changes state must carry an `X-Jewelcase-Client` header or it is refused with `403`. A
    login or setup that carries that header is signed in by the cookie alone and gets no
    token in its body. Any authenticated endpoint may answer `401` — see `Problem.reason` for
    whether a device keeps its downloads (`requirements/offline.md` §9).

    **Scope.** Paths under `/libraries/{libraryId}` are scoped to that library. Anything
    the caller cannot reach answers `404`, exactly as if it did not exist; every operation
    under `/admin` answers `403` to an account that is not an admin or the owner, whatever
    its path names (`requirements/users.md` §10). Identifiers in a request select within the
    caller's scope and never widen it.

    **Personal data.** `/me` is the caller's own account. Content schemas keep the caller's
    own listening in a `personal` object, which is planned.

    **Optimistic writes.** Writes clients apply locally before confirmation — player
    commands and plays — carry a client-generated ID in the body (`commandId`, `playId`).
    The server applies each ID once however often it arrives (for player commands, see
    `CommandResult`), so a device and the server agree without a round trip. Playlists need
    neither: the server assigns a playlist's ID, and edits name its tracks by position at a
    version; creating and editing one take an `Idempotency-Key`, so a retry is not applied
    twice.

    **Pagination.** The lists that can grow without bound — tracks, albums, artists,
    playlists, and a playlist's items — are cursor-paged: pass the previous page's
    `nextCursor` as `cursor`, with the same `sort` and `order`; the last page's `nextCursor`
    is `null`. `limit` defaults to 100 and may be up to 1000 — a bound on one transfer,
    never on a collection. Each page reports the list's `total`. Every other list is one
    `items` array.

    **Absent and null.** In a response, a property whose type allows `null` is always sent,
    as `null` when it has no value; a property a response may leave out is never `null`.

    **Errors.** `application/problem+json` (RFC 9457) with a machine-readable `code`, and a
    `detail` that says what was wrong where there is more to say. Besides what each
    operation lists, any operation may answer:
    - `401` and `403` as **Authentication** and **Scope** say;
    - `404 not_found` for something its path names that does not exist or is out of the
      caller's reach, or a path parameter that is not an ID at all;
    - `422 validation_failed` for a request it cannot accept: a body or query parameter that
      is malformed or out of bounds, or a query parameter the operation does not take, a
      planned one included;
    - `405 method_not_allowed` for a method its path does not support;
    - `503 setup_required` until first-run setup is done (`completeSetup`);
    - `500 internal` for an unexpected failure, whose cause is logged on the server, never
      sent.

    **Units.** Track and collection durations are integer microseconds (`durationUs`) so
    totals never drift; positions and listen time are integer milliseconds. Timestamps
    are RFC 3339 UTC. Release dates are partial dates at tag precision: `YYYY`,
    `YYYY-MM`, or `YYYY-MM-DD`.

    **Unknown values.** An untagged album or artist is a real entity whose `title` or
    `name` is `null`; clients render it as unknown (`requirements/scanning.md` §2).

    **Draft shapes.** `x-status: draft` marks what is served but may still change shape:
    audio delivery, which waits on its design (`design/general.md` §11); the waveform, whose
    bin count is still open (`design/scanning.md`); the player's fields that name a track
    until the player plays from the queue; and the queue until its edits are served.

    **Realtime.** `GET /realtime` upgrades to a WebSocket carrying
    `RealtimeClientMessage` and `RealtimeServerMessage`.
servers:
  - url: '{basePath}/api/v1'
    variables:
      basePath:
        default: ''
        description: Prefix the server is mounted under, if any.
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Server
    description: Health and server information, unauthenticated.
  - name: Auth
    description: Setup, login, invites, and password resets.
  - name: Account
    description: The caller's profile and settings.
  - name: Devices
    description: Logged-in devices and their settings (`requirements/users.md` §4, §6.1).
  - name: Libraries
    description: The libraries the caller can access.
  - name: Browse
    description: Tracks, albums, artists, and tags (`requirements/conventions.md` §4).
  - name: Media
    description: Artwork, lyrics, waveforms, and audio delivery.
  - name: Search
    description: Library search and recent searches (`requirements/search.md`).
  - name: Playlists
    description: Saved playlists (`requirements/playlists.md`).
  - name: Player
    description: Playback state, remote control, and Shift (`requirements/realtime.md`).
  - name: Queue
    description: The account's queue (`requirements/queue.md`, `design/queue.md`).
  - name: Listening
    description: Plays, history, statistics, and summaries (`requirements/analytics.md`).
  - name: Realtime
    description: The WebSocket connection for live updates and Shift (`requirements/realtime.md`).
  - name: Admin
    description: Server administration. Admin or owner role required unless stated.

paths:
  # ───────────────────────────── Server ─────────────────────────────
  /health:
    get:
      tags: [Server]
      summary: Health check
      description: Reports whether the server can actually serve, for container orchestration (`requirements/deployment.md` §7).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Able to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Running but unable to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /server:
    get:
      tags: [Server]
      summary: Server information
      description: Unauthenticated. Tells a client whether first-run setup is still required.
      operationId: getServerInfo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  # ───────────────────────────── Auth ─────────────────────────────
  /setup:
    post:
      tags: [Auth]
      summary: Create the owner account
      description: |
        First-run setup (`requirements/users.md` §2.1). Until it completes, every other
        endpoint except `/health` and `/server` answers `503 setup_required`. Once an owner
        exists this endpoint answers `404`.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Owner created and logged in on this device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422':
          description: '`weak_password` — the password is too easy to guess; `detail` says why.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and register a device
      description: |
        Failure is identical for an unknown account, a wrong password, and a suspended
        account (`requirements/users.md` §3). Repeated failures are delayed, then
        temporarily locked, per account and per origin (`requirements/users.md` §3.1).
        A device logged out with `credentials_changed` passes its `deviceId` to log back in
        as itself.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in. Also sets the session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: '`invalid_credentials`, whatever the cause.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `validation_failed` — `username` is not a valid `Username`, or `device` is malformed,
            so no account was looked up.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out this device
      description: Removes the device. Its downloads are removed (`requirements/offline.md` §9).
      operationId: logout
      responses:
        '204': { description: Logged out. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Account ─────────────────────────────
  /me:
    get:
      tags: [Account]
      summary: Get the caller's account
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins:
    get:
      tags: [Account]
      summary: List the plugins the caller can connect
      description: |
        Plugins that act for each person, such as a scrobbler, connected with the person's own
        account on its service (`requirements/plugins.md` §4.1, §6): every installed plugin
        with personal settings that is enabled in a library the caller reaches.
      operationId: listMyPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalPlugin' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Account]
      summary: Get the caller's settings for a plugin
      description: |
        Per-user settings and credentials for personal sources (`requirements/plugins.md` §6),
        as the plugin's `personalSettings` declare them. They are the person's, the same in
        every library. Secrets are never returned. Any plugin not in `listMyPlugins` answers
        `404`.
      operationId: getMyPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Account]
      summary: Connect a plugin, or change what it is connected with
      description: |
        Every required setting must have a value. Validated by the plugin when entered, run with
        these and the server-wide settings. The plugin receives the caller's listening from then
        on, never what came before.
      operationId: setMyPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '422': { $ref: '#/components/responses/PluginSettingsInvalid' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Account]
      summary: Disconnect a plugin
      description: |
        Forgets the caller's settings for it; it stops acting for them. Sharing their searches
        with it stops too, as `setMySearchSharing` turning it off does.
      operationId: disconnectMyPlugin
      responses:
        '204': { description: 'Disconnected, or never connected.' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins/{pluginId}/search-sharing:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    put:
      tags: [Account]
      summary: Turn sharing the caller's searches with a plugin on or off
      description: |
        Off until the caller turns it on (`requirements/search.md` §6). On, the plugin is sent
        each search the caller settles on from then, never one before. Off, or disconnecting,
        asks it to forget every search it was sent; what it already sent on is not recalled
        (`requirements/users.md` §7). Turning it on needs the caller to have connected the
        plugin, and the plugin to ask for searches (`asksForSearches`).
      operationId: setMySearchSharing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchSharing' }
      responses:
        '204': { description: Set. }
        '422':
          description: '`validation_failed` — turned on before the caller connected the plugin, or for one that does not ask for searches.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Devices ─────────────────────────────
  /me/devices:
    get:
      tags: [Devices]
      summary: List the caller's devices
      description: The same list used for Shift targets (`requirements/realtime.md` §1).
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Libraries ─────────────────────────────
  /libraries:
    get:
      tags: [Libraries]
      summary: List libraries the caller can access
      description: Empty for an account with no access; clients explain why rather than erroring (`requirements/users.md` §5).
      operationId: listLibraries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Libraries]
      summary: Get a library
      operationId: getLibrary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Browse ─────────────────────────────
  /libraries/{libraryId}/tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse tracks
      description: |
        Any filtered list of the library's tracks. Filters compose (`requirements/tags.md` §7).
        An album's track listing is `albumId` with `sort=album`: disc then track order, missing
        tracks in position (`requirements/albums.md` §4). Whether a track is owned or featured
        for an artist follows from its `album.artists`. A playlist is an ordered item list, not
        a track filter, and has its own item endpoint (`listPlaylistItems`).

        `ids` looks up specific tracks, as a client does to fill the rows it shows. The answer is
        one page in the order the IDs were given, with no `nextCursor`, and `total` is the number
        returned. An ID that is unknown, in another library, or not an ID is left out, so the
        answer never says which; a repeated ID comes back each time. `ids` takes the place of
        every other parameter: sending any of them with it is `422`, as is naming more than 100
        IDs.
      operationId: listTracks
      parameters:
        - name: ids
          in: query
          description: Track IDs, at most 100.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { type: string }
        - name: sort
          in: query
          description: |
            `album` orders by album, then disc, then track number. `top` is the caller's own
            ranking — listening weighted by completion, not play count alone — falling back to a
            sensible order for tracks never played, so it is never empty
            (`requirements/artists.md` §3.3, `requirements/analytics.md` §4). An artist's top
            tracks are `artistId` with `sort=top`. `playCount`, `lastPlayed`, and `top` are
            planned.
          schema:
            type: string
            enum: [name, artist, album, dateAdded, playCount, lastPlayed, releaseDate, duration, top]
            default: name
        - $ref: '#/components/parameters/Order'
        - name: albumId
          in: query
          description: Only tracks on this album.
          schema: { type: string }
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Browse]
      summary: Get a track
      operationId: getTrack
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse albums
      description: |
        Any filtered list of the library's albums, by name unless `sort` and `order` say
        otherwise. For an artist's discography a client asks for `artistId` with
        `artistCredit=owned`, `sort=releaseDate`, and `order=desc`, and groups the albums by
        their `type`, leaving out empty groups (`requirements/artists.md` §3.1). Their
        appearances are `artistCredit=featured`; the tracks on each come from `listTracks` with
        `artistId`, `artistCredit=featured`, and `sort=album` (`requirements/artists.md` §3.2).
      operationId: listAlbums
      parameters:
        - name: sort
          in: query
          description: '`playCount` and `lastPlayed` are planned.'
          schema:
            type: string
            enum: [name, artist, dateAdded, playCount, lastPlayed, releaseDate, duration]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - name: type
          in: query
          description: Filter by album type (`requirements/albums.md` §6). Planned.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AlbumType' }
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums/{albumId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [Browse]
      summary: Get an album
      description: |
        The album with a summary of each disc present. Its tracks are listed with `listTracks`
        using `albumId` and `sort=album`, since an album's size is unbounded — the unknown album
        holds every file with no album tag.
      operationId: getAlbum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Album' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse artists
      description: Includes artists credited only as features (`requirements/artists.md` §5).
      operationId: listArtists
      parameters:
        - name: sort
          in: query
          description: '`playCount` and `lastPlayed` are planned.'
          schema:
            type: string
            enum: [name, dateAdded, playCount, lastPlayed]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistPage' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists/{artistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/ArtistId'
    get:
      tags: [Browse]
      summary: Get an artist
      operationId: getArtist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Media ─────────────────────────────
  /libraries/{libraryId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: imageId
        in: path
        required: true
        schema: { type: string }
        description: Content-addressed; replacing an image on disk yields a new ID.
    get:
      tags: [Media]
      summary: Get an image
      description: |
        Album and artist images as JPEG, resized to the requested size
        (`requirements/conventions.md` §5). Immutable and cacheable indefinitely, because its ID
        changes whenever the image does.
      operationId: getImage
      parameters:
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '206': { $ref: '#/components/responses/Image' }
        '304': { description: Not modified (`If-None-Match` or `If-Modified-Since`). }
        '412': { description: Precondition failed (`If-Match` or `If-Unmodified-Since`). }
        '416': { description: Range not satisfiable. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/lyrics:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get lyrics
      description: A track without lyrics answers `200` with `kind` `none` (`requirements/tracks.md` §5).
      operationId: getLyrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lyrics' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/waveform:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get a waveform
      description: |
        Fetched on demand for the track playing and with downloads, never synced wholesale
        (`requirements/playback.md` §3).
      operationId: getWaveform
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Waveform' }
        '204':
          description: |
            Not yet analyzed. Clients show a plain progress bar, and fetch again once the track's
            `loudness` becomes non-null.
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/playback:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Negotiate audio delivery
      description: |
        Chooses direct or transcoded delivery from the requested quality and what the client
        can decode: the original whenever the client can play it at or below `quality`
        (`requirements/playback.md` §1). The client picks `quality` from its own settings for
        the connection it is on, or for downloads. Describes exactly what the listener will hear.
        A track marked missing answers `404`.
      operationId: getPlaybackInfo
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Codecs'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackInfo' }
        '422':
          description: |
            `validation_failed` — the original cannot be played as asked: a `quality` other than
            `original`, or `codecs` that leave out its codec or container, needs a transcode, and
            transcoding is not built yet.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/audio:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Stream or download audio
      description: |
        Serves a variant chosen by `getPlaybackInfo`, with byte ranges for seeking and
        resumable downloads. A track marked missing answers `404`.
      operationId: getAudio
      x-status: draft
      parameters:
        - name: variant
          in: query
          required: true
          description: As `getPlaybackInfo` gave it; any other answers `404`.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Audio' }
        '206': { $ref: '#/components/responses/Audio' }
        '304': { description: Not modified (`If-None-Match` or `If-Modified-Since`). }
        '412': { description: Precondition failed (`If-Match` or `If-Unmodified-Since`). }
        '416': { description: Range not satisfiable. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Search ─────────────────────────────
  /libraries/{libraryId}/search:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: Search a library
      description: |
        Names, with typo tolerance, diacritic and case folding, word-order independence, and
        exact-match precedence (`requirements/search.md` §3). Results are identical to on-device
        search over the same corpus (`requirements/search.md` §2.1). Playlists are not searched
        until they are built, so no playlists section comes back.
      operationId: search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/SearchTypes'
        - $ref: '#/components/parameters/Within'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/LastPlayedBefore'
        - $ref: '#/components/parameters/LastPlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - name: sectionLimit
          in: query
          description: Results shown per section before expanding.
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: List recent searches
      description: |
        The caller's own, newest first. Kept only for a recent window, the 20 newest and none
        older than 30 days, after which they are deleted; there is no permanent search history
        (`requirements/search.md` §6).
      operationId: listRecentSearches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecentSearch' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Search]
      summary: Record a recent search
      description: |
        Recorded once a search settles: the user acts on a result, submits it, or leaves it after
        it has stood a moment, never on every keystroke (`requirements/search.md` §6). The same
        words searched again, ignoring case and accents, replace the earlier entry under a new
        ID. `422` for a query with nothing to search for or over 500 bytes, or a `selected`
        that is not a track, album, or artist in this library.
      operationId: recordRecentSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecentSearchCreate' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentSearch' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Search]
      summary: Clear recent searches
      operationId: clearRecentSearches
      responses:
        '204': { description: Cleared. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches/{recentSearchId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: recentSearchId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Search]
      summary: Remove a recent search
      operationId: deleteRecentSearch
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Playlists ─────────────────────────────
  /libraries/{libraryId}/playlists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Playlists]
      summary: List the caller's playlists
      description: Pinned playlists first (`requirements/playlists.md` §7).
      operationId: listPlaylists
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created, modified, playCount]
            default: modified
        - $ref: '#/components/parameters/Order'
        - name: q
          in: query
          description: Filter by name.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Playlists]
      summary: Create a playlist
      description: |
        **Planned:** the server does not serve this yet; the web client's mock does.

        At version 1, optionally with initial items, or by saving a generated mix
        (`requirements/playlists.md` §8). A playlist created offline exists only on its device,
        which folds any edits into it and creates it here, final contents and all, once online.
        Send an `Idempotency-Key`, so a retry does not create a second playlist.
      operationId: createPlaylist
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: Get a playlist
      description: "**Planned:** the server does not serve this yet; the web client's mock does."
      operationId: getPlaylist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Playlists]
      summary: Edit a playlist
      description: |
        **Planned:** the server does not serve this yet; the web client's mock does.

        Changes details and contents — adds, removes, and moves, including non-contiguous
        selections — as one atomic edit against `baseVersion`; otherwise `409 version_conflict`
        (`requirements/playlists.md` §4–§5). A device chains its queued edits, each against the
        version the previous one produced. Undo is a further edit that reverses the last. Send
        an `Idempotency-Key`, so a retried edit is not refused because its first attempt applied.
      operationId: editPlaylist
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistEdit' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Delete a playlist
      description: "**Planned:** the server does not serve this yet; the web client's mock does."
      operationId: deletePlaylist
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: List playlist items
      description: |
        **Planned:** the server does not serve this yet; the web client's mock does.

        In the user's order, where an item's index is its position for `editPlaylist`. Missing
        tracks stay in position (`requirements/playlists.md` §3). Every page comes from one version.
      operationId: listPlaylistItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '410':
          description: '`cursor_expired` — the playlist changed since the first page; start again.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/duplicates:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    post:
      tags: [Playlists]
      summary: Check for duplicates before adding
      description: |
        **Planned:** the server does not serve this yet; the web client's mock does.

        Reports which of the given items are already present, so the user can back out (`requirements/playlists.md` §3).
      operationId: checkPlaylistDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Playable' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trackIds]
                properties:
                  trackIds:
                    type: array
                    description: Tracks from the request already in the playlist.
                    items: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/image:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [Playlists]
      summary: Set a custom image
      description: |
        **Planned:** the server does not serve this yet.

        Stored in Jewelcase's data, never the library (`requirements/playlists.md` §6).
      operationId: setPlaylistImage
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Revert to the generated image
      description: "**Planned:** the server does not serve this yet."
      operationId: deletePlaylistImage
      responses:
        '204': { description: Reverted. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Player ─────────────────────────────
  /me/player:
    get:
      tags: [Player]
      summary: Get playback state
      description: The account's playback state — which device is playing, what, and where (`requirements/playback.md` §6).
      operationId: getPlayer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerState' }
        default: { $ref: '#/components/responses/Problem' }

  /me/player/commands:
    post:
      tags: [Player]
      summary: Control playback on any device
      description: |
        Sends a `PlayerCommand`, for clients without a realtime connection; clients with one
        send `playerCommand` there instead. Answers once the target has carried the command out
        or failed to: `applied` or `failed`, or `pending` to an earlier request for a command
        sent again (see `CommandResult`).
      operationId: sendPlayerCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCommand' }
      responses:
        '200':
          description: How the target carried it out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '429':
          description: '`rate_limited` — too many of the account''s commands are waiting for the target.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`device_unavailable` — the target device is not connected (`setVolume`, `transfer`); for `transfer`, also when nothing has played; for any other command, nothing is playing or the device named is not the one playing.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Queue ─────────────────────────────
  /me/queue:
    get:
      tags: [Queue]
      summary: Get the queue
      description: |
        The account's whole queue, for a device to load into the shared core
        (`requirements/queue.md` §7). `404` until a queue has been started. The `ETag` is
        `"<run>.<queueId>.<version>"`, where `<run>` is new each time the server starts, so no tag
        from before a restart matches; a device names the version it holds with the `<run>` of
        the last tag it was given. A request whose `If-None-Match` names the current tag is
        answered `304` with no body, so a device that reconnects downloads only what it lacks.
        Any other value, or none, gets the whole snapshot.
      operationId: getQueue
      x-status: draft
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: The `ETag` of the snapshot the device already holds.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: '`"<run>.<queueId>.<version>"`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSnapshot' }
        '304':
          description: The device's queue and version are current.
          headers:
            ETag:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Queue]
      summary: Start a queue
      description: |
        Replaces the account's queue with one that plays `source` from `start`, and carries the
        Manual Queue over (`requirements/queue.md` §6). The device chooses the `queueId` and the
        source's `key` so it can apply the start at once; sending a start again for the queue
        the account already has changes nothing. A track that is missing is allowed and is
        skipped in place (`requirements/conventions.md` §6). Answers `422` unless every track
        is in `libraryId` and the caller reaches the library, whether or not one that is
        refused exists (`requirements/users.md` §10), or when `start` is past the end, or
        `context` is not an object with a string `type` of at most 4 KiB. A request is limited
        to what a 2 MiB body holds, about 90,000 tracks.
      operationId: startQueue
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartQueue' }
      responses:
        '204': { description: Started. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Listening ─────────────────────────────
  /me/plays:
    post:
      tags: [Listening]
      summary: Record plays
      description: |
        Upserts by `playId`. A device reports a play when it starts and again as listen
        time accumulates and when it ends; offline plays arrive later with their original
        times. Never counted twice (`requirements/analytics.md` §1, §6). At most 500 reports
        a request; a device with more sends them in turn.
      operationId: recordPlays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/PlayReport' }
      responses:
        '204': { description: Recorded. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Realtime ─────────────────────────────
  /realtime:
    get:
      tags: [Realtime]
      summary: Open the realtime connection
      description: |
        Upgrades to a WebSocket, authenticated like any other request. A request from a web page,
        one with an `Origin`, is refused `403` unless that origin's host and port are the ones
        the request was sent to, as `Host` or a trusted proxy's `X-Forwarded-Host` gives them
        (`requirements/deployment.md` §6). Messages are JSON objects matching
        `RealtimeClientMessage` and `RealtimeServerMessage`, each at most 64 KiB; a message
        whose `type` the server does not know is ignored. The server pings every 15 seconds and
        closes a connection it has heard nothing from, pongs included, for 40 seconds. A
        reconnecting client receives current playback state (`requirements/realtime.md` §6).
      operationId: openRealtime
      x-messages:
        client: { $ref: '#/components/schemas/RealtimeClientMessage' }
        server: { $ref: '#/components/schemas/RealtimeServerMessage' }
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
      responses:
        '101': { description: Switching to WebSocket. }
        '403':
          description: '`forbidden` — the request comes from a page whose origin is not this server.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: plugins ─────────────────────────────
  /admin/plugins:
    get:
      tags: [Admin]
      summary: List installed plugins
      operationId: adminListPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Install a plugin
      description: |
        From an uploaded file or a URL; no restart (`requirements/plugins.md` §5). Installed
        disabled for every library. Settings from a previous install are restored, and grants
        only for requests made again unchanged.
      operationId: adminInstallPlugin
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: One WebAssembly component carrying its manifest (`design/plugins.md` §6), up to 50 MB.
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '201':
          description: Installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '409':
          description: '`plugin_exists` — a plugin with its `id` is installed; uninstall it first.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`plugin_invalid` — not a plugin that can run here; `detail` says why.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Admin]
      summary: Get a plugin
      operationId: adminGetPlugin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: Uninstall a plugin
      description: |
        Files it wrote stay; content it sourced disappears. Its settings, and grants for requests
        a reinstall makes again unchanged, are kept; users' connections to it are not, so they
        connect again.
      operationId: adminUninstallPlugin
      responses:
        '204': { description: Uninstalled. }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - $ref: '#/components/parameters/LibraryId'
    put:
      tags: [Admin]
      summary: Enable or disable a plugin for a library
      description: |
        Disabling is immediate and complete. Re-enabling clears an automatic disable. A plugin
        cannot be enabled in a library until its required permissions are granted there
        (`requirements/plugins.md` §4.2).
      operationId: adminSetPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '409':
          description: '`permissions_required` — `detail` names what it still needs.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/permissions:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    put:
      tags: [Admin]
      summary: Set what a plugin is granted
      description: |
        Replaces the plugin-wide grants and, for each library listed, that library's grants
        (`requirements/plugins.md` §4.2). A permission the plugin never asked for, or in the
        wrong scope, is ignored. A library that loses a required permission is disabled at
        once, with `disabledReason` saying why.
      operationId: adminSetPluginPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionGrants' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/exemptions/{host}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: host
        in: path
        required: true
        description: One host name, such as `musicbrainz.org`. Kept lowercase. Anything else, such as `*` or a pattern, answers `422`.
        schema: { type: string }
    put:
      tags: [Admin]
      summary: Exempt a plugin from a limit for every plugin
      description: |
        Exempts this plugin's requests from the rate limit for every plugin (`hostLimits`) on
        one host, such as for a plugin whose users each bring credentials with a budget of
        their own (`requirements/plugins.md` §7). The host need not have a limit in force now.
        Exempting it again changes nothing. Its runs keep to the change from their next start.
      operationId: adminExemptPlugin
      responses:
        '204': { description: Exempt. }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: End a plugin's exemption from a limit for every plugin
      description: |
        Its requests to the host keep to the limit again from its runs' next start. Ending an
        exemption it does not have changes nothing.
      operationId: adminUnexemptPlugin
      responses:
        '204': { description: Not exempt. }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/run:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      tags: [Admin]
      summary: Run a plugin now
      description: |
        Runs the plugin once in each library it is enabled in, with exactly what is granted
        there, and answers when it is done: up to five minutes. Folders it saved files into are
        scanned, as the scanner is the only way into the library (`requirements/general.md`
        §3.2).
      operationId: adminRunPlugin
      responses:
        '200':
          description: The run finished, whether or not the plugin succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRunResult' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: libraryId
        in: query
        description: Settings for one library. Omit for the plugin's server-wide defaults.
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Get plugin settings
      description: Secrets are never returned (`requirements/plugins.md` §6).
      operationId: adminGetPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Admin]
      summary: Set plugin settings
      description: Validated by the plugin when entered; invalid values answer `422 plugin_settings_invalid`.
      operationId: adminSetPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '422': { $ref: '#/components/responses/PluginSettingsInvalid' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque per-device token from login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: jewelcase_session
      description: |
        Set at setup or login for browser clients, and sent again from time to time as the
        session is used, so one in use never expires; a response that sends it again is
        `Cache-Control: private`. State-changing requests must also send `X-Jewelcase-Client`.

  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: string }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string }
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    ArtistFilter:
      name: artistId
      in: query
      description: Only items this artist is credited on. See `artistCredit`.
      schema: { type: string }
    ArtistCredit:
      name: artistCredit
      in: query
      description: |
        With `artistId`: `owned` — the artist is among the album's artists; `featured` — credited
        on a track but not an album artist; `any` — either (`requirements/artists.md` §2).
      schema:
        type: string
        enum: [any, owned, featured]
        default: any
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Genre:
      name: genre
      in: query
      description: Tag IDs of type `genre`. Planned.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    GenreMatch:
      name: genreMatch
      in: query
      description: Whether items must carry all or any of the given genres. Planned.
      schema:
        type: string
        enum: [all, any]
        default: any
    YearFrom:
      name: yearFrom
      in: query
      description: Planned.
      schema: { type: integer }
    YearTo:
      name: yearTo
      in: query
      description: Planned.
      schema: { type: integer }
    Availability:
      name: availability
      in: query
      description: Server availability (`requirements/conventions.md` §6). Playability on a device is the client's to filter. Planned.
      schema: { $ref: '#/components/schemas/Availability' }
    Played:
      name: played
      in: query
      description: Filter by whether the caller has ever played the item. Planned.
      schema:
        type: string
        enum: [never, ever]
    LastPlayedBefore:
      name: lastPlayedBefore
      in: query
      description: Last played before this time — "not played since". Planned.
      schema: { type: string, format: date-time }
    LastPlayedAfter:
      name: lastPlayedAfter
      in: query
      description: Planned.
      schema: { type: string, format: date-time }
    MinPlayCount:
      name: minPlayCount
      in: query
      description: Planned.
      schema: { type: integer, minimum: 0 }
    Query:
      name: q
      in: query
      required: true
      description: Search text, from the first character typed.
      schema: { type: string, minLength: 1 }
    SearchTypes:
      name: types
      in: query
      description: Sections to include. Defaults to all but `lyrics`, which is planned.
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/SearchSectionType' }
    Within:
      name: within
      in: query
      description: 'Narrow to a container, as `artist:ID`, `album:ID`, or `playlist:ID` (`requirements/search.md` §5). Planned.'
      schema: { type: string, pattern: '^(artist|album|playlist):.+$' }
    ImageSize:
      name: size
      in: query
      description: Longest edge in pixels. The server rounds up to one of a fixed set of sizes, and never enlarges an image.
      schema: { type: integer, minimum: 16, maximum: 4096, default: 512 }
    Purpose:
      name: purpose
      in: query
      description: '`download` asks for a complete file of known size; `stream` may use segmented transport.'
      schema:
        type: string
        enum: [stream, download]
        default: stream
    Quality:
      name: quality
      in: query
      required: true
      description: The quality the client wants, chosen from its own settings (`requirements/users.md` §6.1).
      schema: { $ref: '#/components/schemas/Quality' }
    Codecs:
      name: codecs
      in: query
      description: |
        Codecs and containers the client can play, most preferred first, in ffmpeg's names such
        as `flac`, `aac`, and `mp4`. The original plays directly only when both its codec and its
        container are listed, since a codec such as `pcm` plays in some containers and not
        others. Omitted, the client can play anything.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated. A repeated key returns the original result without applying twice.
      schema: { type: string, maxLength: 128 }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PluginSettingsInvalid:
      description: '`plugin_settings_invalid` — a value does not fit the plugin''s settings, a required one is missing, or the plugin refused them; `detail` says why.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: '`version_conflict` — changed elsewhere since `baseVersion`. Nothing was applied.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`rate_limited` — try again after `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMedia:
      description: '`unsupported_media` — not an accepted image type.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Image:
      description: The image as JPEG, whole or a range.
      headers:
        Cache-Control:
          schema: { type: string, const: 'private, max-age=31536000, immutable' }
      content:
        image/jpeg:
          schema: { type: string, format: binary }
    Audio:
      description: Audio bytes, whole or a range.
      headers:
        Cache-Control:
          schema: { type: string, const: private }
        Accept-Ranges:
          schema: { type: string, const: bytes }
        Content-Range:
          schema: { type: string }
      content:
        audio/*:
          schema: { type: string, format: binary }

  schemas:
    # ───────────────────────────── Common ─────────────────────────────
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable, safe to show. Never contains credentials or plugin internals.
        code:
          type: string
          description: '`version_conflict`, `cursor_expired`, and `unsupported_media` come only from planned operations.'
          enum:
            - unauthenticated
            - session_revoked
            - invalid_credentials
            - rate_limited
            - forbidden
            - not_found
            - method_not_allowed
            - validation_failed
            - weak_password
            - plugin_invalid
            - plugin_exists
            - permissions_required
            - version_conflict
            - cursor_expired
            - setup_required
            - unsupported_media
            - device_unavailable
            - plugin_settings_invalid
            - internal
        reason:
          type: string
          enum: [credentials_changed, logged_out]
          description: |
            With `session_revoked`. `credentials_changed` — the device keeps its downloads and
            logs in again with its `deviceId`; `logged_out` — the device removes them
            (`requirements/offline.md` §9).
        currentVersion:
          type: integer
          description: With `version_conflict`.

    PageInfo:
      type: object
      required: [nextCursor, total]
      properties:
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    Id:
      type: string
      description: Opaque, stable identifier.

    Source:
      type: string
      description: |
        The external source content comes from, absent for library content. External content is
        always shown labelled with its source (`requirements/plugins.md` §10.1). IDs inside it,
        such as its artists' and album's, are the same source's.

    CommandId:
      type: string
      format: uuid
      description: Client-generated. Identifies the command, so it is carried out once.

    PartialDate:
      type: string
      pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
      description: A date at tag precision.

    DurationUs:
      type: integer
      format: int64
      minimum: 0
      description: Microseconds.

    Availability:
      type: string
      enum: [available, missing]
      description: External content its source cannot provide now is `missing`, and behaves exactly like a missing track (`requirements/plugins.md` §10.2).

    EntityType:
      type: string
      enum: [track, album, artist, playlist, tag, mix, library]

    EntityRef:
      type: object
      required: [type, id]
      properties:
        type: { $ref: '#/components/schemas/EntityType' }
        id: { $ref: '#/components/schemas/Id' }

    Playable:
      description: Something that can be queued or added to a playlist — library content or an external track.
      oneOf:
        - $ref: '#/components/schemas/EntityRef'
        - $ref: '#/components/schemas/ExternalTrackRef'

    ExternalTrackRef:
      type: object
      required: [type, sourceId, externalId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        externalId: { type: string }

    ImageRef:
      type: object
      required: [id, placeholder]
      properties:
        id:
          type: string
          description: Fetch from `getImage`. Changes whenever the image does.
        placeholder:
          type: [string, 'null']
          description: |
            The image's ThumbHash in base64, a few bytes that decode to a recognizable
            correctly-coloured stand-in (`requirements/offline.md` §1.1). `null` until the server
            has made one, and for an image it could not decode.

    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: [string, 'null']
          description: '`null` for the unknown artist.'

    Personal:
      type: object
      description: |
        The caller's own listening on an entity (`requirements/conventions.md` §1), never shared
        between accounts. Planned.
      required: [playCount, lastPlayedAt]
      properties:
        playCount: { type: integer }
        lastPlayedAt: { type: [string, 'null'], format: date-time }

    Reason:
      type: object
      description: Why a recommendation or automatic track is there (`requirements/recommendations.md` §8).
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [becauseYouListened, similarTo, notHeardSince, neverPlayed, anniversary, collaborator, radioSeed, endlessPlay, timeOfDay, decade, mood]
        text:
          type: string
          maxLength: 500
          description: Localized to the account's language, ready to show.
        refs:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        since: { type: string, format: date-time }

    # ───────────────────────────── Server & auth ─────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    ServerInfo:
      type: object
      required: [version, apiVersion, setupRequired]
      properties:
        version: { type: string }
        apiVersion: { type: string }
        setupRequired: { type: boolean }

    DeviceType:
      type: string
      enum: [phone, tablet, desktop, tv]

    DeviceRegistration:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: A recognizable default, such as "Firefox on Linux", which the user can change. Not blank.
        type: { $ref: '#/components/schemas/DeviceType' }
        platform:
          type: string
          minLength: 1
          maxLength: 100
          description: For example `web`, `android`. Not blank.

    Username:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,32}$'
      description: ASCII letters, digits, `_` and `-`. Unique regardless of case; shown as chosen.

    SetupRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, format: password }
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Not blank. Defaults to the username.
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string, format: password }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
        deviceId: { $ref: '#/components/schemas/ReclaimedDeviceId' }

    ReclaimedDeviceId:
      type: string
      description: |
        The device's ID from before it was logged out with `credentials_changed`. The device
        returns under that ID, keeping its name, downloads, and history; `device` only updates
        its type and platform. Any other ID — unknown, active, logged out otherwise, or on
        another account — is ignored and a new device is registered. `Session.device.id` says
        which happened.

    Session:
      type: object
      required: [user, device]
      properties:
        token:
          type: string
          description: |
            Shown once. Long-lived; idleness never expires it (`requirements/users.md` §4).
            Absent when the request carried `X-Jewelcase-Client`: the session cookie signs
            that client in, so no script on its page ever sees the token.
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }

    # ───────────────────────────── Account ─────────────────────────────
    Role:
      type: string
      enum: [owner, admin, user]

    User:
      type: object
      required: [id, username, displayName, role, hasAvatar]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        hasAvatar:
          type: boolean
          description: Whether the account has an avatar image; clients show initials when it has none. Always `false` until avatars are built.

    # ───────────────────────────── Devices ─────────────────────────────
    Device:
      type: object
      description: What the account's active device is playing is in `PlayerState`.
      required: [id, name, type, firstSeenAt, lastSeenAt, connected]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { $ref: '#/components/schemas/DeviceType' }
        platform: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        connected:
          type: boolean
          description: Disconnected devices are shown but cannot be selected (`requirements/realtime.md` §1).
        current:
          type: boolean
          description: Whether this is the calling device. Present only in `/me` responses.

    # ───────────────────────────── Libraries ─────────────────────────────
    Library:
      type: object
      required: [id, name, trackCount, albumCount, artistCount, durationUs, scanning]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        trackCount: { type: integer }
        albumCount: { type: integer }
        artistCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        scanning:
          type: boolean
          description: Content is still appearing. The library is fully usable either way.

    # ───────────────────────────── Tracks ─────────────────────────────
    AlbumRef:
      type: object
      required: [id, title, artists, image]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: [string, 'null']
          description: '`null` for the unknown album.'
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistRef' }
        image:
          description: The album's one cover, shown for every track on it (`requirements/albums.md` §5).
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    TagRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    TrackBase:
      type: object
      required: [id, title, artists, album, discNumber, trackNumber, durationUs, releaseDate, availability]
      description: What any source can say about a track. `TrackSummary` adds what only the library knows.
      properties:
        source: { $ref: '#/components/schemas/Source' }
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          description: Falls back to the filename for untagged files.
        artists:
          type: array
          description: Ordered; the first is primary (`requirements/conventions.md` §7).
          items: { $ref: '#/components/schemas/ArtistRef' }
        album:
          description: '`null` only for an external track that is on no album.'
          oneOf:
            - $ref: '#/components/schemas/AlbumRef'
            - type: 'null'
        discNumber: { type: [integer, 'null'] }
        trackNumber: { type: [integer, 'null'] }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        releaseDate:
          oneOf:
            - $ref: '#/components/schemas/PartialDate'
            - type: 'null'
        explicit: { type: boolean }
        availability: { $ref: '#/components/schemas/Availability' }

    TrackSummary:
      allOf:
        - $ref: '#/components/schemas/TrackBase'
        - type: object
          required: [audio, explicit, sortKeys]
          properties:
            album: { $ref: '#/components/schemas/AlbumRef' }
            explicit: { type: boolean }
            genres:
              type: array
              items: { $ref: '#/components/schemas/TagRef' }
            audio:
              $ref: '#/components/schemas/AudioSummary'
              description: Enough to tell a FLAC from an MP3 at a glance (`requirements/tracks.md` §4). The full `Track` extends it.
            addedAt: { type: string, format: date-time }
            sortKeys: { $ref: '#/components/schemas/TrackSortKeys' }
            personal: { $ref: '#/components/schemas/Personal' }

    TrackSortKeys:
      type: object
      description: |
        What the server orders tracks by for `name`, `artist`, and `album` (`requirements/conventions.md`
        §4): a tagged sort value where there is one, otherwise the display name with a leading article
        stripped; either way it is then folded: lowercased, with compatibility forms and accents
        folded away (`ＡＢＢＡ` is `abba`, `Édith` is `edith`, `Øystein` is `oystein`) and runs of
        whitespace collapsed to one space. A client sorting a list it holds compares these by Unicode
        code point, never by locale, and so orders it as the server would. An empty key is no value,
        which sorts last.
      required: [title, artist, album]
      properties:
        title: { type: string }
        artist:
          type: string
          description: The primary artist's own key, the same for every track that artist leads.
        album:
          type: string
          description: The album's own key, the same for every track on it.

    AudioSummary:
      type: object
      required: [codec, lossless]
      properties:
        codec: { type: string }
        lossless: { type: boolean }

    AudioProperties:
      allOf:
        - $ref: '#/components/schemas/AudioSummary'
        - type: object
          required: [container, bitrateKbps, sampleRateHz, bitDepth, channels, fileSizeBytes]
          properties:
            container: { type: string }
            bitrateKbps: { type: [integer, 'null'] }
            sampleRateHz: { type: integer }
            bitDepth: { type: [integer, 'null'] }
            channels: { type: integer }
            fileSizeBytes: { type: integer, format: int64 }

    Track:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          required: [audio, lyrics, loudness]
          properties:
            audio: { $ref: '#/components/schemas/AudioProperties' }
            lyrics:
              type: string
              enum: [none, plain, synced]
            loudness:
              description: |
                Measured by Jewelcase, never read from tags. `null` until analyzed; the track plays
                unnormalized (`requirements/playback.md` §5). Analysis produces loudness and the
                waveform together, so this changing from `null` is also the signal that a waveform
                can now be fetched.
              oneOf:
                - $ref: '#/components/schemas/Loudness'
                - type: 'null'

    TrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TrackSummary' }

    Lyrics:
      type: object
      required: [kind, lines, plain]
      properties:
        kind:
          type: string
          enum: [none, plain, synced]
          description: Synced lyrics are the primary view where they exist (`requirements/tracks.md` §5).
        lines:
          type: [array, 'null']
          description: With `synced`.
          items:
            type: object
            required: [startMs, text]
            properties:
              startMs: { type: integer }
              text: { type: string }
        plain:
          type: [string, 'null']
          description: With `plain`.

    Waveform:
      type: object
      x-status: draft
      required: [pointCount, data]
      description: Derived from the original file (`requirements/playback.md` §3).
      properties:
        pointCount: { type: integer }
        data:
          type: string
          description: Base64 of one unsigned byte per point, already shaped for legibility.

    Loudness:
      type: object
      description: The client applies gain from these for the user's normalization mode, without clipping.
      required: [trackLufs, trackPeakDbtp, albumLufs, albumPeakDbtp]
      properties:
        trackLufs: { type: number, description: Integrated loudness. }
        trackPeakDbtp: { type: number, description: True peak. }
        albumLufs: { type: [number, 'null'] }
        albumPeakDbtp: { type: [number, 'null'] }

    Quality:
      type: string
      enum: [original, high, medium, low]
      description: '`original` never transcodes. Bitrates for the others are defined by the audio design.'

    PlaybackInfo:
      type: object
      x-status: draft
      required: [variant, delivery, codec, container, bitrateKbps, sampleRateHz, bitDepth, channels, sizeBytes, transport, loudness, gapless]
      description: Exactly what the listener will hear (`requirements/playback.md` §1).
      properties:
        variant:
          type: string
          description: Pass to the audio endpoint.
        delivery:
          type: string
          enum: [direct, transcoded]
          description: '`transcoded` is planned.'
        codec: { type: string }
        container: { type: string }
        bitrateKbps: { type: [integer, 'null'] }
        sampleRateHz: { type: integer }
        bitDepth: { type: [integer, 'null'] }
        channels: { type: integer }
        sizeBytes:
          type: [integer, 'null']
          format: int64
          description: Known for direct delivery and for downloads.
        transport:
          type: string
          enum: [progressive, segmented]
          description: Set by the audio-delivery design. `segmented` is planned.
        loudness:
          description: Measured on the original, so it applies to every variant.
          oneOf:
            - $ref: '#/components/schemas/Loudness'
            - type: 'null'
        gapless:
          type: [object, 'null']
          description: Samples to trim so consecutive tracks join exactly (`requirements/playback.md` §4). Always `null` until it is measured.
          properties:
            leadingSamples: { type: integer }
            trailingSamples: { type: integer }

    # ───────────────────────────── Albums ─────────────────────────────
    AlbumType:
      type: string
      enum: [album, ep, single, compilation]
      description: '`requirements/albums.md` §3.'

    AlbumBase:
      description: What any source can say about an album. `AlbumSummary` adds what only the library knows.
      allOf:
        - $ref: '#/components/schemas/AlbumRef'
        - type: object
          required: [releaseDate]
          properties:
            source: { $ref: '#/components/schemas/Source' }
            releaseDate:
              oneOf:
                - $ref: '#/components/schemas/PartialDate'
                - type: 'null'
            type: { $ref: '#/components/schemas/AlbumType' }

    AlbumSummary:
      description: |
        Completeness has two parts (`requirements/albums.md` §4): tracks missing from discs you
        have (`trackCount` below `trackTotal`), and discs you do not have (`discCount` below
        `discTotal`). Incomplete is information, never an error.
      allOf:
        - $ref: '#/components/schemas/AlbumBase'
        - type: object
          required: [type, trackCount, trackTotal, discCount, discTotal, durationUs, availability]
          properties:
            type: { $ref: '#/components/schemas/AlbumType' }
            genres:
              type: array
              items: { $ref: '#/components/schemas/TagRef' }
            trackCount:
              type: integer
              description: |
                Tracks from this album in the library, including any marked missing — those stay in
                position with their own `availability`, so "incomplete" means never had, not lost.
            trackTotal:
              type: [integer, 'null']
              description: |
                Sum of the tagged per-disc totals for the discs present. Track totals are tagged per
                disc, so an absent disc contributes nothing; see `discCount`. `null` when no disc
                present has a tagged total. A track with no disc number counts as disc 1, here and in
                `discCount`, while `discs` lists the two apart.
            discCount:
              type: integer
              description: Discs with at least one track in the library, a track with no disc number counting as disc 1.
            discTotal:
              type: [integer, 'null']
              description: Tagged total number of discs.
            durationUs: { $ref: '#/components/schemas/DurationUs' }
            availability: { $ref: '#/components/schemas/Availability' }
            addedAt: { type: string, format: date-time }
            personal: { $ref: '#/components/schemas/Personal' }

    Album:
      allOf:
        - $ref: '#/components/schemas/AlbumSummary'
        - type: object
          required: [labels, discs]
          properties:
            labels:
              type: array
              description: Record labels, in tagged order. Empty when untagged.
              items: { type: string }
            discs:
              type: array
              description: |
                Present discs in number order, so disc headings and completeness render before
                tracks arrive; each track's `discNumber` places it (`requirements/albums.md` §4).
              items:
                type: object
                required: [number, trackCount, trackTotal]
                properties:
                  number:
                    type: [integer, 'null']
                    description: '`null` for tracks with no disc tag, grouped as one disc.'
                  trackCount:
                    type: integer
                    description: Tracks from this disc in the library, including any marked missing.
                  trackTotal:
                    type: [integer, 'null']
                    description: Tagged track total for this disc; the scanner resolves tracks that disagree.

    AlbumPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AlbumSummary' }

    # ───────────────────────────── Artists ─────────────────────────────
    ArtistBase:
      description: What any source can say about an artist. `ArtistSummary` adds what only the library knows.
      allOf:
        - $ref: '#/components/schemas/ArtistRef'
        - type: object
          required: [image]
          properties:
            source: { $ref: '#/components/schemas/Source' }
            image:
              oneOf:
                - $ref: '#/components/schemas/ImageRef'
                - type: 'null'

    ArtistSummary:
      allOf:
        - $ref: '#/components/schemas/ArtistBase'
        - type: object
          required: [albumCount, trackCount]
          properties:
            albumCount:
              type: integer
              description: Albums the artist owns.
            trackCount:
              type: integer
              description: Owned and featured tracks.
            addedAt: { type: string, format: date-time }
            personal: { $ref: '#/components/schemas/Personal' }

    Artist:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          required: [biography, genres, appearanceCount]
          properties:
            biography:
              type: [string, 'null']
              description: From `artist.txt` (`requirements/scanning.md` §3.3). Usually absent.
            genres:
              type: array
              items: { $ref: '#/components/schemas/TagRef' }
            appearanceCount: { type: integer }

    ArtistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtistSummary' }

    # ───────────────────────────── Search ─────────────────────────────
    SearchSectionType:
      type: string
      enum: [tracks, albums, artists, playlists, lyrics]

    LyricMatch:
      type: object
      required: [track, line, before, after]
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        line:
          type: object
          required: [text, startMs]
          properties:
            text: { type: string }
            startMs: { type: [integer, 'null'] }
        before:
          type: array
          description: Lines of context before the match.
          items: { type: string }
        after:
          type: array
          items: { type: string }

    SearchResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [track, album, artist, playlist, lyric]
        track: { $ref: '#/components/schemas/TrackSummary' }
        album: { $ref: '#/components/schemas/AlbumSummary' }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        lyric: { $ref: '#/components/schemas/LyricMatch' }

    SearchResponse:
      type: object
      required: [query, top, sections, nearMisses, libraryEmpty]
      properties:
        query:
          type: string
          description: Echo of `q`, so a client can discard responses for text no longer in the box (`requirements/search.md` §7).
        top:
          description: The single best match, also present in its section (`requirements/search.md` §4).
          oneOf:
            - $ref: '#/components/schemas/SearchResult'
            - type: 'null'
        sections:
          type: array
          description: Ordered by how well each matches; ties break tracks, then albums, then artists. A section with no match is left out.
          items:
            type: object
            required: [type, items, total]
            properties:
              type: { $ref: '#/components/schemas/SearchSectionType' }
              items:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }
              total: { type: integer }
        nearMisses:
          type: array
          description: Suggested queries when little or nothing matched (`requirements/search.md` §8). Always empty until suggestions are built.
          items: { type: string }
        libraryEmpty:
          type: boolean
          description: Distinguishes "no music yet" from "nothing matches".

    RecentSearch:
      type: object
      required: [id, query, selected, searchedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        query: { type: string }
        selected:
          description: The result acted on, if any.
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        searchedAt: { type: string, format: date-time }

    RecentSearchCreate:
      type: object
      required: [query]
      properties:
        query: { type: string, description: 'Trimmed. At most 500 bytes.' }
        selected:
          $ref: '#/components/schemas/EntityRef'
          description: The result acted on, if any. A track, album, or artist in this library.

    # ───────────────────────────── Playlists ─────────────────────────────
    PlaylistBase:
      type: object
      required: [id, title, description, image]
      description: What any source can say about a playlist. `Playlist` adds what only the user's own playlists have.
      properties:
        source: { $ref: '#/components/schemas/Source' }
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: [string, 'null'] }
        image:
          description: For the user's own playlist, custom or a mosaic of the tracks inside; `null` when empty.
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    Playlist:
      allOf:
        - $ref: '#/components/schemas/PlaylistBase'
        - type: object
          required: [libraryId, customImage, trackCount, durationUs, pinned, createdAt, modifiedAt, version]
          properties:
            libraryId: { $ref: '#/components/schemas/Id' }
            customImage:
              type: boolean
              description: Whether `image` is a custom upload rather than the generated mosaic; `deletePlaylistImage` reverts it.
            trackCount:
              type: integer
              description: Every track in the playlist, missing ones included (`requirements/playlists.md` §3).
            durationUs:
              $ref: '#/components/schemas/DurationUs'
              description: Of every track in the playlist, missing ones included.
            pinned: { type: boolean }
            createdAt: { type: string, format: date-time }
            modifiedAt: { type: string, format: date-time }
            version:
              type: integer
              description: Advances with every change; edits apply only against the version they were made on.
            personal: { $ref: '#/components/schemas/Personal' }

    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Playlist' }

    PlaylistItem:
      type: object
      description: |
        Exactly one of `track`, from the library, or `external`, from a source, is set. Items are
        named by position, so a duplicate track is a separate item.
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        external: { $ref: '#/components/schemas/TrackBase' }
        addedAt: { type: string, format: date-time }

    PlaylistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [version, items]
          properties:
            version:
              type: integer
              description: The playlist version these positions belong to, the `baseVersion` for edits made from them.
            items:
              type: array
              items: { $ref: '#/components/schemas/PlaylistItem' }

    PlaylistCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        items:
          type: array
          description: Albums, artists, and playlists expand to their tracks in order.
          items: { $ref: '#/components/schemas/Playable' }
        fromMix:
          type: string
          description: Save a generated mix as it is now (`requirements/playlists.md` §8). `title` defaults sensibly.

    PlaylistOp:
      description: |
        Positions are zero-based indexes into the playlist as this op finds it, after the ops
        before it in the same edit. A position out of range fails the whole edit.
      oneOf:
        - type: object
          required: [op, items]
          properties:
            op: { const: add }
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Playable' }
            at:
              type: integer
              minimum: 0
              description: Position the first added track takes. Omitted appends.
        - type: object
          required: [op, positions]
          properties:
            op: { const: remove }
            positions:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: integer, minimum: 0 }
        - type: object
          required: [op, positions, at]
          properties:
            op: { const: move }
            positions:
              type: array
              minItems: 1
              uniqueItems: true
              description: Any selection, contiguous or not; relative order is preserved.
              items: { type: integer, minimum: 0 }
            at:
              type: integer
              minimum: 0
              description: Position the first moved track takes once the move is done.

    PlaylistEdit:
      type: object
      required: [baseVersion]
      minProperties: 2
      description: Every part applies, or none does.
      properties:
        baseVersion:
          type: integer
          description: The version the edit was made against.
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        pinned: { type: boolean }
        ops:
          type: array
          minItems: 1
          description: Applied in order.
          items: { $ref: '#/components/schemas/PlaylistOp' }

    # ───────────────────────────── Contexts ─────────────────────────────
    Context:
      description: |
        Anything playable as a run of tracks (`requirements/queue.md` Overview). A context
        resolves to the same ordered tracks on the server and in the shared core.
      oneOf:
        - $ref: '#/components/schemas/EntityContext'
        - $ref: '#/components/schemas/ArtistContext'
        - $ref: '#/components/schemas/SearchContext'
        - $ref: '#/components/schemas/FilterContext'
        - $ref: '#/components/schemas/RadioContext'
        - $ref: '#/components/schemas/ExternalContext'
      discriminator:
        propertyName: type
        mapping:
          track: '#/components/schemas/EntityContext'
          album: '#/components/schemas/EntityContext'
          playlist: '#/components/schemas/EntityContext'
          tag: '#/components/schemas/EntityContext'
          mix: '#/components/schemas/EntityContext'
          artist: '#/components/schemas/ArtistContext'
          search: '#/components/schemas/SearchContext'
          filter: '#/components/schemas/FilterContext'
          library: '#/components/schemas/FilterContext'
          radio: '#/components/schemas/RadioContext'
          external: '#/components/schemas/ExternalContext'

    EntityContext:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [track, album, playlist, tag, mix]
        id: { $ref: '#/components/schemas/Id' }

    ArtistContext:
      type: object
      required: [type, id]
      properties:
        type: { const: artist }
        id: { $ref: '#/components/schemas/Id' }
        scope:
          type: string
          enum: [all, discography, appearances, topTracks]
          default: all

    SearchContext:
      type: object
      required: [type, query, section]
      properties:
        type: { const: search }
        query: { type: string }
        section:
          type: string
          enum: [tracks, lyrics]
        within:
          type: string
          pattern: '^(artist|album|playlist):.+$'
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    BrowseFilter:
      type: object
      description: The browse filters, as a value (`requirements/tags.md` §7).
      properties:
        genres:
          type: array
          items: { type: string }
        genreMatch:
          type: string
          enum: [all, any]
        yearFrom: { type: integer }
        yearTo: { type: integer }
        albumTypes:
          type: array
          items: { $ref: '#/components/schemas/AlbumType' }
        availability: { $ref: '#/components/schemas/Availability' }
        played:
          type: string
          enum: [never, ever]
        lastPlayedBefore: { type: string, format: date-time }
        lastPlayedAfter: { type: string, format: date-time }
        minPlayCount: { type: integer }

    FilterContext:
      type: object
      required: [type]
      description: '`filter` is a filtered view; `library` is the whole library. Neither leaves anything behind.'
      properties:
        type:
          type: string
          enum: [filter, library]
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    RadioContext:
      type: object
      required: [type, seed]
      properties:
        type: { const: radio }
        seed:
          $ref: '#/components/schemas/EntityRef'
          description: Track, album, artist, playlist, or genre tag (`requirements/recommendations.md` §4).

    ExternalContext:
      type: object
      required: [type, sourceId, itemId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        itemId: { type: string }

    # ───────────────────────────── Player ─────────────────────────────
    PlayerState:
      type: object
      required: [status, activeDeviceId, itemId, libraryId, trackId, positionMs, positionAt, volume]
      properties:
        status:
          type: string
          enum: [playing, paused, stopped]
        activeDeviceId:
          type: [string, 'null']
          description: |
            The one device holding playback for the account, playing or paused
            (`requirements/realtime.md` §2); `null` when stopped or before anything has played.
            When the connection it plays over closes, playback stops where it got to, and any
            device can carry on from there (§6).
        itemId:
          type: [string, 'null']
          x-status: draft
          description: |
            The active device's own name for its place in its queue, as it last reported:
            opaque to everyone else. The queue item playing once the server keeps the queue.
        libraryId:
          type: [string, 'null']
          x-status: draft
          description: The library of `trackId`, until the server keeps the queue, which names it.
        trackId: { type: [string, 'null'] }
        external:
          $ref: '#/components/schemas/ExternalTrackRef'
          description: The external track playing. Planned.
        positionMs: { type: integer }
        positionAt:
          type: string
          format: date-time
          description: Server time at which `positionMs` was true. While playing, clients extrapolate from it, so position never drifts.
        volume:
          type: [number, 'null']
          description: The active device's volume, as it last reported. Changed with `setVolume`.

    PlayerCommand:
      description: |
        Transport control, targeting any of the caller's devices (`requirements/realtime.md` §3).
        Last command wins. Sent over the realtime connection as `playerCommand`, and passed on
        to the target as `execute`. `setVolume` and `transfer` go to the device they name; every
        other command goes to the connection playing. Each command's own fields are in the
        schema its `type` maps to.
      type: object
      required: [type, commandId]
      properties:
        type: { type: string }
        commandId: { $ref: '#/components/schemas/CommandId' }
        deviceId:
          type: string
          description: |
            The target device. For a command that goes to the connection playing it may be left
            out, and the command fails if it names any other device.
      oneOf:
        - $ref: '#/components/schemas/TransportCommand'
        - $ref: '#/components/schemas/SeekCommand'
        - $ref: '#/components/schemas/VolumeCommand'
        - $ref: '#/components/schemas/TransferCommand'
      discriminator:
        propertyName: type
        mapping:
          play: '#/components/schemas/TransportCommand'
          pause: '#/components/schemas/TransportCommand'
          next: '#/components/schemas/TransportCommand'
          previous: '#/components/schemas/TransportCommand'
          seek: '#/components/schemas/SeekCommand'
          setVolume: '#/components/schemas/VolumeCommand'
          transfer: '#/components/schemas/TransferCommand'

    TransportCommand:
      type: object
      description: Fails when nothing is playing; `transfer` wakes an idle device (`requirements/realtime.md` §3).
      properties:
        type:
          type: string
          enum: [play, pause, next, previous]

    SeekCommand:
      type: object
      required: [positionMs]
      properties:
        type: { const: seek }
        positionMs: { type: integer, minimum: 0 }

    VolumeCommand:
      type: object
      required: [deviceId, volume]
      description: |
        Volume belongs to the device (`requirements/realtime.md` §3), so this goes to the device
        named, playing or not: to its connection playing, or else its newest. Playback starting
        elsewhere meanwhile does not fail it. `device_unavailable` when the device is not
        connected.
      properties:
        type: { const: setVolume }
        deviceId: { type: string }
        volume: { type: number, minimum: 0, maximum: 1 }

    TransferCommand:
      type: object
      required: [deviceId]
      x-status: draft
      description: |
        Shift: moves playback to the device named, which also wakes an idle one. Its newest
        connection takes the track and position from the latest `player` state it received and
        takes playback over with a `start` report, answering once it has, not once its audio
        plays. To the device already holding playback it is `applied` at once, or plays there if
        paused and `play` is true. The device's volume stays its own. `device_unavailable` when
        the device is not connected or nothing has played.
      properties:
        type: { const: transfer }
        deviceId: { type: string }
        play:
          type: boolean
          default: true
          description: Continue playing on arrival, or arrive paused.

    CommandResult:
      type: object
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/CommandId' }
        status:
          type: string
          enum: [pending, applied, failed]
          description: |
            `pending` until the target confirms. Every failure is reported
            (`requirements/realtime.md` §5): at once when the command is invalid or nothing is
            playing, which over HTTP is a `409`, `422`, or `429` problem instead; when the
            target's connection closes; and after 5 seconds without an answer. A command
            sent again with the same `commandId` is carried out once: while it waits, its result
            goes where it was sent from last, and once finished it is answered again for any of
            the account's latest 32 commands. At most 16 of an account's commands wait at a time.
        reason: { type: string }

    ProgressReport:
      type: object
      x-status: draft
      required: [itemId, libraryId, trackId, status, positionMs]
      description: |
        Sent over the realtime connection by the playing device, or one taking playback over
        (`start`); a report is the device's whose connection sends it. A report that is refused
        — invalid, from any connection but the active one, or of a track out of the caller's
        reach — is answered with the current state; one that does not parse is ignored.
        `buffering` is recorded as `paused` at its position.

        Until the server keeps the queue, a report names its track, and `itemId` is the
        device's own name for its place in its queue, opaque to the server.
      properties:
        itemId: { type: string, minLength: 1, maxLength: 100, x-status: draft }
        libraryId: { type: string }
        trackId: { type: string }
        start:
          type: boolean
          default: false
          description: |
            Set when the user starts playback on this connection, taking over from the device
            playing (`requirements/realtime.md` §2). Without it, a report from any connection but
            the active one is refused, and a `stopped` report never takes over. A device stops
            playing only when the state names another device active; with several connections,
            such as browser tabs, it plays in one at a time.

            A new connection is never the active one: a device still playing when it connects
            waits for the state it is sent, stops if that names another device, and otherwise
            sets `start` on its next report. A playing device also sets `start` whenever a state
            it receives names no active device.
        status:
          type: string
          enum: [playing, paused, stopped, buffering]
        positionMs: { type: integer, minimum: 0 }
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: The device's current volume, so remote controls show it (`requirements/realtime.md` §3).

    # ───────────────────────────── Listening ─────────────────────────────
    QueueOrigin:
      type: string
      enum: [manual, context, automatic]
      description: '`automatic` marks radio and endless-play additions (`requirements/queue.md` §5).'

    PlayReport:
      type: object
      required: [playId, libraryId, startedAt, listenTimeMs, context, origin]
      description: |
        Every track that starts is a play; `listenTimeMs` is audio actually heard
        (`requirements/analytics.md` §1). Exactly one of `trackId` or `external` is set. A
        play of a track no longer in a library the caller reaches is left out. A play is
        recorded on the device whose token reports it. A play of an external track is accepted
        but not recorded. `context` and `reason` are kept as sent: the server checks that
        `context` is an object with a string `type` and that `reason` is an object, and that each
        serializes to at most 4 KiB.
      properties:
        playId:
          type: string
          format: uuid
          description: Client-generated on start. Later reports for the same play update it.
        libraryId: { type: string }
        trackId: { type: string }
        external: { $ref: '#/components/schemas/ExternalTrackRef' }
        startedAt:
          type: string
          format: date-time
          description: When it happened, never when it synced.
        listenTimeMs:
          type: integer
          minimum: 0
          description: Cumulative. May exceed the duration when parts were replayed.
        end:
          type: [string, 'null']
          enum: [finished, skipped, stopped, null]
          description: '`null` while still playing.'
        context: { $ref: '#/components/schemas/Context' }
        origin: { $ref: '#/components/schemas/QueueOrigin' }
        reason:
          description: With `automatic` — why radio or endless play chose it.
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'

    # ───────────────────────────── Queue ─────────────────────────────
    StartQueue:
      type: object
      required: [queueId, context, source, start]
      properties:
        queueId:
          type: string
          format: uuid
          description: Client-generated. Names the queue among the account's own.
        context:
          allOf:
            - $ref: '#/components/schemas/Context'
          description: What the queue started from, kept as sent.
        source:
          type: object
          required: [key, libraryId, tracks]
          description: |
            The tracks to play, in the order the device shows them, resolved once and never
            rewritten. A track may appear more than once; each copy is its own item.
          properties:
            key:
              type: string
              format: uuid
              description: Client-generated. Names the source's items, `<key>.<index>`.
            libraryId: { type: string }
            tracks:
              type: array
              items: { type: string }
        start:
          type: integer
          minimum: 0
          description: The index in `tracks` of the track that plays first.
        shuffle:
          type: object
          required: [seed]
          description: Start shuffled, with the order this seed gives.
          properties:
            seed: { type: integer, minimum: 0, maximum: 4294967295 }

    QueueSnapshot:
      type: object
      required: [queueId, version, context, state]
      properties:
        queueId: { type: string, format: uuid }
        version:
          type: integer
          minimum: 0
          description: Zero as the queue starts.
        context: { $ref: '#/components/schemas/Context' }
        state: { $ref: '#/components/schemas/QueueState' }

    QueueState:
      type: object
      required: [sources, manual, order, cursor, current, history, shuffle, repeat, copies]
      description: |
        The queue, in the shape the shared core serializes, which is a stable public shape: a
        client may read it without the core, and a change to it is a breaking change.

        An **item** is one track of one source. Its number is its position in the tracks of
        `sources` laid end to end, and its ID is `<key>.<index>`, with `key` its source's and
        `index` its position in that source. The same track twice is two items. Every number in
        `manual`, `order`, `current`, `history` and `unshuffled` is an item number. An item is in
        at most one of the Manual Queue, the context's Up Next, History and `current`. A track
        that no longer resolves is skipped in place.

        A queue holds at most 1,000,000 items, counting the copies a Repeat All restart makes: an
        add that would pass it is refused with `422`, and a Repeat All restart that would pass it
        ends the queue instead.
      properties:
        sources:
          type: array
          description: |
            The lists of tracks the items come from, in the order that numbers them. Sources are
            only ever added, never changed.
          items:
            type: object
            required: [key, libraryId, tracks]
            description: A list of tracks resolved once.
            properties:
              key:
                type: string
                description: |
                  Unique within the queue; names the source's items. Chosen by whoever added it.
                  A key starting with `~` is reserved for the copies the server and Repeat All
                  restarts make.
              libraryId:
                type: string
                description: The library every track of the source is in.
              tracks:
                type: array
                items: { type: string }
                description: Track IDs, in the order they were resolved. A track may repeat.
        manual:
          type: array
          items: { type: integer }
          description: The Manual Queue, in play order. It plays before the context's Up Next.
        order:
          type: array
          items: { type: integer }
          description: |
            The context, in play order. The items before `cursor` have been started or passed and
            stay here so the context can restart or unshuffle; those from `cursor` on are the
            context's Up Next.
        cursor:
          type: integer
          minimum: 0
          description: How many items of `order` have been started or passed.
        current:
          type: [integer, 'null']
          description: The item playing now, or `null` when the queue has ended.
        history:
          type: array
          items: { type: integer }
          description: The items that have played, oldest first.
        shuffle:
          type: [object, 'null']
          description: Set while the context is shuffled; `null` otherwise.
          required: [seed, unshuffled]
          properties:
            seed:
              type: integer
              minimum: 0
              maximum: 4294967295
              description: The seed the current order came from, chosen by a device.
            unshuffled:
              type: array
              items: { type: integer }
              description: The context's order before the shuffle, passed items included.
        repeat:
          type: string
          enum: [off, all, one]
          description: |
            What happens when the queue ends: `off` stops, `all` restarts the context in its
            current order, `one` replays the current item (which the playing device carries out).
            A new context keeps the mode.
        copies:
          type: integer
          minimum: 0
          description: |
            How many sources a Repeat All restart or a carried-over Manual Queue has minted, keyed
            `~0`, `~1`, ...; it names the next.

    # ───────────────────────────── Plugins ─────────────────────────────
    PluginSettings:
      type: object
      required: [schema, values, secretsSet]
      properties:
        schema:
          type: object
          description: |
            JSON Schema the plugin declares for its settings, so every plugin is configured the
            same way: an object whose `properties` are each a `string`, `number`, `integer`, or
            `boolean`, with optional `title`, `description`, `enum`, and `default`, and
            `writeOnly` for a secret. `required` names the ones it needs.
        values:
          type: object
          description: |
            The values set here, secrets omitted: the caller's own, a library's, or the
            server-wide ones. A library's override the server-wide ones, which override the
            defaults.
        secretsSet:
          type: array
          description: Names of secret fields that have a value. Their values are never returned.
          items: { type: string }

    PluginSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Omitted secret fields keep their stored value; `null` clears one.

    PersonalPlugin:
      type: object
      required: [id, name, connected, asksForSearches, sharesSearches]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        connected:
          type: boolean
          description: Whether the caller has saved settings for it, and so it acts for them.
        asksForSearches:
          type: boolean
          description: |
            Whether the caller could share their searches with it: it asks for them, and an admin
            allowed it.
        sharesSearches:
          type: boolean
          description: Whether the caller has turned on sharing their searches with it.

    SearchSharing:
      type: object
      required: [sharing]
      properties:
        sharing: { type: boolean }

    Plugin:
      type: object
      required: [id, name, version, apiVersion, source, installedAt, permissions, granted, hasSettings, libraries, hostLimits]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string, const: '0.1' }
        description: { type: string }
        author: { type: string }
        homepage: { type: string, format: uri }
        source:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [file, url]
            url: { type: string, format: uri }
        installedAt: { type: string, format: date-time }
        permissions:
          type: array
          description: What it asks for, from its manifest.
          items: { $ref: '#/components/schemas/PermissionRequest' }
        granted:
          type: array
          description: Plugin-wide permissions granted. Library permissions are per library, below.
          items: { $ref: '#/components/schemas/PermissionName' }
        hasSettings:
          type: boolean
          description: Whether it declares settings, read and set with `adminGetPluginSettings`.
        libraries:
          type: array
          description: Every library on the server.
          items:
            type: object
            required: [libraryId, enabled, autoDisabled, disabledReason, granted, missingRequired, lastRun]
            properties:
              libraryId: { type: string }
              enabled: { type: boolean }
              autoDisabled:
                type: boolean
                description: |
                  Disabled by the server: after one of its hooks had been failing for 72 hours
                  (`requirements/plugins.md` §11), or when a required permission was revoked.
              disabledReason: { type: [string, 'null'] }
              granted:
                type: array
                description: Library permissions granted here.
                items: { $ref: '#/components/schemas/PermissionName' }
              missingRequired:
                type: array
                description: Required permissions not granted here. While any remain, it cannot be enabled.
                items: { $ref: '#/components/schemas/PermissionName' }
              lastRun:
                description: Its last run here, by Run now or a hook; `null` if it has not run here.
                oneOf:
                  - type: object
                    required: [at, ok, summary]
                    properties:
                      at: { type: string, format: date-time }
                      ok: { type: boolean }
                      summary:
                        type: string
                        description: |
                          The plugin's own summary, or why the run failed, followed in brackets by
                          what the run was refused and about how much compute it spent, such as
                          `Saved 3. (refused Network access, a.example; about 42 ms of compute)`.
                          A run the server could not complete says only
                          `the server could not complete the run`; its cause is logged on the
                          server.
                  - type: 'null'
        hostLimits:
          type: array
          description: |
            The rate limits every plugin's requests keep to (`"per": "host"`), at the hosts this
            plugin can reach: those its `network` request names, or every one for `*`. A limit
            is in force while the plugin that set it is installed, granted `network` and
            `hostRateLimits`, and enabled in a library. A run reads them as it starts.
          items:
            type: object
            required: [host, limit, setBy, exempt]
            properties:
              host: { type: string }
              limit: { type: string, description: 'The strictest any plugin set, such as `1/s`.' }
              setBy:
                type: array
                description: IDs of the plugins that set it that strict.
                items: { type: string }
              exempt:
                type: boolean
                description: Whether this plugin is exempt from it (`adminExemptPlugin`).

    PermissionName:
      type: string
      enum: [libraryRead, libraryAdd, libraryChange, network, listeningActivity, tracksChanged, scanFinished, schedule, played, playing, searchActivity, searched, albumsChanged, artistsChanged, hostRateLimits]
      description: |
        What a plugin can ask for (`requirements/plugins.md` §4.1, §8). Hooks decide when it
        runs, and each needs the permissions named with it.
        - Per library: `libraryRead`; `libraryAdd`, creating files that do not exist yet;
          `libraryChange`, replacing, renaming, and deleting files that do; and the hooks
          `tracksChanged`, `albumsChanged`, and `artistsChanged`, run as those change, and
          `scanFinished`, as a scan finishes, which each need `libraryRead`.
        - Per plugin: `network`; `listeningActivity`; `searchActivity`, the searches of users
          who share them with it (`setMySearchSharing`); and `hostRateLimits`, under which its
          `"per": "host"` rate limits bind every plugin's requests to that host, not only its own.
        - Per plugin, hooks: `schedule`, at its `everyMinutes`, in every library it is enabled
          in; `played` and `playing`, as each user who connected it finishes or starts playing
          something, needing `listeningActivity`, and `libraryRead` in the library played from;
          and `searched`, as each user sharing searches with it settles on or removes one,
          needing `searchActivity` and `libraryRead`.

    PermissionRequest:
      type: object
      required: [permission, required, reason]
      properties:
        permission: { $ref: '#/components/schemas/PermissionName' }
        required:
          type: boolean
          description: Whether it cannot work without it (`requirements/plugins.md` §4.2).
        reason: { type: string, description: 'The author''s reason, shown to the admin beside the request.' }
        destinations:
          type: array
          description: With `network` only. Host names it reaches, or `["*"]` for any.
          items: { type: string }
        rateLimits:
          type: object
          description: |
            With `network` only, optional. The most often each destination may be asked, such
            as `"1/s"`, which counts only this plugin's requests, or as
            `{"limit": "1/s", "per": "user"}`. `per` is `plugin`; `user`, this plugin's runs for
            one connected user each; or `host`, every plugin's requests to that host, for a
            service that limits the whole server. A `host` limit needs `hostRateLimits`, and a
            destination named in `destinations` rather than reached through `*`. Where several
            plugins set one for a host, the strictest is kept to.
          additionalProperties:
            oneOf:
              - { type: string, pattern: '^[1-9][0-9]{0,8}/(s|min|h)$' }
              - type: object
                required: [limit, per]
                properties:
                  limit: { type: string, pattern: '^[1-9][0-9]{0,8}/(s|min|h)$' }
                  per: { type: string, enum: [plugin, user, host] }
        everyMinutes:
          type: integer
          minimum: 5
          description: With `schedule` only. How often it runs.

    PermissionGrants:
      type: object
      required: [granted, libraries]
      properties:
        granted:
          type: array
          description: Plugin-wide permissions.
          items: { $ref: '#/components/schemas/PermissionName' }
        libraries:
          type: array
          items:
            type: object
            required: [libraryId, granted]
            properties:
              libraryId: { type: string }
              granted:
                type: array
                items: { $ref: '#/components/schemas/PermissionName' }

    PluginRunResult:
      type: object
      required: [ok, summary, log, saved, scannerRunning]
      properties:
        ok: { type: boolean }
        summary: { type: string, description: 'The plugin''s own one-line summary, or why the run failed, for each library it ran in, in turn.' }
        log:
          type: array
          description: Progress lines the plugin logged, in order.
          items: { type: string }
        saved: { type: integer, description: Files it saved into the library. }
        scannerRunning: { type: boolean, description: Whether a scan was queued to pick those files up. }

    # ───────────────────────────── Realtime ─────────────────────────────
    RealtimeClientMessage:
      description: A message a client sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, command]
          properties:
            type: { const: playerCommand }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, report]
          description: From the playing device, or one taking playback over.
          properties:
            type: { const: progress }
            report: { $ref: '#/components/schemas/ProgressReport' }
        - type: object
          required: [type, result]
          description: From a target device, reporting whether it carried out a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type]
          properties:
            type: { const: ping }

    RealtimeServerMessage:
      description: A message the server sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, deviceId, serverTime]
          properties:
            type: { const: hello }
            deviceId: { type: string }
            serverTime:
              type: string
              format: date-time
              description: For extrapolating playback position.
        - type: object
          required: [type, state]
          properties:
            type: { const: player }
            state: { $ref: '#/components/schemas/PlayerState' }
        - type: object
          required: [type, devices]
          properties:
            type: { const: devices }
            devices:
              type: array
              items: { $ref: '#/components/schemas/Device' }
        - type: object
          required: [type, command]
          description: |
            Sent to the target device, which carries the command out and reports a
            `commandResult` with the same `commandId`. Only the connection it was sent to can
            answer it.
          properties:
            type: { const: execute }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, result]
          description: Sent to the device that issued a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type, reason]
          properties:
            type: { const: sessionRevoked }
            reason:
              type: string
              enum: [credentials_changed, logged_out]
        - type: object
          required: [type, serverTime]
          properties:
            type: { const: pong }
            serverTime: { type: string, format: date-time }
