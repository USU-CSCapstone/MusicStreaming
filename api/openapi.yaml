openapi: 3.1.0
info:
  title: Jewelcase API
  version: 1.0.0-draft
  summary: The public API of a Jewelcase server, used by first-party and third-party clients alike.
  description: |
    The contract between Jewelcase servers and every client. First-party clients use
    nothing outside it (`design/general.md` §6). Requirements cited as
    `requirements/file.md` §N.

    ## Conventions

    **Base path.** Paths are relative to `{basePath}/api/v1`. A server may sit under any
    prefix behind a reverse proxy; clients never assume the domain root.

    **Authentication.** Login registers a device and returns an opaque token. Send it as
    `Authorization: Bearer <token>`. The web client may instead rely on the
    `jewelcase_session` cookie set at login; cookie-authenticated requests that change
    state must carry an `X-Jewelcase-Client` header or they are refused. Any authenticated
    endpoint may answer `401` — see `Problem.reason` for whether a device keeps its
    downloads (`requirements/offline.md` §9).

    **Scope.** Paths under `/libraries/{libraryId}` are scoped to that library. Anything
    the caller cannot reach answers `404`, exactly as if it did not exist; an action the
    caller's role forbids answers `403` (`requirements/users.md` §10). Identifiers in a
    request select within the caller's scope and never widen it.

    **Personal data.** `/me` is the caller's own account. Admins read other accounts'
    data under `/admin/users/{userId}`, which is read-only by construction — no endpoint
    lets anyone act as another user (`requirements/users.md` §8). Content schemas keep
    per-user data in a `personal` object: the caller's own, or the viewed account's under
    `/admin/users/{userId}`. Responses carrying it are `Cache-Control: private`. Shared
    catalog data never carries it; devices receive it through the account feed.

    **Optimistic writes.** Writes clients apply locally before confirmation — queue and
    player commands, playlist edits, plays — carry a client-generated ID in the body
    (`commandId`, `editId`, `playId`, `createId`). The server applies each ID once however
    often it arrives, and IDs of anything those writes create are derived from it, so a
    device and the server agree without a round trip. Other state-changing `POST`s accept an
    `Idempotency-Key` header with the same guarantee.

    **Pagination.** Lists are cursor-paged: pass the previous page's `nextCursor` as
    `cursor`. `limit` defaults to 100 and may be up to 1000 — a bound on one transfer,
    never on a collection. Lists report `total`.

    **Errors.** `application/problem+json` (RFC 9457) with a machine-readable `code`.

    **Units.** Track and collection durations are integer microseconds (`durationUs`) so
    totals never drift; positions and listen time are integer milliseconds. Timestamps
    are RFC 3339 UTC. Release dates are partial dates at tag precision: `YYYY`,
    `YYYY-MM`, or `YYYY-MM-DD`.

    **Unknown values.** An untagged album or artist is a real entity whose `title` or
    `name` is `null`; clients render it as unknown (`requirements/scanning.md` §2).

    **Draft shapes.** `x-status: draft` marks schemas and operations whose final form
    waits on an open design decision (`design/general.md` §11): stream format, waveform
    and image-placeholder encodings, compact catalog encoding, and plugin surfaces.

    **Realtime.** `GET /realtime` upgrades to a WebSocket carrying
    `RealtimeClientMessage` and `RealtimeServerMessage`.

    **Plugin routes.** Plugins may register their own routes under
    `/libraries/{libraryId}/plugins/{pluginId}/`, reachable only where the plugin is
    enabled. Those are documented by each plugin, not here.
servers:
  - url: '{basePath}/api/v1'
    variables:
      basePath:
        default: ''
        description: Prefix the server is mounted under, if any.
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Server
    description: Health and server information, unauthenticated.
  - name: Auth
    description: Setup, login, invites, and password resets.
  - name: Account
    description: The caller's profile and settings.
  - name: Devices
    description: Logged-in devices and their settings (`requirements/users.md` §4, §6.1).
  - name: Libraries
    description: The libraries the caller can access.
  - name: Browse
    description: Tracks, albums, artists, and tags (`requirements/conventions.md` §4).
  - name: Media
    description: Artwork, lyrics, waveforms, and audio delivery.
  - name: Search
    description: Library search and recent searches (`requirements/search.md`).
  - name: Playlists
    description: Saved playlists (`requirements/playlists.md`).
  - name: Queue
    description: Manual Queue, Context Queue, History, and kept queues (`requirements/queue.md`).
  - name: Player
    description: Playback state, remote control, and Shift (`requirements/realtime.md`).
  - name: Listening
    description: Plays, history, statistics, and summaries (`requirements/analytics.md`).
  - name: Recommendations
    description: Surfaces, mixes, rediscovery, and similarity (`requirements/recommendations.md`).
  - name: Downloads
    description: Standing download instructions held per device (`requirements/offline.md` §3).
  - name: Sync
    description: Catalog snapshots and change feeds (`requirements/libraries.md` §5).
  - name: External
    description: Music surfaced by plugins that the user does not own (`requirements/plugins.md` §10).
  - name: Extensions
    description: Plugin interface surfaces (`requirements/plugins.md` §9).
  - name: Realtime
    description: The WebSocket connection for live updates and Shift (`requirements/realtime.md`).
  - name: Admin
    description: Server administration. Admin or owner role required unless stated.

paths:
  # ───────────────────────────── Server ─────────────────────────────
  /health:
    get:
      tags: [Server]
      summary: Health check
      description: Reports whether the server can actually serve, for container orchestration (`requirements/deployment.md` §7).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Able to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Running but unable to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /server:
    get:
      tags: [Server]
      summary: Server information
      description: Unauthenticated. Tells a client whether first-run setup is still required.
      operationId: getServerInfo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  # ───────────────────────────── Auth ─────────────────────────────
  /setup:
    post:
      tags: [Auth]
      summary: Create the owner account
      description: |
        First-run setup (`requirements/users.md` §2.1). Until it completes, every other
        endpoint except `/health` and `/server` answers `503 setup_required`. Once an owner
        exists this endpoint answers `404`.
      operationId: completeSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Owner created and logged in on this device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and register a device
      description: |
        Failure is identical for an unknown account, a wrong password, and a suspended
        account (`requirements/users.md` §3). Repeated failures are delayed, then
        temporarily locked, per account and per origin (`requirements/users.md` §3.1).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in. Also sets the session cookie for browser clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: '`invalid_credentials`, whatever the cause.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out this device
      description: Removes the device. Its downloads are removed (`requirements/offline.md` §9).
      operationId: logout
      responses:
        '204': { description: Logged out. }
        default: { $ref: '#/components/responses/Problem' }

  /invites/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    get:
      tags: [Auth]
      summary: Check an invite
      description: An expired, revoked, or used invite is indistinguishable from one that never existed.
      operationId: getInvite
      security: []
      responses:
        '200':
          description: The invite can be redeemed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /invites/{code}/redeem:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    post:
      tags: [Auth]
      summary: Redeem an invite
      description: Creates the account with the invite's library access and signs it in (`requirements/users.md` §2.2).
      operationId: redeemInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRedemption' }
      responses:
        '201':
          description: Account created and logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /password-resets/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
        description: Single-use code from an admin-issued reset link.
    post:
      tags: [Auth]
      summary: Complete a password reset
      description: |
        Sets a new password, logs out every device with reason `credentials_changed` —
        so they keep their downloads — and logs in this one (`requirements/users.md` §3).
      operationId: completePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetCompletion' }
      responses:
        '200':
          description: Password set and logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Account ─────────────────────────────
  /me:
    get:
      tags: [Account]
      summary: Get the caller's account
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Account]
      summary: Update profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /me/avatar:
    get:
      tags: [Account]
      summary: Get avatar image
      description: |
        Served with an `ETag` and `Cache-Control: no-cache`: clients keep a cached copy and
        revalidate it with `If-None-Match`, so an unchanged avatar costs a `304`. A change reaches
        other devices through the account feed as an update to the user.
      operationId: getMyAvatar
      parameters:
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/AvatarImage' }
        '304': { description: Unchanged since the cached copy. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Account]
      summary: Set avatar image
      operationId: setMyAvatar
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Account]
      summary: Remove avatar image
      operationId: deleteMyAvatar
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Problem' }

  /me/password:
    put:
      tags: [Account]
      summary: Change password
      description: |
        Logs out every other device with reason `credentials_changed`; they keep their
        downloads. This device stays logged in (`requirements/users.md` §3).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Changed. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }

  /me/settings:
    get:
      tags: [Account]
      summary: Get account settings
      description: Settings that follow the person across devices (`requirements/users.md` §6.1).
      operationId: getAccountSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Account]
      summary: Update account settings
      description: Merge-patch. Changes reach the account's other devices through the account feed.
      operationId: updateAccountSettings
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AccountSettings' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /me/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: libraryId
        in: query
        required: true
        schema: { type: string }
    get:
      tags: [Account]
      summary: Get the caller's settings for a plugin
      description: Per-user settings and credentials for personal sources (`requirements/plugins.md` §6). Secrets are never returned.
      operationId: getMyPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Account]
      summary: Set the caller's settings for a plugin
      description: Validated by the plugin when entered; an invalid value answers `422 plugin_settings_invalid`.
      operationId: setMyPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Devices ─────────────────────────────
  /me/devices:
    get:
      tags: [Devices]
      summary: List the caller's devices
      description: The same list used for Shift targets (`requirements/realtime.md` §1).
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/logout:
    post:
      tags: [Devices]
      summary: Log out all devices
      operationId: logoutAllDevices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [includeCurrent]
              properties:
                includeCurrent:
                  type: boolean
                  description: Also log out the calling device.
      responses:
        '204': { description: Logged out. }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      summary: Get a device
      operationId: getDevice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Devices]
      summary: Rename a device
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Devices]
      summary: Log out a device remotely
      description: The device receives `session_revoked` with reason `logged_out` and removes its downloads.
      operationId: logoutDevice
      responses:
        '204': { description: Logged out. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Libraries ─────────────────────────────
  /libraries:
    get:
      tags: [Libraries]
      summary: List libraries the caller can access
      description: Empty for an account with no access; clients explain why rather than erroring (`requirements/users.md` §5).
      operationId: listLibraries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Libraries]
      summary: Get a library
      operationId: getLibrary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Browse ─────────────────────────────
  /libraries/{libraryId}/tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse tracks
      description: |
        Any filtered list of the library's tracks. Filters compose (`requirements/tags.md` §7).
        An album's track listing is `albumId` with `sort=album`: disc then track order, missing
        tracks in position (`requirements/albums.md` §4). Whether a track is owned or featured
        for an artist follows from its `album.artists`. Playlists, mixes, and queues are ordered
        item lists, not track filters, and have their own item endpoints.
      operationId: listTracks
      parameters:
        - name: sort
          in: query
          description: |
            `album` orders by album, then disc, then track number. `top` is the caller's own
            ranking — listening weighted by completion, not play count alone — falling back to a
            sensible order for tracks never played, so it is never empty
            (`requirements/artists.md` §3.3, `requirements/analytics.md` §4). An artist's top
            tracks are `artistId` with `sort=top`.
          schema:
            type: string
            enum: [name, artist, album, dateAdded, playCount, lastPlayed, releaseDate, duration, top]
            default: name
        - $ref: '#/components/parameters/Order'
        - name: albumId
          in: query
          description: Only tracks on this album.
          schema: { type: string }
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/PlayedBefore'
        - $ref: '#/components/parameters/PlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Browse]
      summary: Get a track
      operationId: getTrack
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse albums
      description: |
        Any filtered list of the library's albums. An artist's discography is `artistId` with
        `artistCredit=owned`, grouped by `type` with empty sections omitted, newest first by
        default (`requirements/artists.md` §3.1). Their appearances are `artistCredit=featured`;
        the tracks on each come from `listTracks` with `artistId`, `artistCredit=featured`, and
        `sort=album` (`requirements/artists.md` §3.2).
      operationId: listAlbums
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, artist, dateAdded, playCount, lastPlayed, releaseDate, duration]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ArtistFilter'
        - $ref: '#/components/parameters/ArtistCredit'
        - name: type
          in: query
          description: Filter by album type (`requirements/albums.md` §6).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AlbumType' }
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/PlayedBefore'
        - $ref: '#/components/parameters/PlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums/{albumId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [Browse]
      summary: Get an album
      description: |
        The album with a summary of each disc present. Its tracks are listed with `listTracks`
        using `albumId` and `sort=album`, since an album's size is unbounded — the unknown album
        holds every file with no album tag.
      operationId: getAlbum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Album' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: Browse artists
      description: Includes artists credited only as features (`requirements/artists.md` §5).
      operationId: listArtists
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, dateAdded, playCount, lastPlayed]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/GenreMatch'
        - $ref: '#/components/parameters/Availability'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/PlayedBefore'
        - $ref: '#/components/parameters/PlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtistPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists/{artistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/ArtistId'
    get:
      tags: [Browse]
      summary: Get an artist
      operationId: getArtist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tags:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Browse]
      summary: List tags
      operationId: listTags
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TagType' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, trackCount]
            default: name
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TagId'
    get:
      tags: [Browse]
      summary: Get a tag
      description: A tag's tracks, albums, and artists are browsed with the `genre` filter on the browse endpoints (`requirements/tags.md` §7).
      operationId: getTag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Media ─────────────────────────────
  /libraries/{libraryId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: imageId
        in: path
        required: true
        schema: { type: string }
        description: Content-addressed; replacing an image on disk yields a new ID.
    get:
      tags: [Media]
      summary: Get an image
      description: |
        Album, artist, and playlist images, resized to the requested size and
        format-negotiated by `Accept` (`requirements/conventions.md` §5). Immutable and
        cacheable indefinitely, because its ID changes whenever the image does.
      operationId: getImage
      parameters:
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/lyrics:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get lyrics
      description: A track without lyrics answers `200` with `kind` `none` (`requirements/tracks.md` §5).
      operationId: getLyrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lyrics' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/waveform:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Get a waveform
      description: |
        Fetched on demand for the track playing and with downloads, never synced wholesale
        (`requirements/playback.md` §3). Deterministic for the same audio, so cacheable until the
        track's audio changes.
      operationId: getWaveform
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Waveform' }
        '204':
          description: |
            Not yet analyzed. Clients show a plain progress bar, and fetch again once the track's
            `loudness` becomes non-null.
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/playback:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Negotiate audio delivery
      description: |
        Chooses direct or transcoded delivery from the requested quality and what the client
        can decode: the original whenever the client can play it at or below `quality`
        (`requirements/playback.md` §1). The client picks `quality` from its own settings for
        the connection it is on, or for downloads. Describes exactly what the listener will hear.
      operationId: getPlaybackInfo
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/Purpose'
        - $ref: '#/components/parameters/QualityParam'
        - $ref: '#/components/parameters/Codecs'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/audio:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Media]
      summary: Stream or download audio
      description: |
        Serves a variant chosen by `getPlaybackInfo`, with byte ranges for seeking and
        resumable downloads. A new stream on a saturated host is refused with
        `503 capacity_exceeded`; streams already playing are never degraded
        (`requirements/performance.md` §7).
      operationId: getAudio
      x-status: draft
      parameters:
        - name: variant
          in: query
          required: true
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Audio' }
        '206': { $ref: '#/components/responses/Audio' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: Range not satisfiable. }
        '503': { $ref: '#/components/responses/CapacityExceeded' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Search ─────────────────────────────
  /libraries/{libraryId}/search:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: Search a library
      description: |
        Names and lyrics, with typo tolerance, diacritic and case folding, word-order
        independence, and exact-match precedence (`requirements/search.md` §3). Results
        are identical to on-device search over the same corpus (`requirements/search.md` §2.1).
        External sources are searched separately so they never delay these results.
      operationId: search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/SearchTypes'
        - $ref: '#/components/parameters/Within'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/PlayedBefore'
        - $ref: '#/components/parameters/PlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - name: sectionLimit
          in: query
          description: Results shown per section before expanding.
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/search/{section}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: section
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SearchSectionType' }
    get:
      tags: [Search]
      summary: Expand a search section
      description: The full list for one section, in match order or sorted (`requirements/search.md` §4).
      operationId: searchSection
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Within'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/Played'
        - $ref: '#/components/parameters/PlayedBefore'
        - $ref: '#/components/parameters/PlayedAfter'
        - $ref: '#/components/parameters/MinPlayCount'
        - name: sort
          in: query
          description: '`relevance`, or any sort the section''s browse endpoint accepts.'
          schema: { type: string, default: relevance }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /search:
    get:
      tags: [Search]
      summary: Search across libraries
      description: Supported for third-party clients; not surfaced by v1 first-party clients (`requirements/search.md` §5).
      operationId: searchLibraries
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: libraries
          in: query
          description: Libraries to search. Defaults to every library the caller can access.
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - $ref: '#/components/parameters/SearchTypes'
        - name: sectionLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200':
          description: One response per library searched.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [libraryId, results]
                      properties:
                        libraryId: { type: string }
                        results: { $ref: '#/components/schemas/SearchResponse' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Search]
      summary: List recent searches
      description: Kept only for a recent window; there is no permanent search history (`requirements/search.md` §6).
      operationId: listRecentSearches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecentSearch' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Search]
      summary: Record a recent search
      description: Recorded when the user acts on a result, not on every keystroke.
      operationId: recordRecentSearch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecentSearchCreate' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentSearch' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Search]
      summary: Clear recent searches
      operationId: clearRecentSearches
      responses:
        '204': { description: Cleared. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/recent-searches/{recentSearchId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: recentSearchId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Search]
      summary: Remove a recent search
      operationId: deleteRecentSearch
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Sync ─────────────────────────────
  /libraries/{libraryId}/catalog:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Sync]
      summary: Get a catalog snapshot manifest
      description: |
        The whole catalog a device carries (`requirements/offline.md` §1), split into parts
        a client fetches progressively. Includes image placeholders and similarity data;
        excludes lyrics and waveforms. Follow the library feed from `cursor` afterwards.
      operationId: getCatalogManifest
      x-status: draft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogManifest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/catalog/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: partId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Sync]
      summary: Get a catalog part
      description: JSON, or a compact encoding when requested by `Accept`.
      operationId: getCatalogPart
      x-status: draft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPart' }
            application/vnd.jewelcase.catalog:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/changes:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Sync]
      summary: Follow the library feed
      description: |
        Content changes after `since`, coalesced to net effect. An expired cursor answers
        `410 cursor_expired`; the client resyncs from the catalog snapshot.
      operationId: getLibraryChanges
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeBatch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/CursorExpired' }
        default: { $ref: '#/components/responses/Problem' }

  /me/changes:
    get:
      tags: [Sync]
      summary: Follow the account feed
      description: |
        Changes to the caller's personal data — playlists, queues, plays, settings,
        devices, downloads, generated mixes — after `since`, coalesced to net effect.
      operationId: getAccountChanges
      parameters:
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeBatch' }
        '410':
          description: '`cursor_expired` — follow the feed again with `since` omitted.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── External ─────────────────────────────
  /libraries/{libraryId}/external/sources:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [External]
      summary: List external sources
      description: Sources provided by plugins enabled for this library.
      operationId: listExternalSources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalSource' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/external/{sourceId}/search:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [External]
      summary: Search one external source
      description: |
        Called per source alongside library search, so a slow source delays only its own
        section. Bounded by the server; a source that does not answer in time returns
        `504 source_timeout` (`requirements/plugins.md` §2.2).
      operationId: searchExternalSource
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSearchResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        '504': { $ref: '#/components/responses/SourceTimeout' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/external/{sourceId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [External]
      summary: Browse an external item
      description: An artist, album, or playlist in whatever structure the source offers.
      operationId: getExternalItem
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        '504': { $ref: '#/components/responses/SourceTimeout' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/external/{sourceId}/tracks/{externalTrackId}/playback:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/ExternalTrackId'
    get:
      tags: [External]
      summary: Negotiate delivery of an external track
      description: As `getPlaybackInfo`. `purpose=download` is always refused — external content cannot be downloaded.
      operationId: getExternalPlaybackInfo
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/QualityParam'
        - $ref: '#/components/parameters/Codecs'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/external/{sourceId}/tracks/{externalTrackId}/audio:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/ExternalTrackId'
    get:
      tags: [External]
      summary: Stream an external track
      operationId: getExternalAudio
      x-status: draft
      parameters:
        - name: variant
          in: query
          required: true
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Audio' }
        '206': { $ref: '#/components/responses/Audio' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/external/{sourceId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
      - name: imageId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [External]
      summary: Get external artwork
      description: Proxied through the server, so clients never contact a source directly.
      operationId: getExternalImage
      parameters:
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Extensions ─────────────────────────────
  /libraries/{libraryId}/extensions:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Extensions]
      summary: List plugin surfaces
      description: Pages, entity sections, actions, and settings that enabled plugins add to the client.
      operationId: listExtensionSurfaces
      x-status: draft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExtensionSurface' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/extensions/{pluginId}/surfaces/{surfaceId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PluginId'
      - name: surfaceId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Extensions]
      summary: Render a plugin surface
      description: |
        Declarative content the client renders natively. Bounded like every plugin call; a
        failing surface answers `503` or `504` and the client degrades that section alone
        (`requirements/plugins.md` §9).
      operationId: getExtensionSurface
      x-status: draft
      parameters:
        - name: target
          in: query
          description: 'The entity the surface is shown on, as `type:id`, for entity sections and actions.'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        '504': { $ref: '#/components/responses/SourceTimeout' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/extensions/{pluginId}/actions/{actionId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PluginId'
      - name: actionId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Extensions]
      summary: Invoke a plugin action
      operationId: invokeExtensionAction
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionActionRequest' }
      responses:
        '200':
          description: Completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/SourceUnavailable' }
        '504': { $ref: '#/components/responses/SourceTimeout' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Playlists ─────────────────────────────
  /libraries/{libraryId}/playlists:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Playlists]
      summary: List the caller's playlists
      description: Pinned playlists first (`requirements/playlists.md` §7).
      operationId: listPlaylists
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created, modified, playCount]
            default: modified
        - $ref: '#/components/parameters/Order'
        - name: q
          in: query
          description: Filter by name.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Playlists]
      summary: Create a playlist
      description: |
        Optionally with initial items, or by saving a generated mix (`requirements/playlists.md` §8).
        The playlist's ID derives from `createId` and it starts at version 1, so a device can
        create a playlist offline and queue edits to it.
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/deleted:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Playlists]
      summary: List recently deleted playlists
      description: Deletion is recoverable for a retention window (`requirements/playlists.md` §4).
      operationId: listDeletedPlaylists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeletedPlaylist' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/import:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [Playlists]
      summary: Import a Jewelcase playlist file
      description: |
        Imports the complete export format, for moving between servers
        (`requirements/playlists.md` §9). Entries that match no track are reported.
        Playlist files inside a library are never read.
      operationId: importPlaylist
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/vnd.jewelcase.playlist+json:
            schema: { type: object }
      responses:
        '201':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistImportResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: Get a playlist
      operationId: getPlaylist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Playlists]
      summary: Update playlist details
      description: Applies only against `baseVersion`; otherwise `409 version_conflict` (`requirements/playlists.md` §5).
      operationId: updatePlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Delete a playlist
      description: Recoverable until the retention window ends.
      operationId: deletePlaylist
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/restore:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    post:
      tags: [Playlists]
      summary: Restore a deleted playlist
      operationId: restorePlaylist
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: List playlist items
      description: In the user's order. Missing tracks stay in position (`requirements/playlists.md` §3).
      operationId: listPlaylistItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/edits:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    post:
      tags: [Playlists]
      summary: Edit playlist contents
      description: |
        Adds, removes, and moves — including non-contiguous selections — as one atomic
        edit against `baseVersion` (`requirements/playlists.md` §4–§5). A device chains its
        queued edits, each using the version the previous one produced. Undo is a further
        edit that reverses the last.
      operationId: editPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistEdit' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistEditResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/duplicates:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    post:
      tags: [Playlists]
      summary: Check for duplicates before adding
      description: Reports which of the given items are already present, so the user can back out (`requirements/playlists.md` §3).
      operationId: checkPlaylistDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Playable' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trackIds]
                properties:
                  trackIds:
                    type: array
                    description: Tracks from the request already in the playlist.
                    items: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/image:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    put:
      tags: [Playlists]
      summary: Set a custom image
      description: Stored in Jewelcase's data, never the library (`requirements/playlists.md` §6).
      operationId: setPlaylistImage
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Playlists]
      summary: Revert to the generated image
      operationId: deletePlaylistImage
      responses:
        '204': { description: Reverted. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/playlists/{playlistId}/export:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Playlists]
      summary: Export a playlist
      description: |
        `m3u` for other players — the one place a listener receives file paths, requested
        explicitly (`requirements/general.md` §3.7). Paths are absolute as mounted in the
        container; `rootPath` rewrites a root's prefix to where the other player sees it.
        `jewelcase` is the complete format for backup and moving between servers.
      operationId: exportPlaylist
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [m3u, jewelcase]
        - name: rootPath
          in: query
          description: 'Repeatable `{rootId}:{path}` — replace that root''s container path with `path`.'
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: The playlist file.
          content:
            audio/x-mpegurl:
              schema: { type: string }
            application/vnd.jewelcase.playlist+json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Recommendations ─────────────────────────────
  /libraries/{libraryId}/recommendations:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Recommendations]
      summary: Get recommendation surfaces
      description: |
        Only surfaces with enough evidence to be good; a small library gets fewer
        (`requirements/recommendations.md` §9). Empty when the user has turned surfaces off.
      operationId: getRecommendations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecommendationSurface' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/rediscovery:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Recommendations]
      summary: Get rediscovery
      description: Loved once and gone quiet, owned and never heard, and anniversaries (`requirements/recommendations.md` §7).
      operationId: getRediscovery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rediscovery' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/mixes:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Recommendations]
      summary: List generated mixes
      operationId: listMixes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Mix' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/mixes/{mixId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/MixId'
    get:
      tags: [Recommendations]
      summary: Get a mix
      description: Stable until `refreshesAt`; a replaced mix answers `404` (`requirements/recommendations.md` §5).
      operationId: getMix
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mix' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/mixes/{mixId}/items:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/MixId'
    get:
      tags: [Recommendations]
      summary: List mix items
      operationId: listMixItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/tracks/{trackId}/similar:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Recommendations]
      summary: Get similar tracks
      description: Drawn from the library, absent rather than padded (`requirements/recommendations.md` §6).
      operationId: getSimilarTracks
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/albums/{albumId}/similar:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/AlbumId'
    get:
      tags: [Recommendations]
      summary: Get similar albums
      description: Drawn from the library, absent rather than padded (`requirements/recommendations.md` §6).
      operationId: getSimilarAlbums
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/artists/{artistId}/similar:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/ArtistId'
    get:
      tags: [Recommendations]
      summary: Get similar artists
      description: Related artists — always artists in the library, collaborators included (`requirements/artists.md` §3.4).
      operationId: getRelatedArtists
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Downloads ─────────────────────────────
  /libraries/{libraryId}/downloads/estimate:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [Downloads]
      summary: Estimate a download
      description: Size at a given quality, which the device checks against its own storage budget so a download that will not fit says how much it needs (`requirements/offline.md` §5).
      operationId: estimateDownload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadEstimateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadEstimate' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}/downloads:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Downloads]
      summary: List a device's downloads
      operationId: listDownloads
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Downloads]
      summary: Download an entity to a device
      description: |
        A standing instruction: tracks later added to the entity download too
        (`requirements/offline.md` §3). The storage budget is the device's own: it checks the
        estimate before creating a download, and reports one that cannot grow with
        `incompleteReason` (`requirements/offline.md` §5).
      operationId: createDownload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}/downloads/{downloadId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DownloadId'
    get:
      tags: [Downloads]
      summary: Get a download
      operationId: getDownload
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Downloads]
      summary: Remove a download
      description: The device frees the space. Never touches the library.
      operationId: deleteDownload
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}/downloads/{downloadId}/tracks:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DownloadId'
    get:
      tags: [Downloads]
      summary: List the tracks a download covers
      description: |
        The resolved track set with the variant to fetch for each. Everything else a
        download needs — album and artist images, biographies, lyrics, waveforms — is
        fetched through the ordinary endpoints (`requirements/offline.md` §2).
      operationId: listDownloadTracks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTrackPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}/downloads/{downloadId}/status:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DownloadId'
    put:
      tags: [Downloads]
      summary: Report download progress
      description: Sent by the device holding the download, so other devices and admins see its state.
      operationId: reportDownloadStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadStatusReport' }
      responses:
        '204': { description: Recorded. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/devices/{deviceId}/downloads/{downloadId}/refetch:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/DownloadId'
    post:
      tags: [Downloads]
      summary: Re-fetch at a new quality
      description: Explicit only — a quality change never re-downloads on its own (`requirements/offline.md` §5).
      operationId: refetchDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quality]
              properties:
                quality: { $ref: '#/components/schemas/Quality' }
      responses:
        '200':
          description: Scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Queue ─────────────────────────────
  /me/queue:
    get:
      tags: [Queue]
      summary: Get the queue
      description: The account's single queue (`requirements/queue.md` §7), or `null` before anything has played. Items are listed separately.
      operationId: getQueue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Queue'
                  - type: 'null'
        default: { $ref: '#/components/responses/Problem' }

  /me/queue/items:
    get:
      tags: [Queue]
      summary: List queue items
      description: |
        `manual` and `context` together are Up Next, in play order; `history` is most
        recent first (`requirements/queue.md` §2).
      operationId: listQueueItems
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [manual, context, history]
        - $ref: '#/components/parameters/ExpandTracks'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemPage' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queue/commands:
    post:
      tags: [Queue]
      summary: Change the queue
      description: |
        Starting a context, queueing, inserting, moving, removing, shuffle, repeat, and
        endless play. Also accepted over the realtime connection. Commands reference items
        by `itemId`, so concurrent edits from several devices compose and converge
        (`requirements/realtime.md` §7). A queue belongs to one library; an item from any
        other library answers `404` (`requirements/libraries.md` §4).
      operationId: sendQueueCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueCommand' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues:
    get:
      tags: [Queue]
      summary: List kept queues
      description: Adjusted queues set aside by a new context, kept for 30 days of inactivity (`requirements/queue.md` §6).
      operationId: listKeptQueues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Queue' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues/{queueId}:
    parameters:
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Queue]
      summary: Get a kept queue
      operationId: getKeptQueue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Queue]
      summary: Delete a kept queue
      operationId: deleteKeptQueue
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues/{queueId}/items:
    parameters:
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Queue]
      summary: List a kept queue's items
      operationId: listKeptQueueItems
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [manual, context, history]
        - $ref: '#/components/parameters/ExpandTracks'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/queues/{queueId}/restore:
    parameters:
      - $ref: '#/components/parameters/QueueId'
    post:
      tags: [Queue]
      summary: Restore a kept queue
      description: Restores position, shuffle, repeat, Manual Queue, and History exactly as left. The current queue is kept if adjusted.
      operationId: restoreKeptQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId]
              properties:
                commandId: { $ref: '#/components/schemas/CommandId' }
      responses:
        '200':
          description: Restored; now the current queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Player ─────────────────────────────
  /me/player:
    get:
      tags: [Player]
      summary: Get playback state
      description: The account's playback state — which device is playing, what, and where (`requirements/playback.md` §6).
      operationId: getPlayer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerState' }
        default: { $ref: '#/components/responses/Problem' }

  /me/player/commands:
    post:
      tags: [Player]
      summary: Control playback on any device
      description: |
        Play, pause, seek, skip, volume, transfer, and wake, targeting any of the caller's
        devices (`requirements/realtime.md` §3). Last command wins. The result reports
        whether the target carried it out.
      operationId: sendPlayerCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCommand' }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`device_unavailable` — the target device is not connected.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/player/progress:
    post:
      tags: [Player]
      summary: Report playback progress
      description: Sent by the playing device; usually over the realtime connection instead.
      operationId: reportProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressReport' }
      responses:
        '204': { description: Recorded. }
        '409':
          description: '`not_active_device` — another device has taken over.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/player/failures:
    post:
      tags: [Player]
      summary: Report playback failures
      description: Repeated failures surface to admins as a server problem (`requirements/playback.md` §8).
      operationId: reportPlaybackFailures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/PlaybackFailureReport' }
      responses:
        '204': { description: Recorded. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Listening ─────────────────────────────
  /me/plays:
    post:
      tags: [Listening]
      summary: Record plays
      description: |
        Upserts by `playId`. A device reports a play when it starts and again as listen
        time accumulates and when it ends; offline plays arrive later with their original
        times. Never counted twice (`requirements/analytics.md` §1, §6).
      operationId: recordPlays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/PlayReport' }
      responses:
        '204': { description: Recorded. }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /me/history:
    get:
      tags: [Listening]
      summary: Browse listening history
      description: Every play on every device, most recent first (`requirements/analytics.md` §3).
      operationId: listHistory
      parameters:
        - $ref: '#/components/parameters/OptionalLibraryId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: artistId
          in: query
          schema: { type: string }
        - name: albumId
          in: query
          schema: { type: string }
        - name: trackId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Search titles and artists in history.
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        default: { $ref: '#/components/responses/Problem' }

  /me/history/{playId}:
    parameters:
      - name: playId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Listening]
      summary: Delete a play
      description: Permanent, including its influence on statistics and recommendations (`requirements/analytics.md` §9).
      operationId: deletePlay
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/history/clear:
    post:
      tags: [Listening]
      summary: Clear history
      description: Clears a range, a library, or everything when no bounds are given. Permanent.
      operationId: clearHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                libraryId: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        '204': { description: Cleared. }
        default: { $ref: '#/components/responses/Problem' }

  /me/stats:
    get:
      tags: [Listening]
      summary: Get listening statistics
      description: For one library or all of them (`requirements/analytics.md` §4).
      operationId: getStats
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/OptionalLibraryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        default: { $ref: '#/components/responses/Problem' }

  /me/stats/top:
    get:
      tags: [Listening]
      summary: Get a full top list
      description: Ranked with completion, not play count alone (`requirements/analytics.md` §4).
      operationId: getTopList
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [track, album, artist, genre]
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/OptionalLibraryId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TopItem' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{libraryId}/stats/{entityType}/{entityId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [tracks, albums, artists, tags, playlists]
      - name: entityId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Listening]
      summary: Get the caller's statistics for one entity
      description: Every statistic is reachable from the entity it concerns (`requirements/analytics.md` §4).
      operationId: getEntityStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityStats' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /me/summaries:
    get:
      tags: [Listening]
      summary: Get a period summary
      description: Generated on demand for any range (`requirements/analytics.md` §5).
      operationId: getSummary
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/OptionalLibraryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSummary' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Realtime ─────────────────────────────
  /realtime:
    get:
      tags: [Realtime]
      summary: Open the realtime connection
      description: |
        Upgrades to a WebSocket. Browser clients authenticate with the session cookie;
        others send an `auth` message first. Messages are JSON objects matching
        `RealtimeClientMessage` and `RealtimeServerMessage`. The server heartbeats; a
        reconnecting client resumes by following its feeds from its cursors and receives
        current playback state (`requirements/realtime.md` §6).
      operationId: openRealtime
      security: []
      x-messages:
        client: { $ref: '#/components/schemas/RealtimeClientMessage' }
        server: { $ref: '#/components/schemas/RealtimeServerMessage' }
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
      responses:
        '101': { description: Switching to WebSocket. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: accounts ─────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: List accounts
      operationId: adminListUsers
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: Get an account
      operationId: adminGetUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: Delete an account
      description: |
        Permanent, removing all personal data; never touches audio, metadata, or artwork.
        The owner cannot be deleted (`requirements/users.md` §9).
      operationId: adminDeleteUser
      parameters:
        - name: confirm
          in: query
          required: true
          description: The account's username, confirming the deletion.
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/suspend:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: Suspend an account
      description: Logs out every device and stops playback; everything owned is preserved (`requirements/users.md` §9).
      operationId: adminSuspendUser
      responses:
        '200':
          description: Suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/unsuspend:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: Restore a suspended account
      operationId: adminUnsuspendUser
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      summary: Promote or demote an admin
      description: Owner only (`requirements/users.md` §1).
      operationId: adminSetRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/libraries:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      summary: Set an account's library access
      description: Revoking access preserves the account's data for that library (`requirements/users.md` §5).
      operationId: adminSetLibraryAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryIds]
              properties:
                libraryIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/library-access:
    post:
      tags: [Admin]
      summary: Grant or revoke library access in bulk
      operationId: adminBulkLibraryAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryAccessChange' }
      responses:
        '204': { description: Applied. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: Issue a password reset link
      description: |
        Single-use and expiring. The admin never sets the password (`requirements/users.md` §3).
        Issuing and completing a reset are both recorded in the audit log.
      operationId: adminCreatePasswordReset
      responses:
        '201':
          description: Link issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/ownership:
    post:
      tags: [Admin]
      summary: Transfer ownership
      description: Owner only. The target must be an admin; the previous owner becomes an admin (`requirements/users.md` §1).
      operationId: adminTransferOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, confirm]
              properties:
                userId: { type: string }
                confirm:
                  type: string
                  description: The target's username, confirming the transfer.
      responses:
        '204': { description: Transferred. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/invites:
    get:
      tags: [Admin]
      summary: List invites
      description: Pending, redeemed, revoked, and expired (`requirements/users.md` §2.2).
      operationId: adminListInvites
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Create an invite
      operationId: adminCreateInvite
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteCreate' }
      responses:
        '201':
          description: Created. The link is shown only now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Admin]
      summary: Revoke an invite
      operationId: adminRevokeInvite
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/devices:
    get:
      tags: [Admin]
      summary: List logged-in devices across the server
      operationId: adminListDevices
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: connected
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDevicePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Admin]
      summary: Log out any device
      operationId: adminLogoutDevice
      responses:
        '204': { description: Logged out. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/login-attempts:
    get:
      tags: [Admin]
      summary: List login attempts
      description: So admins can see an account under pressure (`requirements/users.md` §3.1).
      operationId: adminListLoginAttempts
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: failedOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginAttemptPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/audit-log:
    get:
      tags: [Admin]
      summary: Read the audit log
      description: Owner only. Administrative actions affecting accounts (`requirements/users.md` §8).
      operationId: adminListAuditLog
      parameters:
        - name: userId
          in: query
          description: Actions affecting this account.
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────── Admin: read-only views of account data ───────────────────
  # `requirements/users.md` §8 — admins see everything and can act as no one.
  # Every operation here is a GET, or an export on the user's behalf.
  /admin/users/{userId}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: Get an account's avatar
      description: Cached and revalidated like `getMyAvatar`.
      operationId: adminGetUserAvatar
      parameters:
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/AvatarImage' }
        '304': { description: Unchanged since the cached copy. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/playlists:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's playlists
      operationId: adminListUserPlaylists
      parameters:
        - $ref: '#/components/parameters/OptionalLibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/playlists/{playlistId}/items:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PlaylistId'
    get:
      tags: [Admin]
      summary: View a playlist's items
      operationId: adminListUserPlaylistItems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistItemPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/queues:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's current and kept queues
      operationId: adminListUserQueues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [current, kept]
                properties:
                  current:
                    oneOf:
                      - $ref: '#/components/schemas/Queue'
                      - type: 'null'
                  kept:
                    type: array
                    items: { $ref: '#/components/schemas/Queue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/queues/{queueId}/items:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Admin]
      summary: View a queue's items
      operationId: adminListUserQueueItems
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [manual, context, history]
        - $ref: '#/components/parameters/ExpandTracks'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/devices:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's devices
      operationId: adminListUserDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/downloads:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's downloads on every device
      operationId: adminListUserDownloads
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Download' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/history:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's listening history
      operationId: adminListUserHistory
      parameters:
        - $ref: '#/components/parameters/OptionalLibraryId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/stats:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: View an account's statistics
      operationId: adminGetUserStats
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/OptionalLibraryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/exports:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Admin]
      summary: Export an account's data on their behalf
      description: Works for suspended accounts too (`requirements/users.md` §9).
      operationId: adminCreateUserExport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Export started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Admin]
      summary: Get an export's status
      operationId: adminGetUserExport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{userId}/exports/{exportId}/file:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ExportId'
    get:
      tags: [Admin]
      summary: Download an export
      operationId: adminDownloadUserExport
      responses:
        '200':
          description: The export archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: server ─────────────────────────────
  /admin/activity:
    get:
      tags: [Admin]
      summary: See current listeners and capacity
      description: |
        Who is listening, transcodes in flight, and what capacity is being hit, so the
        answer to "why was I refused" is visible (`requirements/performance.md` §7). Also
        pushed live over the realtime connection.
      operationId: adminGetActivity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/playback-failures:
    get:
      tags: [Admin]
      summary: List reported playback failures
      description: Grouped by track and kind (`requirements/playback.md` §8).
      operationId: adminListPlaybackFailures
      parameters:
        - $ref: '#/components/parameters/OptionalLibraryId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackFailurePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/directories:
    get:
      tags: [Admin]
      summary: List directories on the server
      description: Directories only, for choosing library roots. Not a file browser (`requirements/general.md` §2).
      operationId: adminListDirectories
      parameters:
        - name: path
          in: query
          description: Absolute path inside the container. Defaults to the filesystem root.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryListing' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: libraries ─────────────────────────────
  /admin/libraries:
    get:
      tags: [Admin]
      summary: List libraries with health
      description: Every library, whatever the admin's current one (`requirements/libraries.md` §3).
      operationId: adminListLibraries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminLibrary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Create a library
      description: Overlapping roots are rejected with `422 root_overlap` (`requirements/libraries.md` §1). The first scan starts on its own.
      operationId: adminCreateLibrary
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLibrary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Admin]
      summary: Get a library's configuration and health
      operationId: adminGetLibrary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLibrary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin]
      summary: Reconfigure a library
      description: |
        Rename, change roots and exclude rules, or scan triggers. Changing roots or excludes
        triggers reconciliation. Giving an existing root a new path repoints it without
        re-indexing (`requirements/libraries.md` §2).
      operationId: adminUpdateLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLibrary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: Delete a library
      description: |
        Removes only Jewelcase's knowledge of it — the index and the playlists, queues,
        history, and statistics scoped to it. No file on disk is touched
        (`requirements/libraries.md` §3).
      operationId: adminDeleteLibrary
      parameters:
        - name: confirm
          in: query
          required: true
          description: The library's name, confirming the deletion.
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/scans:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Admin]
      summary: List scans
      operationId: adminListScans
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Start a manual scan
      description: |
        Of the library or a single folder. Overlapping triggers never compound — if an
        equivalent scan is already running, that scan is returned (`requirements/scanning.md` §4).
      operationId: adminStartScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: A folder inside one of the library's roots. Omit to scan everything.
      responses:
        '202':
          description: Scan queued or already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Get scan progress
      operationId: adminGetScan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/scans/{scanId}/cancel:
    parameters:
      - name: scanId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      summary: Cancel a scan
      description: Work already done is kept.
      operationId: adminCancelScan
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/scan-problems:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Admin]
      summary: List scan problems, grouped
      description: A systemic issue reads as one group, not ten thousand entries (`requirements/scanning.md` §10).
      operationId: adminListScanProblemGroups
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanProblemGroupPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/scan-problems/{groupId}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Admin]
      summary: List the files in a problem group
      operationId: adminListScanProblems
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanProblemPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/missing-tracks:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Admin]
      summary: List missing tracks
      description: With what retains each and when it will be purged (`requirements/scanning.md` §8).
      operationId: adminListMissingTracks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissingTrackPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/missing-tracks/purge:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    post:
      tags: [Admin]
      summary: Purge missing tracks now
      description: History stays readable and statistics unchanged (`requirements/scanning.md` §8.1).
      operationId: adminPurgeMissingTracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackIds:
                  type: array
                  description: Tracks to purge. Omit to purge every missing track.
                  items: { type: string }
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                required: [purged]
                properties:
                  purged: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/duplicates:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [Admin]
      summary: List likely duplicates
      description: Informational only; nothing is merged or hidden (`requirements/scanning.md` §9).
      operationId: adminListDuplicates
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateGroupPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{libraryId}/tracks/{trackId}/file:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [Admin]
      summary: Get a track's file details
      description: The deliberate, narrow route to a storage path, for diagnosing scans (`requirements/tracks.md` §4).
      operationId: adminGetTrackFile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackFile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Admin: plugins ─────────────────────────────
  /admin/plugins:
    get:
      tags: [Admin]
      summary: List installed plugins
      operationId: adminListPlugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: Install a plugin
      description: |
        From an uploaded file or a URL; no restart (`requirements/plugins.md` §5). Installed
        disabled for every library. Settings from a previous install are restored.
      operationId: adminInstallPlugin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '201':
          description: Installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Admin]
      summary: Get a plugin
      operationId: adminGetPlugin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin]
      summary: Uninstall a plugin
      description: Files it wrote stay; content it sourced disappears. Its settings are kept for a reinstall.
      operationId: adminUninstallPlugin
      responses:
        '204': { description: Uninstalled. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/update:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      tags: [Admin]
      summary: Update a plugin
      description: Only ever at the admin's request (`requirements/plugins.md` §5).
      operationId: adminUpdatePlugin
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: Defaults to the URL it was installed from.
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/libraries/{libraryId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - $ref: '#/components/parameters/LibraryId'
    put:
      tags: [Admin]
      summary: Enable or disable a plugin for a library
      description: Disabling is immediate and complete. Re-enabling clears an automatic disable.
      operationId: adminSetPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: libraryId
        in: query
        description: Settings for one library. Omit for the plugin's server-wide defaults.
        schema: { type: string }
    get:
      tags: [Admin]
      summary: Get plugin settings
      description: Secrets are never returned (`requirements/plugins.md` §6).
      operationId: adminGetPluginSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Admin]
      summary: Set plugin settings
      description: Validated by the plugin when entered; invalid values answer `422 plugin_settings_invalid`.
      operationId: adminSetPluginSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{pluginId}/health:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Admin]
      summary: Get plugin timings and failures
      description: Per-operation timings and failure rates, so cost is attributable (`requirements/plugins.md` §2.2, §11).
      operationId: adminGetPluginHealth
      parameters:
        - $ref: '#/components/parameters/OptionalLibraryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginHealth' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque per-device token from login.
    cookieAuth:
      type: apiKey
      in: cookie
      name: jewelcase_session
      description: Set at login for browser clients. State-changing requests must also send `X-Jewelcase-Client`.

  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema: { type: string }
    OptionalLibraryId:
      name: libraryId
      in: query
      description: Limit to one library. Omit for all the caller can access.
      schema: { type: string }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: string }
    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: string }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string }
    MixId:
      name: mixId
      in: path
      required: true
      schema: { type: string }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: A device ID, or `current` for the calling device.
      schema: { type: string }
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema: { type: string }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    ExternalTrackId:
      name: externalTrackId
      in: path
      required: true
      schema: { type: string }
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Since:
      name: since
      in: query
      description: Cursor from the catalog manifest or the previous batch. Omit to start from the beginning.
      schema: { type: string }
    ArtistFilter:
      name: artistId
      in: query
      description: Only items this artist is credited on. See `artistCredit`.
      schema: { type: string }
    ArtistCredit:
      name: artistCredit
      in: query
      description: |
        With `artistId`: `owned` — the artist is among the album's artists; `featured` — credited
        on a track but not an album artist; `any` — either (`requirements/artists.md` §2).
      schema:
        type: string
        enum: [any, owned, featured]
        default: any
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Genre:
      name: genre
      in: query
      description: Tag IDs of type `genre`.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    GenreMatch:
      name: genreMatch
      in: query
      description: Whether items must carry all or any of the given genres.
      schema:
        type: string
        enum: [all, any]
        default: any
    YearFrom:
      name: yearFrom
      in: query
      schema: { type: integer }
    YearTo:
      name: yearTo
      in: query
      schema: { type: integer }
    Availability:
      name: availability
      in: query
      description: Server availability (`requirements/conventions.md` §6). Playability on a device is the client's to filter.
      schema: { $ref: '#/components/schemas/Availability' }
    Played:
      name: played
      in: query
      description: Filter by whether the caller has ever played the item.
      schema:
        type: string
        enum: [never, ever]
    PlayedBefore:
      name: lastPlayedBefore
      in: query
      description: Last played before this time — "not played since".
      schema: { type: string, format: date-time }
    PlayedAfter:
      name: lastPlayedAfter
      in: query
      schema: { type: string, format: date-time }
    MinPlayCount:
      name: minPlayCount
      in: query
      schema: { type: integer, minimum: 0 }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    Period:
      name: period
      in: query
      schema: { $ref: '#/components/schemas/Period' }
    Query:
      name: q
      in: query
      required: true
      description: Search text, from the first character typed.
      schema: { type: string, minLength: 1 }
    SearchTypes:
      name: types
      in: query
      description: Sections to include. Defaults to all.
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/SearchSectionType' }
    Within:
      name: within
      in: query
      description: 'Narrow to a container, as `artist:ID`, `album:ID`, or `playlist:ID` (`requirements/search.md` §5).'
      schema: { type: string, pattern: '^(artist|album|playlist):.+$' }
    ExpandTracks:
      name: expand
      in: query
      description: Include track summaries in each item, for clients that do not hold the catalog.
      schema:
        type: string
        enum: [track]
    ImageSize:
      name: size
      in: query
      description: Longest edge in pixels. The server rounds up to a fixed set of sizes.
      schema: { type: integer, minimum: 16, maximum: 4096 }
    Purpose:
      name: purpose
      in: query
      description: '`download` asks for a complete file of known size; `stream` may use segmented transport.'
      schema:
        type: string
        enum: [stream, download]
        default: stream
    QualityParam:
      name: quality
      in: query
      required: true
      description: The quality the client wants, chosen from its own settings (`requirements/users.md` §6.1).
      schema: { $ref: '#/components/schemas/Quality' }
    Codecs:
      name: codecs
      in: query
      description: Codecs and containers the client can play, most preferred first.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The `ETag` of the cached copy.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated. A repeated key returns the original result without applying twice.
      schema: { type: string, maxLength: 128 }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`not_found` — nonexistent, or out of the caller''s reach.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: '`forbidden` — the caller''s role does not permit this.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The request was understood but not acceptable; see `code` and `errors`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: '`version_conflict` — changed elsewhere since `baseVersion`. Nothing was applied.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`rate_limited` — try again after `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CursorExpired:
      description: '`cursor_expired` — resync from the catalog snapshot.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CapacityExceeded:
      description: '`capacity_exceeded` — the host is full. `detail` explains; admins see why in activity.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SourceUnavailable:
      description: '`source_unavailable` — the plugin or its source is down, disabled, or failing.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SourceTimeout:
      description: '`source_timeout` — the plugin did not answer within its bound.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMedia:
      description: '`unsupported_media` — not an accepted image type.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Image:
      description: The image, format-negotiated by `Accept`.
      headers:
        Cache-Control:
          schema: { type: string }
      content:
        image/*:
          schema: { type: string, format: binary }
    AvatarImage:
      description: The avatar, format-negotiated by `Accept`.
      headers:
        ETag:
          schema: { type: string }
        Cache-Control:
          schema: { type: string, const: no-cache }
      content:
        image/*:
          schema: { type: string, format: binary }
    Audio:
      description: Audio bytes, whole or a range.
      headers:
        Accept-Ranges:
          schema: { type: string, const: bytes }
        Content-Range:
          schema: { type: string }
      content:
        audio/*:
          schema: { type: string, format: binary }

  schemas:
    # ───────────────────────────── Common ─────────────────────────────
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable, safe to show. Never contains credentials or plugin internals.
        code:
          type: string
          enum:
            - unauthenticated
            - session_revoked
            - invalid_credentials
            - rate_limited
            - forbidden
            - not_found
            - validation_failed
            - weak_password
            - breached_password
            - username_taken
            - version_conflict
            - capacity_exceeded
            - cursor_expired
            - setup_required
            - unsupported_media
            - root_overlap
            - root_unavailable
            - device_unavailable
            - not_active_device
            - source_unavailable
            - source_timeout
            - plugin_settings_invalid
        reason:
          type: string
          enum: [credentials_changed, logged_out]
          description: |
            With `session_revoked`. `credentials_changed` — the device keeps its downloads and
            logs in again; `logged_out` — the device removes them (`requirements/offline.md` §9).
        errors:
          type: array
          description: Field-level problems, with `validation_failed` and `plugin_settings_invalid`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: JSON Pointer into the request body. }
              message: { type: string }
        currentVersion:
          type: integer
          description: With `version_conflict`.

    PageInfo:
      type: object
      required: [nextCursor, total]
      properties:
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }

    Id:
      type: string
      description: Opaque, stable identifier.

    CommandId:
      type: string
      format: uuid
      description: Client-generated. Identifies the write for idempotency and seeds the IDs of items it creates.

    PartialDate:
      type: string
      pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
      description: A date at tag precision.

    DurationUs:
      type: integer
      format: int64
      minimum: 0
      description: Microseconds.

    Availability:
      type: string
      enum: [available, missing]

    Period:
      type: string
      enum: [7d, 30d, 90d, 365d, all]
      default: 30d

    EntityType:
      type: string
      enum: [track, album, artist, playlist, tag, mix, library]

    EntityRef:
      type: object
      required: [type, id]
      properties:
        type: { $ref: '#/components/schemas/EntityType' }
        id: { $ref: '#/components/schemas/Id' }

    Playable:
      description: Something that can be queued or added to a playlist — library content or an external track.
      oneOf:
        - $ref: '#/components/schemas/EntityRef'
        - $ref: '#/components/schemas/ExternalTrackRef'

    ImageRef:
      type: object
      required: [id, placeholder]
      properties:
        id:
          type: string
          description: Fetch from `getImage`. Changes whenever the image does.
        placeholder:
          type: string
          x-status: draft
          description: A few bytes, base64, decoding to a recognizable correctly-coloured stand-in (`requirements/offline.md` §1.1).

    ArtistCredit:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: [string, 'null']
          description: '`null` for the unknown artist.'

    Personal:
      type: object
      description: Personal data on an entity (`requirements/conventions.md` §1). Never shared between accounts.
      required: [playCount, lastPlayedAt]
      properties:
        playCount: { type: integer }
        lastPlayedAt: { type: [string, 'null'], format: date-time }

    Reason:
      type: object
      description: Why a recommendation or automatic track is there (`requirements/recommendations.md` §8).
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [becauseYouListened, similarTo, notHeardSince, neverPlayed, anniversary, collaborator, radioSeed, endlessPlay, timeOfDay, decade, mood]
        text:
          type: string
          description: Localized to the account's language, ready to show.
        refs:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        since: { type: string, format: date-time }

    # ───────────────────────────── Server & auth ─────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, failing]

    ServerInfo:
      type: object
      required: [version, apiVersion, setupRequired]
      properties:
        version: { type: string }
        apiVersion: { type: string }
        setupRequired: { type: boolean }

    DeviceType:
      type: string
      enum: [phone, tablet, desktop, web]

    DeviceRegistration:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: A recognizable default, such as "Firefox on Linux", which the user can change.
        type: { $ref: '#/components/schemas/DeviceType' }
        platform: { type: string, description: 'For example `web`, `android`.' }

    SetupRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password }
        displayName: { type: string }
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    Session:
      type: object
      required: [token, user, device]
      properties:
        token:
          type: string
          description: Shown once. Long-lived; idleness never expires it (`requirements/users.md` §4).
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }

    InvitePreview:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }

    InviteRedemption:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, format: password }
        displayName: { type: string }
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    PasswordResetCompletion:
      type: object
      required: [password, device]
      properties:
        password: { type: string, format: password }
        device: { $ref: '#/components/schemas/DeviceRegistration' }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword:
          type: string
          format: password
          description: Minimum strength, no breached passwords, no composition rules, no maximum length (`requirements/users.md` §3.1).

    # ───────────────────────────── Account ─────────────────────────────
    Role:
      type: string
      enum: [owner, admin, user]

    AccountStatus:
      type: string
      enum: [active, suspended]

    User:
      type: object
      required: [id, username, displayName, role, hasAvatar]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        hasAvatar:
          type: boolean
          description: Whether to fetch the avatar image, or show initials without a request.

    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }

    AccountSettings:
      type: object
      description: Follows the person across devices (`requirements/users.md` §6.1).
      properties:
        defaultLibraryId:
          type: [string, 'null']
          description: |
            The library clients open in. Must be one the account can access, or `422`. Reads as
            `null` when unset or when access to it is revoked; clients then open the first
            library in `listLibraries`.
        playback:
          type: object
          properties:
            crossfade:
              type: object
              properties:
                enabled: { type: boolean, default: false }
                durationMs: { type: integer, minimum: 0 }
            normalization:
              type: string
              enum: [off, track, album]
            silenceSkipping: { type: boolean }
            defaultShuffle: { type: boolean }
            defaultRepeat: { $ref: '#/components/schemas/RepeatMode' }
            endlessPlay: { type: boolean }
            manualQueueOnNewContext:
              type: string
              enum: [carryOver, park]
              default: carryOver
              description: '`requirements/queue.md` §6.'
        appearance:
          type: object
          properties:
            theme:
              type: string
              enum: [system, light, dark]
            accentColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            density:
              type: string
              enum: [list, grid]
            language: { type: string, description: BCP 47 tag. }
        recommendations:
          type: object
          properties:
            surfacesEnabled:
              type: boolean
              description: Turning surfaces off leaves radio and endless play working (`requirements/recommendations.md` §11).

    Export:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status:
          type: string
          enum: [pending, running, ready, failed]
        createdAt: { type: string, format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        sizeBytes: { type: [integer, 'null'], format: int64 }

    # ───────────────────────────── Devices ─────────────────────────────
    Device:
      type: object
      description: What the account's active device is playing is in `PlayerState`.
      required: [id, name, type, firstSeenAt, lastSeenAt, connected]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { $ref: '#/components/schemas/DeviceType' }
        platform: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        connected:
          type: boolean
          description: Disconnected devices are shown but cannot be selected (`requirements/realtime.md` §1).
        current:
          type: boolean
          description: Whether this is the calling device. Present only in `/me` responses.

    Quality:
      type: string
      enum: [original, high, medium, low]
      description: '`original` never transcodes. Bitrates for the others are defined by the audio design.'

    # ───────────────────────────── Libraries ─────────────────────────────
    Library:
      type: object
      required: [id, name, trackCount, albumCount, artistCount, durationUs, scanning]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        trackCount: { type: integer }
        albumCount: { type: integer }
        artistCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        scanning:
          type: boolean
          description: Content is still appearing. The library is fully usable either way.

    # ───────────────────────────── Tracks ─────────────────────────────
    AlbumRef:
      type: object
      required: [id, title, artists, image]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: [string, 'null']
          description: '`null` for the unknown album.'
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistCredit' }
        image:
          description: The album's one cover, shown for every track on it (`requirements/albums.md` §5).
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'

    TagRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    TrackSummary:
      type: object
      required: [id, title, artists, album, durationUs, availability, audio, explicit]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          description: Falls back to the filename for untagged files.
        artists:
          type: array
          description: Ordered; the first is primary (`requirements/conventions.md` §7).
          items: { $ref: '#/components/schemas/ArtistCredit' }
        album: { $ref: '#/components/schemas/AlbumRef' }
        discNumber: { type: [integer, 'null'] }
        trackNumber: { type: [integer, 'null'] }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        releaseDate:
          oneOf:
            - $ref: '#/components/schemas/PartialDate'
            - type: 'null'
        genres:
          type: array
          items: { $ref: '#/components/schemas/TagRef' }
        explicit: { type: boolean }
        audio:
          description: Enough to tell a FLAC from an MP3 at a glance (`requirements/tracks.md` §4). The full `Track` extends it.
          allOf:
            - $ref: '#/components/schemas/AudioSummary'
        availability: { $ref: '#/components/schemas/Availability' }
        addedAt: { type: string, format: date-time }
        personal:
          description: The caller's own listening — the viewed account's under `/admin/users/{userId}`. Absent from catalog parts and the library feed.
          allOf:
            - $ref: '#/components/schemas/Personal'

    AudioSummary:
      type: object
      required: [codec, lossless]
      properties:
        codec: { type: string }
        lossless: { type: boolean }

    AudioProperties:
      allOf:
        - $ref: '#/components/schemas/AudioSummary'
        - type: object
          required: [container, sampleRateHz, channels, fileSizeBytes]
          properties:
            container: { type: string }
            bitrateKbps: { type: [integer, 'null'] }
            sampleRateHz: { type: integer }
            bitDepth: { type: [integer, 'null'] }
            channels: { type: integer }
            fileSizeBytes: { type: integer, format: int64 }

    Track:
      allOf:
        - $ref: '#/components/schemas/TrackSummary'
        - type: object
          required: [audio, lyrics, loudness, identifiers]
          properties:
            audio: { $ref: '#/components/schemas/AudioProperties' }
            lyrics:
              type: string
              enum: [none, plain, synced]
            loudness:
              description: |
                Measured by Jewelcase, never read from tags. `null` until analyzed; the track plays
                unnormalized (`requirements/playback.md` §5). Analysis produces loudness and the
                waveform together, so this changing from `null` is also the signal that a waveform
                can now be fetched.
              oneOf:
                - $ref: '#/components/schemas/Loudness'
                - type: 'null'
            identifiers:
              type: object
              description: |
                Identifiers read from tags (`requirements/tracks.md` §6). `isrc` is the one the core
                models. Any other identifier tag — a service's recording or release ID, for example —
                passes through as an extra property keyed by its tag name as read, lowercased. The
                core gives these no meaning and has no dedicated fields for any service; plugins
                interpret them.
              properties:
                isrc: { type: [string, 'null'] }
              additionalProperties: { type: string }

    TrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TrackSummary' }

    Lyrics:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, plain, synced]
          description: Synced lyrics are the primary view where they exist (`requirements/tracks.md` §5).
        lines:
          type: [array, 'null']
          description: With `synced`.
          items:
            type: object
            required: [startMs, text]
            properties:
              startMs: { type: integer }
              text: { type: string }
        plain:
          type: [string, 'null']
          description: Present with `plain`, and with `synced` where a plain version also exists.

    Waveform:
      type: object
      x-status: draft
      required: [pointCount, data]
      description: Deterministic for the same audio, derived from the original file (`requirements/playback.md` §3).
      properties:
        pointCount: { type: integer }
        data:
          type: string
          description: Base64 of one unsigned byte per point, already shaped for legibility.

    Loudness:
      type: object
      description: The client applies gain from these for the user's normalization mode, without clipping.
      required: [trackLufs, trackPeakDbtp, albumLufs, albumPeakDbtp]
      properties:
        trackLufs: { type: number, description: Integrated loudness. }
        trackPeakDbtp: { type: number, description: True peak. }
        albumLufs: { type: [number, 'null'] }
        albumPeakDbtp: { type: [number, 'null'] }

    PlaybackInfo:
      type: object
      x-status: draft
      required: [variant, delivery, codec, container, sampleRateHz, channels, transport]
      description: Exactly what the listener will hear (`requirements/playback.md` §1).
      properties:
        variant:
          type: string
          description: Pass to the audio endpoint.
        delivery:
          type: string
          enum: [direct, transcoded]
        codec: { type: string }
        container: { type: string }
        bitrateKbps: { type: [integer, 'null'] }
        sampleRateHz: { type: integer }
        bitDepth: { type: [integer, 'null'] }
        channels: { type: integer }
        sizeBytes:
          type: [integer, 'null']
          format: int64
          description: Known for direct delivery and for downloads.
        transport:
          type: string
          enum: [progressive, segmented]
          description: Set by the audio-delivery design.
        loudness:
          description: Measured on the original, so it applies to every variant.
          oneOf:
            - $ref: '#/components/schemas/Loudness'
            - type: 'null'
        gapless:
          type: [object, 'null']
          description: Samples to trim so consecutive tracks join exactly (`requirements/playback.md` §4).
          properties:
            leadingSamples: { type: integer }
            trailingSamples: { type: integer }

    # ───────────────────────────── Albums ─────────────────────────────
    AlbumType:
      type: string
      enum: [album, ep, single, compilation]
      description: '`requirements/albums.md` §3.'

    AlbumSummary:
      type: object
      required: [id, title, artists, type, trackCount, trackTotal, discCount, discTotal, durationUs, image, availability]
      description: |
        Completeness has two parts (`requirements/albums.md` §4): tracks missing from discs you
        have (`trackCount` below `trackTotal`), and discs you do not have (`discCount` below
        `discTotal`). Incomplete is information, never an error.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: [string, 'null'] }
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistCredit' }
        releaseDate:
          oneOf:
            - $ref: '#/components/schemas/PartialDate'
            - type: 'null'
        type: { $ref: '#/components/schemas/AlbumType' }
        genres:
          type: array
          items: { $ref: '#/components/schemas/TagRef' }
        trackCount:
          type: integer
          description: |
            Tracks from this album in the library, including any marked missing — those stay in
            position with their own `availability`, so "incomplete" means never had, not lost.
        trackTotal:
          type: [integer, 'null']
          description: |
            Sum of the tagged per-disc totals for the discs present. Track totals are tagged per
            disc, so an absent disc contributes nothing; see `discCount`. `null` when no disc
            present has a tagged total.
        discCount:
          type: integer
          description: Discs with at least one track in the library.
        discTotal:
          type: [integer, 'null']
          description: Tagged total number of discs.
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        availability: { $ref: '#/components/schemas/Availability' }
        addedAt: { type: string, format: date-time }
        personal:
          description: The caller's own listening — the viewed account's under `/admin/users/{userId}`. Absent from catalog parts and the library feed.
          allOf:
            - $ref: '#/components/schemas/Personal'

    Album:
      allOf:
        - $ref: '#/components/schemas/AlbumSummary'
        - type: object
          required: [labels, discs]
          properties:
            labels:
              type: array
              description: Record labels, in tagged order. Empty when untagged.
              items: { type: string }
            discs:
              type: array
              description: |
                Present discs in number order, so disc headings and completeness render before
                tracks arrive; each track's `discNumber` places it (`requirements/albums.md` §4).
              items:
                type: object
                required: [number, trackCount, trackTotal]
                properties:
                  number:
                    type: [integer, 'null']
                    description: '`null` for tracks with no disc tag, grouped as one disc.'
                  trackCount:
                    type: integer
                    description: Tracks from this disc in the library, including any marked missing.
                  trackTotal:
                    type: [integer, 'null']
                    description: Tagged track total for this disc; the scanner resolves tracks that disagree.

    AlbumPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AlbumSummary' }

    # ───────────────────────────── Artists ─────────────────────────────
    ArtistSummary:
      type: object
      required: [id, name, image, albumCount, trackCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: [string, 'null'] }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        albumCount:
          type: integer
          description: Albums the artist owns.
        trackCount:
          type: integer
          description: Owned and featured tracks.
        addedAt: { type: string, format: date-time }
        personal:
          description: The caller's own listening — the viewed account's under `/admin/users/{userId}`. Absent from catalog parts and the library feed.
          allOf:
            - $ref: '#/components/schemas/Personal'

    Artist:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          required: [biography, genres, appearanceCount]
          properties:
            biography:
              type: [string, 'null']
              description: From `artist.txt` (`requirements/scanning.md` §3.3). Usually absent.
            genres:
              type: array
              items: { $ref: '#/components/schemas/TagRef' }
            appearanceCount: { type: integer }

    ArtistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ArtistSummary' }

    # ───────────────────────────── Tags ─────────────────────────────
    TagType:
      type: string
      enum: [genre]
      description: Only `genre` in v1; more types are anticipated (`requirements/tags.md` §2).

    Tag:
      type: object
      required: [id, type, name, trackCount, albumCount, artistCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/TagType' }
        name:
          type: string
          description: The spelling the library uses most (`requirements/tags.md` §4).
        trackCount: { type: integer }
        albumCount: { type: integer }
        artistCount: { type: integer }

    TagPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Tag' }

    # ───────────────────────────── Entity items ─────────────────────────────
    EntityItem:
      type: object
      description: One entity of any type, with the summary for its type set.
      required: [type]
      properties:
        type:
          type: string
          enum: [track, album, artist, playlist, mix]
        track: { $ref: '#/components/schemas/TrackSummary' }
        album: { $ref: '#/components/schemas/AlbumSummary' }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        mix: { $ref: '#/components/schemas/Mix' }

    # ───────────────────────────── Search ─────────────────────────────
    SearchSectionType:
      type: string
      enum: [tracks, albums, artists, playlists, lyrics]

    LyricMatch:
      type: object
      required: [track, line, before, after]
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        line:
          type: object
          required: [text]
          properties:
            text: { type: string }
            startMs: { type: [integer, 'null'] }
        before:
          type: array
          description: Lines of context before the match.
          items: { type: string }
        after:
          type: array
          items: { type: string }

    SearchResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [track, album, artist, playlist, lyric]
        track: { $ref: '#/components/schemas/TrackSummary' }
        album: { $ref: '#/components/schemas/AlbumSummary' }
        artist: { $ref: '#/components/schemas/ArtistSummary' }
        playlist: { $ref: '#/components/schemas/Playlist' }
        lyric: { $ref: '#/components/schemas/LyricMatch' }

    SearchResponse:
      type: object
      required: [query, top, sections, nearMisses, libraryEmpty]
      properties:
        query:
          type: string
          description: Echo of `q`, so a client can discard responses for text no longer in the box (`requirements/search.md` §7).
        top:
          description: The single best match, also present in its section (`requirements/search.md` §4).
          oneOf:
            - $ref: '#/components/schemas/SearchResult'
            - type: 'null'
        sections:
          type: array
          description: Ordered by how well each matches; ties break tracks, then albums, then artists.
          items:
            type: object
            required: [type, items, total]
            properties:
              type: { $ref: '#/components/schemas/SearchSectionType' }
              items:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }
              total: { type: integer }
        nearMisses:
          type: array
          description: Suggested queries when little or nothing matched (`requirements/search.md` §8).
          items: { type: string }
        libraryEmpty:
          type: boolean
          description: Distinguishes "no music yet" from "nothing matches".

    SearchResultPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }

    RecentSearch:
      type: object
      required: [id, query, searchedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        query: { type: string }
        selected:
          description: The result acted on, if any.
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        searchedAt: { type: string, format: date-time }

    RecentSearchCreate:
      type: object
      required: [query]
      properties:
        query: { type: string }
        selected: { $ref: '#/components/schemas/EntityRef' }

    # ───────────────────────────── Playlists ─────────────────────────────
    Playlist:
      type: object
      required: [id, libraryId, title, description, image, trackCount, durationUs, pinned, createdAt, modifiedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        libraryId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: [string, 'null'] }
        image:
          description: Custom, or a mosaic of the tracks inside; `null` for an empty playlist.
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        customImage: { type: boolean }
        trackCount: { type: integer }
        missingCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        pinned: { type: boolean }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        version:
          type: integer
          description: Advances with every change; edits apply only against the version they were made on.
        personal:
          description: The caller's own listening — the viewed account's under `/admin/users/{userId}`. Absent from catalog parts and the library feed.
          allOf:
            - $ref: '#/components/schemas/Personal'

    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Playlist' }

    DeletedPlaylist:
      type: object
      required: [playlist, deletedAt, restorableUntil]
      properties:
        playlist: { $ref: '#/components/schemas/Playlist' }
        deletedAt: { type: string, format: date-time }
        restorableUntil: { type: string, format: date-time }

    PlaylistItem:
      type: object
      required: [itemId]
      description: Exactly one of `track` or `external` is set. A duplicate track is a separate item.
      properties:
        itemId:
          type: string
          description: Identifies this position, stable across reorders.
        track: { $ref: '#/components/schemas/TrackSummary' }
        external: { $ref: '#/components/schemas/ExternalTrack' }
        addedAt: { type: string, format: date-time }

    PlaylistItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PlaylistItem' }

    PlaylistCreate:
      type: object
      required: [createId, title]
      properties:
        createId: { $ref: '#/components/schemas/CommandId' }
        title: { type: string, minLength: 1 }
        description: { type: string }
        items:
          type: array
          description: Albums, artists, and playlists expand to their tracks in order.
          items: { $ref: '#/components/schemas/Playable' }
        fromMix:
          type: string
          description: Save a generated mix as it is now (`requirements/playlists.md` §8). `title` defaults sensibly.

    PlaylistUpdate:
      type: object
      required: [editId, baseVersion]
      properties:
        editId: { $ref: '#/components/schemas/CommandId' }
        baseVersion: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        pinned: { type: boolean }

    PlaylistOp:
      oneOf:
        - type: object
          required: [op, items]
          properties:
            op: { const: add }
            items:
              type: array
              items: { $ref: '#/components/schemas/Playable' }
            before:
              type: [string, 'null']
              description: Insert before this item. `null` appends.
        - type: object
          required: [op, itemIds]
          properties:
            op: { const: remove }
            itemIds:
              type: array
              items: { type: string }
        - type: object
          required: [op, itemIds, before]
          properties:
            op: { const: move }
            itemIds:
              type: array
              description: Any selection, contiguous or not; relative order is preserved.
              items: { type: string }
            before:
              type: [string, 'null']
              description: Move before this item. `null` moves to the end.

    PlaylistEdit:
      type: object
      required: [editId, baseVersion, ops]
      properties:
        editId: { $ref: '#/components/schemas/CommandId' }
        baseVersion: { type: integer }
        ops:
          type: array
          minItems: 1
          description: Applied in order, atomically — all or nothing.
          items: { $ref: '#/components/schemas/PlaylistOp' }

    PlaylistEditResult:
      type: object
      required: [version, trackCount, durationUs]
      properties:
        version: { type: integer }
        trackCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }

    PlaylistImportResult:
      type: object
      required: [playlist, unmatched]
      properties:
        playlist: { $ref: '#/components/schemas/Playlist' }
        unmatched:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              artists:
                type: array
                items: { type: string }
              album: { type: string }

    # ───────────────────────────── Contexts ─────────────────────────────
    Context:
      description: |
        Anything playable as a run of tracks (`requirements/queue.md` Overview). A context
        resolves to the same ordered tracks on the server and in the shared core.
      oneOf:
        - $ref: '#/components/schemas/EntityContext'
        - $ref: '#/components/schemas/ArtistContext'
        - $ref: '#/components/schemas/SearchContext'
        - $ref: '#/components/schemas/FilterContext'
        - $ref: '#/components/schemas/RadioContext'
        - $ref: '#/components/schemas/ExternalContext'
      discriminator:
        propertyName: type
        mapping:
          track: '#/components/schemas/EntityContext'
          album: '#/components/schemas/EntityContext'
          playlist: '#/components/schemas/EntityContext'
          tag: '#/components/schemas/EntityContext'
          mix: '#/components/schemas/EntityContext'
          artist: '#/components/schemas/ArtistContext'
          search: '#/components/schemas/SearchContext'
          filter: '#/components/schemas/FilterContext'
          library: '#/components/schemas/FilterContext'
          radio: '#/components/schemas/RadioContext'
          external: '#/components/schemas/ExternalContext'

    EntityContext:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [track, album, playlist, tag, mix]
        id: { $ref: '#/components/schemas/Id' }

    ArtistContext:
      type: object
      required: [type, id]
      properties:
        type: { const: artist }
        id: { $ref: '#/components/schemas/Id' }
        scope:
          type: string
          enum: [all, discography, appearances, topTracks]
          default: all

    SearchContext:
      type: object
      required: [type, query, section]
      properties:
        type: { const: search }
        query: { type: string }
        section:
          type: string
          enum: [tracks, lyrics]
        within:
          type: string
          pattern: '^(artist|album|playlist):.+$'
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    BrowseFilter:
      type: object
      description: The browse filters, as a value (`requirements/tags.md` §7).
      properties:
        genres:
          type: array
          items: { type: string }
        genreMatch:
          type: string
          enum: [all, any]
        yearFrom: { type: integer }
        yearTo: { type: integer }
        albumTypes:
          type: array
          items: { $ref: '#/components/schemas/AlbumType' }
        availability: { $ref: '#/components/schemas/Availability' }
        played:
          type: string
          enum: [never, ever]
        lastPlayedBefore: { type: string, format: date-time }
        lastPlayedAfter: { type: string, format: date-time }
        minPlayCount: { type: integer }

    FilterContext:
      type: object
      required: [type]
      description: '`filter` is a filtered view; `library` is the whole library. Neither leaves anything behind.'
      properties:
        type:
          type: string
          enum: [filter, library]
        filter: { $ref: '#/components/schemas/BrowseFilter' }
        sort:
          type: object
          properties:
            field: { type: string }
            order:
              type: string
              enum: [asc, desc]

    RadioContext:
      type: object
      required: [type, seed]
      properties:
        type: { const: radio }
        seed:
          description: Track, album, artist, playlist, or genre tag (`requirements/recommendations.md` §4).
          allOf:
            - $ref: '#/components/schemas/EntityRef'

    ExternalContext:
      type: object
      required: [type, sourceId, itemId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        itemId: { type: string }

    ContextSummary:
      type: object
      description: How a context is shown, for history and "playing from".
      required: [context, label]
      properties:
        context: { $ref: '#/components/schemas/Context' }
        label:
          type: string
          description: For example the album title, or "Radio from Björk".

    # ───────────────────────────── Queue ─────────────────────────────
    RepeatMode:
      type: string
      enum: [off, all, one]

    QueueOrigin:
      type: string
      enum: [manual, context, automatic]
      description: '`automatic` marks radio and endless-play additions (`requirements/queue.md` §5).'

    Queue:
      type: object
      required: [id, libraryId, version, context, current, counts, shuffle, repeat, endless, adjusted, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        libraryId: { $ref: '#/components/schemas/Id' }
        version:
          type: integer
          description: Advances with every applied command.
        context:
          oneOf:
            - $ref: '#/components/schemas/ContextSummary'
            - type: 'null'
        current:
          type: [object, 'null']
          required: [itemId, section]
          properties:
            itemId: { type: string }
            section:
              type: string
              enum: [manual, context]
        counts:
          type: object
          required: [manual, context, history]
          properties:
            manual: { type: integer }
            context:
              type: integer
              description: Remaining in the context after the current item.
            history: { type: integer }
        shuffle:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            seed:
              type: [string, 'null']
              description: |
                The seed the shared core shuffles the unplayed context with. Sent because
                clients apply queue commands locally and offline; it yields the same order on
                every device (`requirements/queue.md` §4).
        repeat: { $ref: '#/components/schemas/RepeatMode' }
        endless: { type: boolean }
        adjusted:
          type: boolean
          description: Whether starting a new context will keep this queue (`requirements/queue.md` §6).
        updatedAt: { type: string, format: date-time }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: For kept queues, 30 days after last activity.

    QueueItem:
      type: object
      required: [itemId, origin]
      description: Exactly one of `trackId` or `external` is set.
      properties:
        itemId:
          type: string
          description: |
            Identifies a position, so duplicates are distinct (`requirements/queue.md` §8).
            Context items are derived from their position in the context's original order;
            inserted items from the command that added them.
        trackId: { type: string }
        external: { $ref: '#/components/schemas/ExternalTrackRef' }
        origin: { $ref: '#/components/schemas/QueueOrigin' }
        reason:
          description: With `automatic`.
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
        track:
          description: With `expand=track`.
          allOf:
            - $ref: '#/components/schemas/TrackSummary'

    QueueItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QueueItem' }

    QueueCommand:
      description: A change to the queue, applied locally first and then here.
      oneOf:
        - $ref: '#/components/schemas/PlayContextCommand'
        - $ref: '#/components/schemas/PlayItemCommand'
        - $ref: '#/components/schemas/AddItemsCommand'
        - $ref: '#/components/schemas/MoveItemsCommand'
        - $ref: '#/components/schemas/RemoveItemsCommand'
        - $ref: '#/components/schemas/SetShuffleCommand'
        - $ref: '#/components/schemas/SetRepeatCommand'
        - $ref: '#/components/schemas/SetEndlessCommand'
        - $ref: '#/components/schemas/AddAutomaticCommand'
      discriminator:
        propertyName: type
        mapping:
          addAutomatic: '#/components/schemas/AddAutomaticCommand'
          playContext: '#/components/schemas/PlayContextCommand'
          playItem: '#/components/schemas/PlayItemCommand'
          addNext: '#/components/schemas/AddItemsCommand'
          addLast: '#/components/schemas/AddItemsCommand'
          insert: '#/components/schemas/AddItemsCommand'
          move: '#/components/schemas/MoveItemsCommand'
          remove: '#/components/schemas/RemoveItemsCommand'
          returnToUpNext: '#/components/schemas/MoveItemsCommand'
          setShuffle: '#/components/schemas/SetShuffleCommand'
          setRepeat: '#/components/schemas/SetRepeatCommand'
          setEndless: '#/components/schemas/SetEndlessCommand'

    PlayContextCommand:
      type: object
      required: [type, commandId, libraryId, context]
      description: |
        Play Now. Replaces the queue with a context, keeping the old one if it was adjusted,
        and carrying or parking the Manual Queue per the account's setting (`requirements/queue.md` §6).
      properties:
        type: { const: playContext }
        commandId: { $ref: '#/components/schemas/CommandId' }
        libraryId:
          type: string
          description: The library the new queue belongs to. The context and every item later added must come from it.
        context: { $ref: '#/components/schemas/Context' }
        startIndex:
          type: integer
          description: Position in the context's original order to start from.
        shuffle:
          type: boolean
          description: Defaults to the account's default shuffle.
        shuffleSeed:
          type: string
          description: Client-generated when shuffling, so the order is known before confirmation.
        positionMs: { type: integer, default: 0 }
        deviceId:
          type: string
          description: Device to play on. Defaults to the calling device.

    PlayItemCommand:
      type: object
      required: [type, commandId, itemId]
      description: Jump to an item in Up Next, or play one from History again without disturbing Up Next.
      properties:
        type: { const: playItem }
        commandId: { $ref: '#/components/schemas/CommandId' }
        itemId: { type: string }

    AddItemsCommand:
      type: object
      required: [type, commandId, items]
      description: |
        `addNext` inserts at the front of the Manual Queue, `addLast` at its end, `insert` before
        `before` in either section (`requirements/queue.md` §1, §3). Collections expand to their
        tracks, each separately movable.
      properties:
        type:
          type: string
          enum: [addNext, addLast, insert]
        commandId: { $ref: '#/components/schemas/CommandId' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Playable' }
        before:
          type: [string, 'null']
          description: With `insert`. `null` appends to `section`.
        section:
          type: string
          enum: [manual, context]
          description: With `insert`.

    AddAutomaticCommand:
      type: object
      required: [type, commandId, items]
      description: |
        Radio and endless-play additions to the end of the context, each with its reason.
        Issued by the server online and by a device offline (`requirements/recommendations.md` §10).
      properties:
        type: { const: addAutomatic }
        commandId: { $ref: '#/components/schemas/CommandId' }
        items:
          type: array
          items:
            type: object
            required: [item, reason]
            properties:
              item: { $ref: '#/components/schemas/Playable' }
              reason: { $ref: '#/components/schemas/Reason' }

    MoveItemsCommand:
      type: object
      required: [type, commandId, itemIds]
      description: |
        `move` places items before `before`, within or across the Manual Queue and context.
        `returnToUpNext` moves items from History back to the front of Up Next.
      properties:
        type:
          type: string
          enum: [move, returnToUpNext]
        commandId: { $ref: '#/components/schemas/CommandId' }
        itemIds:
          type: array
          items: { type: string }
        before:
          type: [string, 'null']
          description: With `move`. `null` moves to the end of `section`.
        section:
          type: string
          enum: [manual, context]

    RemoveItemsCommand:
      type: object
      required: [type, commandId, itemIds]
      properties:
        type: { const: remove }
        commandId: { $ref: '#/components/schemas/CommandId' }
        itemIds:
          type: array
          description: From Up Next or History.
          items: { type: string }

    SetShuffleCommand:
      type: object
      required: [type, commandId, enabled]
      description: Shuffles only the unplayed context; turning it off resumes from the current track's natural position.
      properties:
        type: { const: setShuffle }
        commandId: { $ref: '#/components/schemas/CommandId' }
        enabled: { type: boolean }
        seed:
          type: string
          description: Required when enabling. Client-generated.

    SetRepeatCommand:
      type: object
      required: [type, commandId, mode]
      properties:
        type: { const: setRepeat }
        commandId: { $ref: '#/components/schemas/CommandId' }
        mode: { $ref: '#/components/schemas/RepeatMode' }

    SetEndlessCommand:
      type: object
      required: [type, commandId, enabled]
      properties:
        type: { const: setEndless }
        commandId: { $ref: '#/components/schemas/CommandId' }
        enabled: { type: boolean }

    # ───────────────────────────── Player ─────────────────────────────
    PlayerState:
      type: object
      required: [status, activeDeviceId, itemId, positionMs, positionAt]
      properties:
        status:
          type: string
          enum: [playing, paused, stopped]
        activeDeviceId:
          type: [string, 'null']
          description: |
            The one device holding playback for the account, playing or paused
            (`requirements/realtime.md` §2). `null` when stopped or before anything has played.
            The single source of truth for which device is active.
        itemId:
          type: [string, 'null']
          description: The queue item playing.
        trackId: { type: [string, 'null'] }
        external:
          oneOf:
            - $ref: '#/components/schemas/ExternalTrackRef'
            - type: 'null'
        positionMs: { type: integer }
        positionAt:
          type: string
          format: date-time
          description: Server time at which `positionMs` was true. While playing, clients extrapolate from it, so position never drifts.
        volume:
          type: [number, 'null']
          description: The active device's volume, as it last reported. Changed with `setVolume`.

    PlayerCommand:
      description: Transport control, targeting any of the caller's devices. Last command wins.
      oneOf:
        - $ref: '#/components/schemas/TransportCommand'
        - $ref: '#/components/schemas/SeekCommand'
        - $ref: '#/components/schemas/VolumeCommand'
        - $ref: '#/components/schemas/TransferCommand'
      discriminator:
        propertyName: type
        mapping:
          play: '#/components/schemas/TransportCommand'
          pause: '#/components/schemas/TransportCommand'
          next: '#/components/schemas/TransportCommand'
          previous: '#/components/schemas/TransportCommand'
          seek: '#/components/schemas/SeekCommand'
          setVolume: '#/components/schemas/VolumeCommand'
          transfer: '#/components/schemas/TransferCommand'

    TransportCommand:
      type: object
      required: [type, commandId]
      description: '`play` sent to an idle connected device wakes it with the current queue (`requirements/realtime.md` §3).'
      properties:
        type:
          type: string
          enum: [play, pause, next, previous]
        commandId: { $ref: '#/components/schemas/CommandId' }
        deviceId:
          type: string
          description: Target device. Defaults to the active device.

    SeekCommand:
      type: object
      required: [type, commandId, positionMs]
      properties:
        type: { const: seek }
        commandId: { $ref: '#/components/schemas/CommandId' }
        positionMs: { type: integer, minimum: 0 }

    VolumeCommand:
      type: object
      required: [type, commandId, deviceId, volume]
      description: Volume belongs to the device (`requirements/realtime.md` §3). The target applies it locally and confirms with a `commandResult`.
      properties:
        type: { const: setVolume }
        commandId: { $ref: '#/components/schemas/CommandId' }
        deviceId: { type: string }
        volume: { type: number, minimum: 0, maximum: 1 }

    TransferCommand:
      type: object
      required: [type, commandId, deviceId]
      description: Shift — move playback to another device at the same track, position, and queue.
      properties:
        type: { const: transfer }
        commandId: { $ref: '#/components/schemas/CommandId' }
        deviceId: { type: string }
        play:
          type: boolean
          default: true
          description: Continue playing on arrival, or arrive paused.

    CommandResult:
      type: object
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/CommandId' }
        status:
          type: string
          enum: [pending, applied, failed]
          description: '`pending` until the target device confirms. A failure is always reported (`requirements/realtime.md` §5).'
        reason: { type: [string, 'null'] }

    ProgressReport:
      type: object
      required: [deviceId, itemId, status, positionMs, at]
      properties:
        deviceId: { type: string }
        itemId: { type: string }
        status:
          type: string
          enum: [playing, paused, stopped, buffering]
        positionMs: { type: integer }
        volume:
          type: number
          minimum: 0
          maximum: 1
          description: The device's current volume, so remote controls show it (`requirements/realtime.md` §3).
        at: { type: string, format: date-time }

    PlaybackFailureReport:
      type: object
      required: [libraryId, kind, attempts, at]
      properties:
        libraryId: { type: string }
        trackId: { type: string }
        external: { $ref: '#/components/schemas/ExternalTrackRef' }
        kind:
          type: string
          enum: [network, server, decode, unreadable]
        attempts: { type: integer }
        detail: { type: string }
        at: { type: string, format: date-time }

    # ───────────────────────────── Listening ─────────────────────────────
    PlayReport:
      type: object
      required: [playId, libraryId, startedAt, listenTimeMs, context, origin, deviceId]
      description: |
        Every track that starts is a play; `listenTimeMs` is audio actually heard
        (`requirements/analytics.md` §1). Exactly one of `trackId` or `external` is set.
      properties:
        playId:
          type: string
          format: uuid
          description: Client-generated on start. Later reports for the same play update it.
        libraryId: { type: string }
        trackId: { type: string }
        external: { $ref: '#/components/schemas/ExternalTrackRef' }
        startedAt:
          type: string
          format: date-time
          description: When it happened, never when it synced.
        listenTimeMs:
          type: integer
          minimum: 0
          description: Cumulative. May exceed the duration when parts were replayed.
        end:
          type: [string, 'null']
          enum: [finished, skipped, stopped, null]
          description: '`null` while still playing.'
        context: { $ref: '#/components/schemas/Context' }
        origin: { $ref: '#/components/schemas/QueueOrigin' }
        reason:
          description: With `automatic` — why radio or endless play chose it.
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
        deviceId: { type: string }

    HistoryEntry:
      type: object
      required: [playId, libraryId, startedAt, listenTimeMs, end, context, origin, device, snapshot, availability]
      properties:
        playId: { type: string, format: uuid }
        libraryId: { type: string }
        startedAt: { type: string, format: date-time }
        listenTimeMs: { type: integer }
        end:
          type: [string, 'null']
          enum: [finished, skipped, stopped, null]
        context: { $ref: '#/components/schemas/ContextSummary' }
        origin: { $ref: '#/components/schemas/QueueOrigin' }
        reason:
          oneOf:
            - $ref: '#/components/schemas/Reason'
            - type: 'null'
        device:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        trackId:
          type: [string, 'null']
          description: '`null` once the track has been purged.'
        external:
          oneOf:
            - $ref: '#/components/schemas/ExternalTrackRef'
            - type: 'null'
        snapshot:
          type: object
          description: |
            Title, artists, and album — current if the track still exists, as last known if
            purged — so history survives its tracks (`requirements/analytics.md` §8).
          required: [title, artists, album]
          properties:
            title: { type: string }
            artists:
              type: array
              items: { type: string }
            album: { type: [string, 'null'] }
        availability:
          type: string
          enum: [available, missing, removed, external]

    HistoryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/HistoryEntry' }

    TopItem:
      type: object
      required: [rank, entity, playCount, listenTimeMs, completion]
      properties:
        rank: { type: integer }
        entity:
          description: A track, album, artist, genre tag, or external track.
          oneOf:
            - $ref: '#/components/schemas/EntityItem'
            - type: object
              required: [type, tag]
              properties:
                type: { const: tag }
                tag: { $ref: '#/components/schemas/TagRef' }
            - type: object
              required: [type, external]
              description: External content, marked as such (`requirements/plugins.md` §10.2).
              properties:
                type: { const: external }
                external: { $ref: '#/components/schemas/ExternalTrack' }
        playCount: { type: integer }
        listenTimeMs: { type: integer, format: int64 }
        completion:
          type: number
          description: Listen time over possible listen time; above 1 means parts were replayed (`requirements/analytics.md` §2).

    Stats:
      type: object
      required: [period, listenTimeMs, previousListenTimeMs, playCount, top, timeOfDay, dayOfWeek, rediscovery]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        libraryId: { type: [string, 'null'] }
        listenTimeMs: { type: integer, format: int64 }
        previousListenTimeMs:
          type: [integer, 'null']
          format: int64
          description: The preceding period of equal length, for the trend. `null` for `all`.
        playCount: { type: integer }
        top:
          type: object
          description: The first few of each; the full lists are `getTopList`.
          required: [tracks, albums, artists, genres]
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            albums:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            artists:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            genres:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
        timeOfDay:
          type: array
          description: Listen time per hour of the day, 0–23, in the account's time zone.
          minItems: 24
          maxItems: 24
          items: { type: integer, format: int64 }
        dayOfWeek:
          type: array
          description: Listen time per weekday, Monday first.
          minItems: 7
          maxItems: 7
          items: { type: integer, format: int64 }
        rediscovery:
          type: object
          required: [firstHeard, longUnplayed]
          properties:
            firstHeard:
              type: array
              description: First heard in this period.
              items: { $ref: '#/components/schemas/EntityItem' }
            longUnplayed:
              type: array
              items: { $ref: '#/components/schemas/EntityItem' }

    EntityStats:
      type: object
      required: [entity, playCount, listenTimeMs, completion, firstPlayedAt, lastPlayedAt, periods]
      properties:
        entity: { $ref: '#/components/schemas/EntityRef' }
        playCount: { type: integer }
        listenTimeMs: { type: integer, format: int64 }
        completion: { type: [number, 'null'] }
        firstPlayedAt: { type: [string, 'null'], format: date-time }
        lastPlayedAt: { type: [string, 'null'], format: date-time }
        periods:
          type: object
          description: Play count and listen time per period.
          additionalProperties:
            type: object
            properties:
              playCount: { type: integer }
              listenTimeMs: { type: integer, format: int64 }

    PeriodSummary:
      type: object
      required: [from, to, listenTimeMs, playCount, top, favouriteYears, favouriteDecades, comparison, standouts]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        libraryId: { type: [string, 'null'] }
        listenTimeMs: { type: integer, format: int64 }
        playCount: { type: integer }
        top:
          type: object
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            albums:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            artists:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
            genres:
              type: array
              items: { $ref: '#/components/schemas/TopItem' }
        favouriteYears:
          type: array
          items:
            type: object
            properties:
              year: { type: integer }
              listenTimeMs: { type: integer, format: int64 }
        favouriteDecades:
          type: array
          items:
            type: object
            properties:
              decade: { type: integer, description: 'For example `1970`.' }
              listenTimeMs: { type: integer, format: int64 }
        comparison:
          type: object
          description: Against the preceding period of equal length.
          properties:
            previousListenTimeMs: { type: integer, format: int64 }
            arrived:
              type: array
              description: Artists prominent now and not before.
              items: { $ref: '#/components/schemas/ArtistSummary' }
            fellAway:
              type: array
              items: { $ref: '#/components/schemas/ArtistSummary' }
        standouts:
          type: object
          properties:
            mostRepeatedTrack:
              oneOf:
                - $ref: '#/components/schemas/TopItem'
                - type: 'null'
            biggestDay:
              type: [object, 'null']
              properties:
                date: { type: string, format: date }
                listenTimeMs: { type: integer, format: int64 }
            breakoutArtist:
              oneOf:
                - $ref: '#/components/schemas/ArtistSummary'
                - type: 'null'

    # ───────────────────────────── Recommendations ─────────────────────────────
    Recommendation:
      type: object
      required: [item, reason]
      properties:
        item: { $ref: '#/components/schemas/EntityItem' }
        reason: { $ref: '#/components/schemas/Reason' }

    RecommendationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Empty when nothing is genuinely similar.
          items: { $ref: '#/components/schemas/Recommendation' }

    RecommendationSurface:
      type: object
      required: [id, kind, title, items]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [mixes, becauseYouListened, similarTo, rediscovery, neverHeard, anniversary, timeOfDay]
        title: { type: string }
        reason: { $ref: '#/components/schemas/Reason' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }

    Rediscovery:
      type: object
      required: [lovedOnce, neverHeard, anniversary]
      properties:
        lovedOnce:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        neverHeard:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        anniversary:
          type: array
          description: What the user was listening to a year ago.
          items: { $ref: '#/components/schemas/Recommendation' }

    Mix:
      type: object
      required: [id, libraryId, title, reason, image, trackCount, durationUs, generatedAt, refreshesAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        libraryId: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          description: Named for what it is, never "Mix 3".
        reason: { $ref: '#/components/schemas/Reason' }
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageRef'
            - type: 'null'
        trackCount: { type: integer }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        generatedAt: { type: string, format: date-time }
        refreshesAt:
          type: string
          format: date-time
          description: When it will be replaced. Saving it is how a user keeps it.

    # ───────────────────────────── Downloads ─────────────────────────────
    DownloadState:
      type: string
      enum: [queued, downloading, downloaded, partial, incomplete]
      description: |
        One vocabulary everywhere (`requirements/offline.md` §10). `incomplete` is a standing
        download that cannot grow, with `incompleteReason` saying why.

    Download:
      type: object
      required: [id, deviceId, libraryId, entity, label, quality, state, trackCount, downloadedCount, totalBytes, downloadedBytes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        deviceId: { type: string }
        libraryId: { type: string }
        entity:
          description: A track, album, artist, playlist, or library.
          allOf:
            - $ref: '#/components/schemas/EntityRef'
        label: { type: string }
        quality: { $ref: '#/components/schemas/Quality' }
        state: { $ref: '#/components/schemas/DownloadState' }
        incompleteReason:
          type: [string, 'null']
          enum: [storage_budget, platform_limit, null]
        trackCount: { type: integer }
        downloadedCount: { type: integer }
        totalBytes: { type: integer, format: int64 }
        downloadedBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    DownloadCreate:
      type: object
      required: [libraryId, entity, quality]
      properties:
        libraryId: { type: string }
        entity: { $ref: '#/components/schemas/EntityRef' }
        quality:
          allOf:
            - $ref: '#/components/schemas/Quality'
          description: The device's download quality. Fixed for this download until re-fetched.

    DownloadTrack:
      type: object
      required: [trackId, variant, sizeBytes, state]
      properties:
        trackId: { type: string }
        variant:
          type: string
          description: Pass to the audio endpoint. Stays the same until the audio changes or the user re-fetches.
        sizeBytes: { type: integer, format: int64 }
        state:
          type: string
          enum: [queued, downloading, downloaded, failed]

    DownloadTrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DownloadTrack' }

    DownloadStatusReport:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          description: Tracks whose state changed since the last report.
          items:
            type: object
            required: [trackId, state]
            properties:
              trackId: { type: string }
              state:
                type: string
                enum: [queued, downloading, downloaded, failed]
              downloadedBytes: { type: integer, format: int64 }
        incompleteReason:
          type: [string, 'null']
          enum: [storage_budget, platform_limit, null]

    DownloadEstimateRequest:
      type: object
      required: [entities, quality]
      properties:
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        quality: { $ref: '#/components/schemas/Quality' }
        deviceId:
          type: string
          description: Device whose existing downloads are excluded from `newBytes`. Defaults to the caller.

    DownloadEstimate:
      type: object
      required: [trackCount, totalBytes, newBytes]
      properties:
        trackCount: { type: integer }
        totalBytes: { type: integer, format: int64 }
        newBytes:
          type: integer
          format: int64
          description: Excluding tracks the device already holds.

    # ───────────────────────────── Sync ─────────────────────────────
    CatalogManifest:
      type: object
      x-status: draft
      required: [libraryId, cursor, generatedAt, parts]
      properties:
        libraryId: { type: string }
        cursor:
          type: string
          description: Library-feed position the snapshot is consistent with.
        generatedAt: { type: string, format: date-time }
        parts:
          type: array
          description: Fetch in order; each is usable on arrival, so a partially synced device is fully usable.
          items:
            type: object
            required: [id, kind, sizeBytes]
            properties:
              id: { type: string }
              kind:
                type: string
                enum: [artists, albums, tracks, tags, placeholders, similarity]
              sizeBytes: { type: integer, format: int64 }

    CatalogPart:
      type: object
      x-status: draft
      required: [id, kind, items]
      properties:
        id: { type: string }
        kind: { type: string }
        items:
          type: array
          description: |
            Summaries of `kind`, including the sort keys the shared core computed at scan time
            and, for tracks, `loudness`. Content only — never `personal`, since every account with
            access shares the catalog.
          items: { type: object }

    Change:
      type: object
      required: [cursor, entity, op, id]
      properties:
        cursor: { type: string }
        entity:
          type: string
          enum: [library, track, album, artist, tag, playlist, playlistItems, queue, keptQueue, play, personal, accountSettings, device, download, mix, recommendations, recentSearch]
        op:
          type: string
          enum: [upsert, delete]
        id: { type: string }
        data:
          type: object
          description: |
            With `upsert`, the entity's current representation — the summary schema for its
            type, without `personal` in the library feed. `personal` (account feed only) is
            `{ entity, playCount, lastPlayedAt }` for an `EntityRef`, so a device can sort and
            filter by listening offline. `queue` and `playlistItems` carry current state plus, when cheap, how it got
            there, so a small change stays a small update (`requirements/realtime.md` §4):
            `{ state, fromVersion, commands }` — `state` is the `Queue` or `Playlist`; `commands`
            are the `QueueCommand`s or `PlaylistEdit`s from `fromVersion` to `state.version`, or
            `null` when the client should refetch items instead. A client holding `fromVersion`
            replays them through the shared core; any other client refetches.

    ChangeBatch:
      type: object
      required: [changes, cursor, hasMore]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        cursor:
          type: string
          description: Pass as `since` next time.
        hasMore: { type: boolean }

    # ───────────────────────────── External ─────────────────────────────
    ExternalTrackRef:
      type: object
      required: [type, sourceId, externalId]
      properties:
        type: { const: external }
        sourceId: { type: string }
        externalId: { type: string }

    ExternalSource:
      type: object
      required: [id, pluginId, name, status]
      properties:
        id: { type: string }
        pluginId: { type: string }
        name:
          type: string
          description: Shown as the label on everything from this source (`requirements/plugins.md` §10.1).
        status:
          type: string
          enum: [available, unavailable]
        statusDetail: { type: [string, 'null'] }

    ExternalTrack:
      type: object
      required: [sourceId, externalId, title, artists, durationUs]
      description: Always shown as external and labelled with its source. Never downloadable.
      properties:
        sourceId: { type: string }
        externalId: { type: string }
        title: { type: string }
        artists:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              itemId: { type: [string, 'null'], description: Browsable within the source. }
        album:
          type: [object, 'null']
          properties:
            title: { type: string }
            itemId: { type: [string, 'null'] }
        durationUs: { $ref: '#/components/schemas/DurationUs' }
        imageId:
          type: [string, 'null']
          description: Fetch from `getExternalImage`.
        availability:
          type: string
          enum: [available, unavailable]

    ExternalItem:
      type: object
      required: [sourceId, itemId, kind, title]
      properties:
        sourceId: { type: string }
        itemId: { type: string }
        kind:
          type: string
          enum: [artist, album, playlist, collection]
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        imageId: { type: [string, 'null'] }
        children:
          type: array
          items: { $ref: '#/components/schemas/ExternalItem' }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/ExternalTrack' }
        nextCursor: { type: [string, 'null'] }

    ExternalSearchResponse:
      type: object
      required: [sourceId, query, tracks, items]
      properties:
        sourceId: { type: string }
        query: { type: string }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/ExternalTrack' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ExternalItem' }

    # ───────────────────────────── Extensions ─────────────────────────────
    ExtensionSurface:
      type: object
      x-status: draft
      required: [pluginId, surfaceId, placement, title]
      properties:
        pluginId: { type: string }
        surfaceId: { type: string }
        placement:
          type: string
          enum: [page, entitySection, entityAction, settings]
        entityTypes:
          type: array
          description: For entity sections and actions, the entity types it appears on.
          items: { $ref: '#/components/schemas/EntityType' }
        title: { type: string }

    ExtensionContent:
      type: object
      x-status: draft
      required: [blocks]
      description: A declarative description the client renders with its own components, on every platform.
      properties:
        blocks:
          type: array
          items: { type: object }

    ExtensionActionRequest:
      type: object
      x-status: draft
      properties:
        target: { $ref: '#/components/schemas/EntityRef' }
        input: { type: object }

    # ───────────────────────────── Plugins ─────────────────────────────
    PluginSettings:
      type: object
      required: [schema, values, secretsSet]
      properties:
        schema:
          type: object
          description: JSON Schema the plugin declares for its settings, so every plugin is configured the same way.
        values:
          type: object
          description: Current values, secrets omitted.
        secretsSet:
          type: array
          description: Names of secret fields that have a value. Their values are never returned.
          items: { type: string }

    PluginSettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Omitted secret fields keep their stored value; `null` clears one.

    Plugin:
      type: object
      required: [id, name, version, apiVersion, source, installedAt, libraries]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        apiVersion: { type: string }
        description: { type: string }
        author: { type: string }
        homepage: { type: string, format: uri }
        source:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [file, url]
            url: { type: string, format: uri }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        libraries:
          type: array
          items:
            type: object
            required: [libraryId, enabled, autoDisabled]
            properties:
              libraryId: { type: string }
              enabled: { type: boolean }
              autoDisabled:
                type: boolean
                description: Disabled by the server after repeated failures (`requirements/plugins.md` §11).
              disabledReason: { type: [string, 'null'] }

    PluginHealth:
      type: object
      required: [pluginId, window, operations, recentFailures]
      properties:
        pluginId: { type: string }
        window: { type: string, description: 'For example `24h`.' }
        operations:
          type: array
          items:
            type: object
            required: [operation, calls, p50Ms, p95Ms, p99Ms, failureRate, timeouts]
            properties:
              operation: { type: string }
              calls: { type: integer }
              p50Ms: { type: number }
              p95Ms: { type: number }
              p99Ms: { type: number }
              failureRate: { type: number }
              timeouts: { type: integer }
        recentFailures:
          type: array
          items:
            type: object
            required: [at, kind, message]
            properties:
              at: { type: string, format: date-time }
              libraryId: { type: [string, 'null'] }
              operation: { type: string }
              kind:
                type: string
                enum: [crash, timeout, error]
              message: { type: string }

    # ───────────────────────────── Admin ─────────────────────────────
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [status, libraryIds, createdAt, lastSeenAt, deviceCount]
          properties:
            status: { $ref: '#/components/schemas/AccountStatus' }
            libraryIds:
              type: array
              description: Explicit grants. Admins and the owner reach every library implicitly.
              items: { type: string }
            createdAt: { type: string, format: date-time }
            lastSeenAt: { type: [string, 'null'], format: date-time }
            deviceCount: { type: integer }

    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }

    AdminDevice:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, username]
              properties:
                id: { type: string }
                username: { type: string }

    AdminDevicePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminDevice' }

    LibraryAccessChange:
      type: object
      required: [userIds, libraryIds, action]
      properties:
        userIds:
          type: array
          items: { type: string }
        libraryIds:
          type: array
          items: { type: string }
        action:
          type: string
          enum: [grant, revoke]

    PasswordResetLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, createdBy, createdAt, expiresAt, maxUses, uses, libraryIds, status]
      properties:
        id: { type: string }
        createdBy:
          type: object
          required: [id, username]
          properties:
            id: { type: string }
            username: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1 }
        uses: { type: integer }
        libraryIds:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [pending, redeemed, revoked, expired]

    CreatedInvite:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: Shown only at creation.

    InvitePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Invite' }

    InviteCreate:
      type: object
      properties:
        libraryIds:
          type: array
          description: Access the new account starts with.
          items: { type: string }
        maxUses: { type: integer, minimum: 1, default: 1 }
        expiresInHours: { type: integer, minimum: 1, default: 168 }

    LoginAttempt:
      type: object
      required: [at, usernameAttempted, origin, succeeded]
      properties:
        at: { type: string, format: date-time }
        userId:
          type: [string, 'null']
          description: The account the username belongs to, if any.
        usernameAttempted: { type: string }
        origin: { type: string, description: 'Client address, as seen through trusted proxies.' }
        succeeded: { type: boolean }
        lockedOut: { type: boolean }

    LoginAttemptPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LoginAttempt' }

    AuditEntry:
      type: object
      required: [id, at, actor, action]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, username]
          properties:
            id: { type: string }
            username: { type: string }
        action:
          type: string
          description: 'For example `user.suspend`, `library.grant`, `password.reset_issued`.'
        targetUserId: { type: [string, 'null'] }
        detail: { type: object }

    AuditEntryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditEntry' }

    Activity:
      type: object
      required: [listeners, streams, capacity, background]
      properties:
        listeners:
          type: array
          items:
            type: object
            required: [userId, username, deviceId, deviceName, delivery]
            properties:
              userId: { type: string }
              username: { type: string }
              deviceId: { type: string }
              deviceName: { type: string }
              libraryId: { type: string }
              trackId: { type: [string, 'null'] }
              delivery:
                type: string
                enum: [direct, transcoded, external]
              bitrateKbps: { type: [integer, 'null'] }
              startedAt: { type: string, format: date-time }
        streams:
          type: object
          required: [direct, transcoded]
          properties:
            direct: { type: integer }
            transcoded: { type: integer }
        capacity:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [available, constrained, full]
            limitedBy:
              type: [string, 'null']
              enum: [cpu, memory, disk, network, null]
            refusedLastHour: { type: integer }
        background:
          type: object
          properties:
            scanningLibraryIds:
              type: array
              items: { type: string }
            analysis:
              type: object
              properties:
                pending: { type: integer }
                yielding:
                  type: boolean
                  description: Paused to make room for listeners.
            jobsRunning: { type: integer }

    PlaybackFailure:
      type: object
      required: [kind, count, firstAt, lastAt, users]
      properties:
        libraryId: { type: string }
        trackId: { type: [string, 'null'] }
        kind:
          type: string
          enum: [network, server, decode, unreadable]
        count: { type: integer }
        users: { type: integer }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }

    PlaybackFailurePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PlaybackFailure' }

    DirectoryListing:
      type: object
      required: [path, directories]
      properties:
        path: { type: string }
        parent: { type: [string, 'null'] }
        directories:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }

    LibraryRoot:
      type: object
      required: [id, path, status]
      properties:
        id: { type: string }
        path: { type: string }
        status:
          type: string
          enum: [available, unavailable]
          description: An unavailable root suspends scanning and leaves the index intact (`requirements/scanning.md` §7).

    LibraryHealth:
      type: object
      required: [trackCount, totalSizeBytes, lastScanAt, scanState, unavailableRoots, missingTracks, scanProblems, analysis]
      properties:
        trackCount: { type: integer }
        totalSizeBytes: { type: integer, format: int64 }
        lastScanAt: { type: [string, 'null'], format: date-time }
        scanState:
          type: string
          enum: [idle, scanning, suspended]
        unavailableRoots: { type: integer }
        missingTracks: { type: integer }
        scanProblems: { type: integer }
        duplicateGroups: { type: integer }
        analysis:
          type: object
          required: [analyzed, total]
          properties:
            analyzed: { type: integer }
            total: { type: integer }

    AdminLibrary:
      type: object
      required: [id, name, roots, excludes, watch, scanIntervalMinutes, health, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        roots:
          type: array
          items: { $ref: '#/components/schemas/LibraryRoot' }
        excludes:
          type: array
          description: Glob patterns relative to each root.
          items: { type: string }
        watch:
          type: boolean
          description: Live filesystem watching.
        scanIntervalMinutes:
          type: [integer, 'null']
          description: Scheduled reconciliation. `null` disables it.
        health: { $ref: '#/components/schemas/LibraryHealth' }
        createdAt: { type: string, format: date-time }

    LibraryCreate:
      type: object
      required: [name, roots]
      properties:
        name: { type: string, minLength: 1 }
        roots:
          type: array
          minItems: 1
          items: { type: string, description: Absolute path inside the container. }
        excludes:
          type: array
          items: { type: string }
        watch: { type: boolean, default: true }
        scanIntervalMinutes: { type: [integer, 'null'], default: 1440 }

    LibraryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        roots:
          type: array
          description: |
            The complete set. An entry with an existing `id` and a new `path` repoints that
            root; one without `id` adds a root; an omitted root is removed.
          items:
            type: object
            required: [path]
            properties:
              id: { type: string }
              path: { type: string }
        excludes:
          type: array
          items: { type: string }
        watch: { type: boolean }
        scanIntervalMinutes: { type: [integer, 'null'] }

    Scan:
      type: object
      required: [id, libraryId, trigger, state, progress]
      properties:
        id: { type: string }
        libraryId: { type: string }
        trigger:
          type: string
          enum: [initial, watch, scheduled, manual, reconfigure, restore]
        path:
          type: [string, 'null']
          description: Folder scope of a manual scan.
        state:
          type: string
          enum: [queued, running, completed, cancelled, suspended]
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        progress:
          type: object
          required: [filesSeen, filesProcessed, added, updated, missing, problems]
          properties:
            filesSeen: { type: integer }
            filesProcessed: { type: integer }
            added: { type: integer }
            updated: { type: integer }
            moved: { type: integer }
            missing: { type: integer }
            problems: { type: integer }
            currentPath: { type: [string, 'null'] }

    ScanPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Scan' }

    ScanProblemGroup:
      type: object
      required: [id, kind, summary, count, firstSeenAt, lastSeenAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [unreadable, permissionDenied, malformedTags, unsupportedEncoding, corruptAudio]
        summary: { type: string }
        count: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    ScanProblemGroupPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ScanProblemGroup' }

    ScanProblem:
      type: object
      required: [path, detail, seenAt]
      properties:
        path: { type: string }
        detail: { type: string }
        seenAt: { type: string, format: date-time }

    ScanProblemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ScanProblem' }

    MissingTrack:
      type: object
      required: [track, path, missingSince, playlistReferences, purgeAt]
      properties:
        track: { $ref: '#/components/schemas/TrackSummary' }
        path: { type: string }
        missingSince: { type: string, format: date-time }
        playlistReferences:
          type: integer
          description: Any reference retains the track indefinitely (`requirements/scanning.md` §8).
        purgeAt:
          type: [string, 'null']
          format: date-time
          description: '`null` while retained by a playlist.'

    MissingTrackPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MissingTrack' }

    DuplicateGroup:
      type: object
      required: [id, reason, tracks]
      properties:
        id: { type: string }
        reason:
          type: string
          enum: [matchingTags, matchingContent, albumUnderTwoPaths]
        tracks:
          type: array
          items:
            type: object
            required: [track, path]
            properties:
              track: { $ref: '#/components/schemas/TrackSummary' }
              path: { type: string }

    DuplicateGroupPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DuplicateGroup' }

    TrackFile:
      type: object
      required: [trackId, rootId, path, sizeBytes, modifiedAt]
      properties:
        trackId: { type: string }
        rootId: { type: string }
        path:
          type: string
          description: Relative to the root.
        sizeBytes: { type: integer, format: int64 }
        modifiedAt: { type: string, format: date-time }
        sidecars:
          type: object
          description: The sidecar files this track resolved to (`requirements/scanning.md` §3).
          properties:
            cover: { type: [string, 'null'] }
            lyrics: { type: [string, 'null'] }
            artistImage: { type: [string, 'null'] }
            artistBiography: { type: [string, 'null'] }

    # ───────────────────────────── Realtime ─────────────────────────────
    RealtimeClientMessage:
      description: A message a client sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, token]
          description: First message, for clients not using the session cookie.
          properties:
            type: { const: auth }
            token: { type: string }
        - type: object
          required: [type, command]
          properties:
            type: { const: queueCommand }
            command: { $ref: '#/components/schemas/QueueCommand' }
        - type: object
          required: [type, command]
          properties:
            type: { const: playerCommand }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, report]
          description: From the playing device.
          properties:
            type: { const: progress }
            report: { $ref: '#/components/schemas/ProgressReport' }
        - type: object
          required: [type, result]
          description: From a target device, reporting whether it carried out a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type, topics]
          description: Admin views that update live. Admin role required.
          properties:
            type: { const: subscribe }
            topics:
              type: array
              items:
                type: string
                enum: [activity, scans, plugins]
        - type: object
          required: [type]
          properties:
            type: { const: ping }

    RealtimeServerMessage:
      description: A message the server sends over `/realtime`.
      oneOf:
        - type: object
          required: [type, deviceId, serverTime]
          properties:
            type: { const: hello }
            deviceId: { type: string }
            serverTime:
              type: string
              format: date-time
              description: For extrapolating playback position.
        - type: object
          required: [type, feed, cursor]
          description: A feed advanced; fetch its changes. Several changes may arrive as one notification.
          properties:
            type: { const: feed }
            feed:
              type: string
              description: '`account`, or `library:{libraryId}`.'
            cursor: { type: string }
        - type: object
          required: [type, state]
          properties:
            type: { const: player }
            state: { $ref: '#/components/schemas/PlayerState' }
        - type: object
          required: [type, queue]
          properties:
            type: { const: queue }
            queue: { $ref: '#/components/schemas/Queue' }
            command:
              description: The command just applied, for devices that replay it locally.
              allOf:
                - $ref: '#/components/schemas/QueueCommand'
        - type: object
          required: [type, devices]
          properties:
            type: { const: devices }
            devices:
              type: array
              items: { $ref: '#/components/schemas/Device' }
        - type: object
          required: [type, command]
          description: Sent to the target device, which carries the command out and reports a `commandResult`.
          properties:
            type: { const: execute }
            command: { $ref: '#/components/schemas/PlayerCommand' }
        - type: object
          required: [type, result]
          description: Sent to the device that issued a command.
          properties:
            type: { const: commandResult }
            result: { $ref: '#/components/schemas/CommandResult' }
        - type: object
          required: [type, activity]
          properties:
            type: { const: activity }
            activity: { $ref: '#/components/schemas/Activity' }
        - type: object
          required: [type, scan]
          properties:
            type: { const: scan }
            scan: { $ref: '#/components/schemas/Scan' }
        - type: object
          required: [type, plugin]
          description: A plugin's status changed — failing, auto-disabled, or recovered.
          properties:
            type: { const: plugin }
            plugin: { $ref: '#/components/schemas/Plugin' }
        - type: object
          required: [type, reason]
          properties:
            type: { const: sessionRevoked }
            reason:
              type: string
              enum: [credentials_changed, logged_out]
        - type: object
          required: [type, serverTime]
          properties:
            type: { const: pong }
            serverTime: { type: string, format: date-time }
