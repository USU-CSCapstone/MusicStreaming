[package]
name = "jewelcase-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
getrandom = "0.4"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
jewelcase-core = { version = "0.1.0", path = "../core" }
jewelcase-ffmpeg = { version = "0.1.0", path = "../ffmpeg" }
jewelcase-plugins = { version = "0.1.0", path = "../plugins" }
jewelcase-scanner = { version = "0.1.0", path = "../scanner" }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["add-extension", "fs", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zxcvbn = { version = "3.1", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
rusqlite = { version = "0.40.2", features = ["hooks"] }
tokio-tungstenite = "0.29"
jewelcase-scanner = { version = "0.1.0", path = "../scanner", features = ["testing"] }

[lints]
workspace = true
