[package]
name = "jewelcase-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
jewelcase-core = { version = "0.1.0", path = "../core" }
jewelcase-ffmpeg = { version = "0.1.0", path = "../ffmpeg" }
jewelcase-scanner = { version = "0.1.0", path = "../scanner" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
lofty = "0.25"
jewelcase-scanner = { version = "0.1.0", path = "../scanner", features = ["testing"] }
