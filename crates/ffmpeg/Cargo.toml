[package]
name = "jewelcase-ffmpeg"
version = "0.1.0"
edition = "2024"

[dependencies]
jewelcase-core = { version = "0.1.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
