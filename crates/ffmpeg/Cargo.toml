[package]
name = "jewelcase-ffmpeg"
version = "0.1.0"
edition = "2024"

[dependencies]
jewelcase-core = { version = "0.1.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rustix = { version = "1", features = ["param", "process"] }

[dev-dependencies]
rustix = { version = "1", features = ["time"] }
tempfile = "3"

[lints]
workspace = true
