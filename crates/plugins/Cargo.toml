[package]
name = "jewelcase-plugins"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "4.0.3"
fastrand = "2"
httpdate = "1.0.3"
jewelcase-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"] }
wasmparser = "0.258"
wasmtime = "49.0.1"
wasmtime-wasi = "49.0.1"

[features]
# A library held in memory and grants built in one call, for this crate's tests.
testing = []

[dev-dependencies]
jewelcase-plugins = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "test-util"] }

[lints]
workspace = true
