[package]
name = "jewelcase-plugins"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["time"] }
wasmparser = "0.258"
wasmtime = "49.0.1"
wasmtime-wasi = "49.0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt"] }
