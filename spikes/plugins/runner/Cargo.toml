[package]
name = "plugin-runner"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Runs an installed plugin with the permissions its admin approved (design/plugins.md §7).
[[bin]]
name = "plugin-run"
path = "src/main.rs"

[dependencies]
wasmtime = "49"
wasmtime-wasi = "49"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
