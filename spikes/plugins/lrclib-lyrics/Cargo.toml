[package]
name = "lrclib-lyrics"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
# cdylib is the plugin; rlib lets the pure LRCLIB logic be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"
