# The plugin execution-model spike (design/general.md §8, §11 #4). Its own
# workspace, so Wasmtime's compile stays out of the main build.
[workspace]
resolver = "3"
members = ["host", "guest-rust", "guest-process"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
debug = "line-tables-only"

# Guests ship stripped, as a plugin author would publish them.
[profile.release.package.guest-rust]
debug = false
strip = true
