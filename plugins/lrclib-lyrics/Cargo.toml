# A first-party example plugin (design/plugins.md §7). Its own workspace: it builds for
# wasm32-wasip2, and the main workspace builds for the host.
[package]
name = "lrclib-lyrics"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib is the plugin; rlib lets the pure LRCLIB logic be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62"

[workspace]

[profile.release]
debug = false
strip = true
